// ミニマップの座標変換パラメータを保持
let _mmParams={s:1,ox:0,oy:0,x0:0,y0:0};
function minimap(){
  const c=document.getElementById('mmc');
  const ctx=c.getContext('2d');
  const cw=c.width,ch=c.height;
  ctx.clearRect(0,0,cw,ch);
  const ns=Object.values(nodes);
  if(!ns.length&&!frames.length)return;
  const xs=ns.map(n=>n.x).concat(frames.map(f=>f.x)),ys=ns.map(n=>n.y).concat(frames.map(f=>f.y));
  const xs2=ns.map(n=>n.x+240).concat(frames.map(f=>f.x+f.w)),ys2=ns.map(n=>n.y+120).concat(frames.map(f=>f.y+f.h));
  const x0=Math.min(...xs)-40,y0=Math.min(...ys)-40;
  const x1=Math.max(...xs2),y1=Math.max(...ys2);
  const s=Math.min((cw-20)/(x1-x0),(ch-20)/(y1-y0))*0.9;
  const ox=(cw-(x1-x0)*s)/2-x0*s,oy=(ch-(y1-y0)*s)/2-y0*s;
  _mmParams={s,ox,oy,x0,y0};
  // 囲い枠を最背面に描画（塗りつぶさずアウトラインのみ。ノードと重なった際の見分けやすさのため）
  // アウトラインの色は、キャンバス上の表示と同じくf.clのパレット色を使う（色未設定なら既定の白系）
  frames.forEach(f=>{
    ctx.strokeStyle=f.cl?P(f.cl).bd:'rgba(255,255,255,0.5)';
    ctx.lineWidth=0.8;
    ctx.strokeRect(f.x*s+ox,f.y*s+oy,f.w*s,f.h*s);
  });
  // 接続線を先に描画
  edges.forEach(e=>{
    const nf2=nodes[e.fn],nt2=nodes[e.tn];if(!nf2||!nt2)return;
    const pf2=P(nf2.cl);
    const cfx=nf2.x*s+ox+20*s,cfy=nf2.y*s+oy+11*s;
    const ctx2x=nt2.x*s+ox+20*s,ctx2y=nt2.y*s+oy+11*s;
    ctx.beginPath();
    ctx.moveTo(cfx,cfy);
    ctx.lineTo(ctx2x,ctx2y);
    ctx.strokeStyle=pf2.bd+'88';
    ctx.lineWidth=0.8;
    ctx.stroke();
  });
  // ノードを明るく描画
  ns.forEach(n=>{
    const p=P(n.cl);
    const bright=lightenColor(p.bd,50);
    ctx.fillStyle=bright+'dd';
    ctx.strokeStyle='rgba(255,255,255,0.4)';
    ctx.lineWidth=0.5;
    ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(n.x*s+ox,n.y*s+oy,40*s,22*s,2);
    else ctx.rect(n.x*s+ox,n.y*s+oy,40*s,22*s);
    ctx.fill();
    ctx.stroke();
  });
  // ビューポート枠（破線・枠のみ）
  ctx.save();
  ctx.strokeStyle='rgba(55,138,221,0.8)';
  ctx.lineWidth=1.5;
  ctx.setLineDash([3,3]);
  ctx.strokeRect(
    (-pan.x/zoom)*s+ox,
    (-pan.y/zoom)*s+oy,
    (wrap.clientWidth/zoom)*s,
    (wrap.clientHeight/zoom)*s
  );
  ctx.restore();
}
// ミニマップのcanvasサイズを実際の表示サイズに合わせる
function resizeMinimap(){
  const mm=document.getElementById('mm');
  const c=document.getElementById('mmc');
  c.width=mm.offsetWidth*window.devicePixelRatio||mm.offsetWidth;
  c.height=mm.offsetHeight*window.devicePixelRatio||mm.offsetHeight;
  c.width=mm.offsetWidth;
  c.height=mm.offsetHeight;
  minimap();
}
new ResizeObserver(resizeMinimap).observe(document.getElementById('mm'));

// ミニマップクリックでジャンプ
document.getElementById('mm').addEventListener('click',e=>{
  const rect=document.getElementById('mmc').getBoundingClientRect();
  const c2=document.getElementById('mmc');
  const mx=(e.clientX-rect.left)*(c2.width/rect.width);
  const my=(e.clientY-rect.top)*(c2.height/rect.height);
  const {s,ox,oy}=_mmParams;
  const canvasX=(mx-ox)/s;
  const canvasY=(my-oy)/s;
  pan.x=-canvasX*zoom+wrap.clientWidth/2;
  pan.y=-canvasY*zoom+wrap.clientHeight/2;
  applyT();
});
let tT;
function toast(msg){
  const t=document.getElementById('toast');
  const isAlert=msg.startsWith('❌')||msg.startsWith('⚠️');
  const isProgress=msg.startsWith('🔄');
  const persistent=isAlert||isProgress;
  t.innerHTML='';
  const span=document.createElement('span');
  span.textContent=msg;
  t.appendChild(span);
  t.classList.toggle('err',isAlert);
  if(persistent){
    const x=document.createElement('span');
    x.className='toast-close';
    x.textContent='✕';
    x.title='閉じる';
    x.addEventListener('click',()=>{t.classList.remove('show');clearTimeout(tT);tT=null;});
    t.appendChild(x);
  }
  t.classList.add('show');
  clearTimeout(tT);
  // エラー・警告（❌/⚠️）と処理中（🔄）は、次のtoast呼び出しか✕クリックまで表示し続ける。
  // それ以外（完了メッセージ等）は従来通り自動で消える
  tT=persistent?null:setTimeout(()=>t.classList.remove('show'),2200);
}

/* ═══════════════════════════════════════
   選択ノードにフォーカス (Ctrl+Shift+F or ダブルクリックfit)
═══════════════════════════════════════ */
function focusSelected(){
  if(selIds.size===0){fitAll();return;}
  const items=[];
  selIds.forEach(id=>{
    const n=nodes[id];
    if(n){
      const el=document.getElementById('nd-'+id);
      items.push({x:n.x,y:n.y,w:el?el.offsetWidth:180,h:el?el.offsetHeight:80});
      return;
    }
    const lb=labels.find(l=>l.id===id);
    if(lb){
      const el=document.getElementById('lb-'+id);
      items.push({x:lb.x,y:lb.y,w:el?el.offsetWidth:120,h:el?el.offsetHeight:24});
      return;
    }
    const fr=frames.find(f=>f.id===id);
    if(fr){items.push({x:fr.x,y:fr.y,w:fr.w,h:fr.h});return;}
    const im=images.find(i=>i.id===id);
    if(im){items.push({x:im.x,y:im.y,w:im.w,h:im.h});return;}
  });
  if(!items.length)return;
  const x0=Math.min(...items.map(i=>i.x))-40;
  const y0=Math.min(...items.map(i=>i.y))-40;
  const x1=Math.max(...items.map(i=>i.x+i.w))+40;
  const y1=Math.max(...items.map(i=>i.y+i.h))+40;
  const ww=wrap.clientWidth,wh=wrap.clientHeight;
  zoom=Math.min(ww/(x1-x0),wh/(y1-y0),2)*0.9;
  pan.x=-x0*zoom+(ww-(x1-x0)*zoom)/2;
  pan.y=-y0*zoom+(wh-(y1-y0)*zoom)/2;
  applyT();
}

/* ═══════════════════════════════════════
   モーダルドラッグ移動（余白をドラッグ）
═══════════════════════════════════════ */
(()=>{
  const md=document.getElementById('md');
  const mo=document.getElementById('mo');
  if(!md)return;
  md.addEventListener('mousedown',e=>{
    if(e.button!==0)return;
    // 入力系・ボタン・スクロールバー上は除外
    if(e.target.closest('input,textarea,select,button,.swrow,.md-memo-wrap'))return;
    // 右下角（ブラウザ標準のリサイズハンドル領域）は移動処理の対象から除外し、
    // ネイティブのresize:bothにリサイズ動作を譲る（従来はここも移動扱いになってしまっていた）
    const rr=md.getBoundingClientRect();
    if((rr.right-e.clientX)<20&&(rr.bottom-e.clientY)<20)return;
    e.preventDefault();
    const r=md.getBoundingClientRect();
    const ox=e.clientX-r.left,oy=e.clientY-r.top;
    mo.style.alignItems='flex-start';
    mo.style.justifyContent='flex-start';
    md.style.position='fixed';
    md.style.left=r.left+'px';
    md.style.top=r.top+'px';
    md.style.margin='0';
    md.style.cursor='grabbing';
    function mm(ev){
      md.style.left=Math.max(0,Math.min(window.innerWidth-md.offsetWidth,ev.clientX-ox))+'px';
      md.style.top=Math.max(0,Math.min(window.innerHeight-md.offsetHeight,ev.clientY-oy))+'px';
    }
    function mu(){
      md.style.cursor='';
      document.removeEventListener('mousemove',mm);
      document.removeEventListener('mouseup',mu);
    }
    document.addEventListener('mousemove',mm);
    document.addEventListener('mouseup',mu);
  });
})();

/* ═══════════════════════════════════════
   DRAFT MEMO（画面固定メモ・プロジェクトごと）
   #cv-mini-bar / #draft-box はどちらも#cvの外側にあるため、パン・ズームの影響を受けない。
═══════════════════════════════════════ */
const DRAFT_MEMO_OPEN_GAP=8; // 初めてDraftを開く時、ボタン下端からメモ本体上端までの間隔(px)
const DRAFT_MEMO_W=280; // Draftメモ本体の初期幅(px)。保存済みサイズが無い場合に使う
const DRAFT_MEMO_H=220; // Draftメモ本体の初期高さ(px)。保存済みサイズが無い場合に使う
const DRAFT_MEMO_MIN_W=200; // Draftメモ本体のリサイズ最小幅(px)。操作できなくなるほど小さくならないようにする
const DRAFT_MEMO_MIN_H=120; // Draftメモ本体のリサイズ最小高さ(px)。操作できなくなるほど小さくならないようにする
const DRAFT_MEMO_FONT_SIZE_DEFAULT=13; // Draftメモの文字サイズ初期値(px)。DRAFT_FONT_SIZESの中から選べる
const DRAFT_FONT_SIZES={s:13,m:16,l:20}; // Draftメモの文字サイズ選択肢。ノード/囲い枠/テキストラベルのFONT_SIZES(13/20/28)とは独立した値
(()=>{
  const openBtn=document.getElementById('btn-draft-open');
  const box=document.getElementById('draft-box');
  const header=document.getElementById('draft-header');
  const foldBtn=document.getElementById('draft-fold');
  const textEl=document.getElementById('draft-text');
  const resizeHandles=document.querySelectorAll('.draft-rs');
  const draftSizePopup=document.getElementById('draft-size-popup');

  // 保存済みの文字サイズ（draftFontSize）があればそれを、無ければ初期値(13px)を適用する。
  // プロジェクト読込時にも呼び直せるよう関数化してwindowに公開する
  function applyDraftFontSize(){
    textEl.style.fontSize=(draftFontSize||DRAFT_MEMO_FONT_SIZE_DEFAULT)+'px';
  }
  applyDraftFontSize();
  window.applyDraftFontSize=applyDraftFontSize;

  // 文字サイズ選択：#draft-header上での右クリックでポップアップを開く。
  // 上部の帯にボタンを増やすと移動用に掴める範囲が狭くなるため、既存の見た目を変えずに
  // 右クリックメニューで選ぶ方式にした（囲い枠・テキストラベルの文字サイズ選択と同じ操作感）
  let _draftSizePopupJust=false;
  function openDraftSizePopup(cx,cy){
    _draftSizePopupJust=true;
    setTimeout(()=>{_draftSizePopupJust=false;},200);
    const cur=draftFontSize||DRAFT_MEMO_FONT_SIZE_DEFAULT;
    draftSizePopup.innerHTML=Object.entries(DRAFT_FONT_SIZES).map(([k,px])=>
      `<div class="dssw${px===cur?' on':''}" data-fs="${k}">${k==='s'?'小':k==='m'?'中':'大'}（${px}px）</div>`
    ).join('');
    draftSizePopup.querySelectorAll('.dssw').forEach(sw=>{
      sw.addEventListener('click',e=>{
        e.stopPropagation();
        draftFontSize=DRAFT_FONT_SIZES[sw.dataset.fs];
        applyDraftFontSize();
        persist();markUnsaved();
        closeDraftSizePopup();
      });
    });
    draftSizePopup.style.left=Math.min(cx,window.innerWidth-140)+'px';
    draftSizePopup.style.top=Math.min(cy,window.innerHeight-120)+'px';
    draftSizePopup.classList.add('show');
  }
  function closeDraftSizePopup(){draftSizePopup.classList.remove('show');}
  document.addEventListener('click',e=>{
    if(_draftSizePopupJust)return;
    if(!e.target.closest('#draft-size-popup'))closeDraftSizePopup();
  });
  header.addEventListener('contextmenu',e=>{
    e.preventDefault();e.stopPropagation();
    openDraftSizePopup(e.clientX,e.clientY);
  });

  // 保存済みサイズ（draftW/draftH）があればそれを、無ければ初期サイズを適用する。
  // プロジェクト読込時にも呼び直せるよう関数化してwindowに公開する
  function applyDraftSize(){
    box.style.width=(draftW||DRAFT_MEMO_W)+'px';
    box.style.height=(draftH||DRAFT_MEMO_H)+'px';
  }
  applyDraftSize();
  window.applyDraftSize=applyDraftSize;

  function placeDraftBox(){
    if(draftX!=null&&draftY!=null){
      box.style.left=draftX+'px';
      box.style.top=draftY+'px';
      return;
    }
    // 保存済みの位置が無い場合（初回表示）：Draftボタンのすぐ下に表示する
    const r=openBtn.getBoundingClientRect();
    box.style.left=r.left+'px';
    box.style.top=(r.bottom+DRAFT_MEMO_OPEN_GAP)+'px';
  }

  function openDraft(){
    placeDraftBox();
    box.classList.add('show');
    openBtn.classList.add('on');
  }
  function closeDraft(){
    box.classList.remove('show');
    openBtn.classList.remove('on');
  }
  // プロジェクト読込時（load/applyLoadedData/impfハンドラ）から最小化状態へ戻すために呼べるようにする
  window.closeDraft=closeDraft;

  // Draftボタンは常時表示。開いている間に押すと閉じる（ヘッダーの畳むボタンと同じ動作）
  openBtn.addEventListener('click',()=>{
    if(box.classList.contains('show')){closeDraft();}else{openDraft();}
  });
  foldBtn.addEventListener('click',closeDraft);

  // 内容編集：打鍵のたびにpushUndoすると既存のUndo履歴が埋まってしまうため、Undoスタックには積まない
  textEl.addEventListener('input',()=>{
    draftText=textEl.value;
    persist();markUnsaved();
  });

  // ドラッグ移動：上部の帯状領域（#draft-header）を掴んだ場合のみ移動を開始する。
  // 畳むボタンはこの帯の中にあるため、button上では移動が始まらないよう除外する
  header.addEventListener('mousedown',e=>{
    if(e.button!==0)return;
    if(e.target.closest('button'))return;
    e.preventDefault();
    const r=box.getBoundingClientRect();
    const ox=e.clientX-r.left,oy=e.clientY-r.top;

    function mm(ev){
      draftX=Math.max(0,Math.min(window.innerWidth-box.offsetWidth,ev.clientX-ox));
      draftY=Math.max(0,Math.min(window.innerHeight-box.offsetHeight,ev.clientY-oy));
      box.style.left=draftX+'px';
      box.style.top=draftY+'px';
    }
    function mu(){
      header.style.cursor='grab';
      document.removeEventListener('mousemove',mm);
      document.removeEventListener('mouseup',mu);
      persist();
    }
    document.addEventListener('mousemove',mm);
    document.addEventListener('mouseup',mu);
  });

  // リサイズ（4隅のハンドルをドラッグ）。#draft-boxは画面固定要素でキャンバスのzoom変形を
  // 受けないため、囲い枠のstartResizeと違いdx/dyをzoomで割らず、そのままpxとして扱う。
  // 掴んだ角の対角（例：左上を掴んだ場合は右下）が動かないよう、幅・高さと一緒にleft/topも調整する
  resizeHandles.forEach(handle=>{
    handle.addEventListener('mousedown',e=>{
      if(e.button!==0)return;
      e.preventDefault();e.stopPropagation();
      const corner=handle.dataset.corner; // 'nw'|'ne'|'sw'|'se'
      const growsLeft=corner==='nw'||corner==='sw'; // 幅の変化で左端が動く（右端が固定）
      const growsUp=corner==='nw'||corner==='ne'; // 高さの変化で上端が動く（下端が固定）
      const r=box.getBoundingClientRect();
      const startW=r.width,startH=r.height,startLeft=r.left,startTop=r.top;
      const sx=e.clientX,sy=e.clientY;
      function mm(ev){
        const dx=ev.clientX-sx,dy=ev.clientY-sy;
        const newW=Math.max(DRAFT_MEMO_MIN_W,startW+(growsLeft?-dx:dx));
        const newH=Math.max(DRAFT_MEMO_MIN_H,startH+(growsUp?-dy:dy));
        draftW=newW;draftH=newH;
        draftX=growsLeft?startLeft+(startW-newW):startLeft;
        draftY=growsUp?startTop+(startH-newH):startTop;
        box.style.width=draftW+'px';
        box.style.height=draftH+'px';
        box.style.left=draftX+'px';
        box.style.top=draftY+'px';
      }
      function mu(){
        document.removeEventListener('mousemove',mm);
        document.removeEventListener('mouseup',mu);
        persist();
      }
      document.addEventListener('mousemove',mm);
      document.addEventListener('mouseup',mu);
    });
  });
})();

// プロジェクトのデータをDraftメモに反映する。GitHub読込・localStorage読込・ローカルJSON読込の
// 3経路すべてから呼ぶ（既存データにdraftText/draftX/draftY/draftW/draftH/draftFontSizeが無い場合は初期値になる
// ＝空欄・未配置・初期サイズ・初期文字サイズ）。開閉状態は保存対象外の仕様のため、読込のたびに必ず最小化状態へ戻す。

// Memo保存ボタンの見た目を更新する（画面右上のSaveボタンのmarkUnsaved/markSavedと同じ考え方）。
// 未保存の変更があるときは.unsavedを付けて青くし、保存済みのときは外す
function updateMemoSaveBtn(){
  const btn=document.getElementById('memo-save-btn');
  if(btn)btn.classList.toggle('unsaved',memoDirty);
}

// shared_memo.jsonを読み込み、Memoの状態へ反映する。GitHub未接続時は何もしない（ボタン側で未接続メッセージを表示する）。
// 起動時の自動読み込み（tryAutoLoadGh）とプロジェクト切り替え（loadGhProject/newProject）の両方から呼ぶ。
// ⚠️ 読み込みに失敗した場合、既存のmemoText等は書き換えない。ここを空データで上書きすると、
// 全プロジェクト共通のMemoが（次の自動保存で）消えてしまう重大なデータ損失につながるため
async function loadSharedMemo(){
  if(!isGhConfigured())return;
  memoLoaded=false;
  try{
    const f=await ghGetFile(MEMO_SAVE_PATH);
    if(f){
      const d=JSON.parse(f.text);
      memoText=d.memoText||'';
      memoX=(typeof d.memoX==='number')?d.memoX:null;
      memoY=(typeof d.memoY==='number')?d.memoY:null;
      memoW=(typeof d.memoW==='number')?d.memoW:null;
      memoH=(typeof d.memoH==='number')?d.memoH:null;
      memoFontSize=(typeof d.memoFontSize==='number')?d.memoFontSize:null;
      memoSha=f.sha;
    }else{
      // ファイルが存在しない：空メモとして扱う。何か書いて保存されたタイミングで初めてファイルが作られる
      memoText='';memoX=null;memoY=null;memoW=null;memoH=null;memoFontSize=null;
      memoSha=null;
    }
    memoDirty=false;
    updateMemoSaveBtn();
    memoLoadFailed=false;
    memoLoaded=true;
    document.getElementById('memo-text').value=memoText;
    if(window.applyMemoSize)window.applyMemoSize();
    if(window.applyMemoFontSize)window.applyMemoFontSize();
  }catch(err){
    memoLoadFailed=true;
    if(window.closeMemo)window.closeMemo();
    toast('❌ Memoの読み込みに失敗しました: '+err.message);
  }
}

// shared_memo.jsonへ保存する。他端末での更新によりshaが古くなっていた場合（409/422）は
// 最新shaを取り直して1回だけ再試行し、それでも失敗したらエラーを表示して手元の内容はそのまま保持する（破棄しない）
// manual=trueのとき（保存ボタンでの明示的な保存）のみ、保存中・保存完了のメッセージを表示する。
// 自動保存（10秒デバウンス）で毎回表示すると煩わしいため、自動保存時はメッセージを出さない
async function performMemoSave(manual=false){
  if(manual)toast('🔄 保存中...');
  const body=JSON.stringify({
    memoText,memoX,memoY,memoW,memoH,
    memoFontSize:memoFontSize||MEMO_FONT_SIZE_DEFAULT
  },null,2);
  const msg=`Update shared memo: ${new Date().toISOString()}`;
  try{
    let result;
    try{
      result=await ghPutFile(MEMO_SAVE_PATH,body,msg,memoSha);
    }catch(err){
      if(err.status===409||err.status===422){
        const freshSha=await ghGetFileSha(MEMO_SAVE_PATH);
        result=await ghPutFile(MEMO_SAVE_PATH,body,msg,freshSha);
      }else throw err;
    }
    memoSha=result.content&&result.content.sha;
    memoDirty=false;
    updateMemoSaveBtn();
    if(manual)toast('Memoを保存しました');
  }catch(err){
    toast('❌ Memoの保存に失敗しました: '+err.message);
    // 手元の内容（memoText等）とmemoDirtyはそのまま保持する。次の入力や切り替え時に再度保存を試みる
  }
}

// 内容・位置・大きさ・文字サイズの変更のたびに呼ぶ：タイマーをリセットし、止まってから10秒後に1回だけ保存する
function scheduleMemoSave(){
  memoDirty=true;
  updateMemoSaveBtn();
  if(memoSaveTimer)clearTimeout(memoSaveTimer);
  memoSaveTimer=setTimeout(()=>{
    memoSaveTimer=null;
    memoSavePromise=performMemoSave().finally(()=>{memoSavePromise=null;});
  },MEMO_SAVE_DEBOUNCE_MS);
}

// プロジェクト切り替え・ページ離脱の直前に呼ぶ：保留中の自動保存タイマーを即時実行し、完了を待つ
async function flushMemoSave(){
  if(memoSaveTimer){clearTimeout(memoSaveTimer);memoSaveTimer=null;}
  if(memoSavePromise)await memoSavePromise;
  if(memoDirty){
    memoSavePromise=performMemoSave().finally(()=>{memoSavePromise=null;});
    await memoSavePromise;
  }
}

// ページを閉じる直前の保存：await前提の通常の保存処理は完了を待てないため、
// ブラウザがナビゲーション後も送信を継続してくれるkeepalive付きfetchで直接送信する
// （ページが閉じるため、sha競合時の再試行やエラー表示は行わないベストエフォート）
window.addEventListener('beforeunload',()=>{
  if(memoSaveTimer){clearTimeout(memoSaveTimer);memoSaveTimer=null;}
  if(!memoDirty)return;
  const c=getGhConfig();
  if(!c||!c.user||!c.repo||!c.token)return;
  const body={
    message:`Update shared memo (page close): ${new Date().toISOString()}`,
    content:b64EncodeUtf8(JSON.stringify({
      memoText,memoX,memoY,memoW,memoH,
      memoFontSize:memoFontSize||MEMO_FONT_SIZE_DEFAULT
    },null,2)),
    branch:ghBranch()
  };
  if(memoSha)body.sha=memoSha;
  fetch(ghUrl(MEMO_SAVE_PATH),{
    method:'PUT',keepalive:true,
    headers:{'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
    body:JSON.stringify(body)
  }).catch(()=>{});
});

/* ═══════════════════════════════════════
   IMAGE DELETE CONFIRM MODAL
   （GitHub上の画像削除確認：3択 = 両方削除／Nodemap上のみ削除／キャンセル）
═══════════════════════════════════════ */
function confirmImageDelete(count){
  return new Promise(resolve=>{
    const mo=document.getElementById('imgdel-mo');
    const msg=document.getElementById('imgdel-msg');
    msg.textContent=count>1
      ?`選択した${count}件の画像を削除します。GitHub上のファイルも削除しますか？\n\n※GitHub上のファイル削除はUndoで元に戻せません`
      :'この画像を削除します。GitHub上のファイルも削除しますか？\n\n※GitHub上のファイル削除はUndoで元に戻せません';
    msg.style.whiteSpace='pre-line';
    const btnBoth=document.getElementById('imgdel-both');
    const btnLocal=document.getElementById('imgdel-local');
    const btnCancel=document.getElementById('imgdel-cancel');
    function cleanup(result){
      mo.classList.remove('show');
      btnBoth.removeEventListener('click',onBoth);
      btnLocal.removeEventListener('click',onLocal);
      btnCancel.removeEventListener('click',onCancel);
      mo.removeEventListener('mousedown',onOverlay);
      resolve(result);
    }
    function onBoth(){cleanup('both');}
    function onLocal(){cleanup('local');}
    function onCancel(){cleanup('cancel');}
    function onOverlay(e){if(e.target.id==='imgdel-mo')cleanup('cancel');}
    btnBoth.addEventListener('click',onBoth);
    btnLocal.addEventListener('click',onLocal);
    btnCancel.addEventListener('click',onCancel);
    mo.addEventListener('mousedown',onOverlay);
    mo.classList.add('show');
  });
}

// リポジトリのメタ情報を取得（接続テスト結果に実際のリポジトリ名を表示するため）
async function ghRepoInfo(){
  const c=getGhConfig();
  const res=await fetch(`https://api.github.com/repos/${encodeURIComponent(c.user)}/${encodeURIComponent(c.repo)}`,{
    cache:'no-store',
    headers:{'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json'}
  });
  if(!res.ok)throw new Error(`リポジトリ情報取得エラー: ${res.status}`);
  return await res.json();
}

  saveGhConfig({user,repo,branch,token});

    if(!r.ok)throw new Error(r.status===404?'リポジトリまたはブランチが見つかりません':`接続エラー: ${r.status}`);

    setTimeout(()=>{closeGhModal();tryAutoLoadGh();},1200);
  }catch(err){

  }
};

/* ═══════════════════════════════════════
   PROJECT HISTORY
═══════════════════════════════════════ */
(()=>{
  const btn=document.getElementById('proj-hist-btn');
  const drop=document.getElementById('proj-hist-drop');

  async function newProject(){
    closeDrop();
    if(_unsaved&&!confirm('未保存の変更があります。保存せずに新規プロジェクトを作成しますか？'))return;
    await flushMemoSave(); // 切り替え処理が始まる前にMemoの保存を完了させる（順序を誤ると切替先の状態で上書きされるため）
    // データリセット
    nodes={};edges=[];labels=[];frames=[];images=[];
    pan={x:60,y:40};zoom=1;
    applyDraftData({}); // Draftメモも空欄・未配置の初期状態に戻す
    curPid=genPid();
    loadGeneration++;
    setLastPid(curPid);
    const pn=document.getElementById('proj-name');
    pn.value='New Project';
    renderAll();
    persist();
    markSaved();
    // 新規作成後の初期状態をundoStackに積む
    undoStack=[takeSnapshot()];redoStack=[];updateUndoButtons();
    // proj-nameを選択状態にしてすぐ編集できるように
    setTimeout(()=>{pn.focus();pn.select();},80);
    toast('新規プロジェクトを作成しました。プロジェクト名を変更してください。');
    loadSharedMemo(); // 新規プロジェクトを開いた扱いとして、Memoも読み直す
  }

  // 読み込んだデータをアプリの状態へ反映する共通処理
  // プロジェクトを開いたときのカメラ位置は、保存済みのpan/zoomを使わず常に全体表示に統一する
  function applyLoadedData(d){
    nodes=d.nodes||{};edges=d.edges||[];
    labels=d.labels||[];frames=d.frames||[];images=d.images||[];
    curPid=d.pid;
    loadGeneration++;
    document.getElementById('proj-name').value=d.proj||'My Project';
    applyDraftData(d);
    renderAll();
    fitAll(); // 常に全体表示
    persist();markSaved();
    undoStack=[takeSnapshot()];redoStack=[];updateUndoButtons();
    hydrateGhImages();
  }
  window.applyLoadedData=applyLoadedData; // このIIFEの外（tryAutoLoadGh等）からも呼べるようにする

  async function loadGhProject(path,fallbackName){
    closeDrop();
    if(_unsaved&&!confirm('未保存の変更があります。保存せずに切り替えますか？'))return;
    await flushMemoSave(); // 切り替え処理が始まる前にMemoの保存を完了させる（順序を誤ると切替先の状態で上書きされるため）
    // このセッション中に一度開いたプロジェクトは再取得せず即座に表示する（切り替えのラグ対策）。
    // ページを再読み込みすればキャッシュは破棄され、必ずGitHubから取り直す。
    const cachedProj=ghProjectDataCache[path];
    if(cachedProj){
      const d=migrateData(JSON.parse(JSON.stringify(cachedProj)));
      applyLoadedData(d);
      setLastPid(d.pid);
      setGhProjectCacheEntry(d.pid,d.proj||fallbackName);
      loadSharedMemo(); // プロジェクトを開くたびにMemoも読み直す
      toast(`読み込みました: ${d.proj||fallbackName}`);
      return;
    }
    toast('🔄 読み込み中...');
    try{
      const f=await ghGetFile(path);
      if(!f){toast('❌ 読み込み失敗：ファイルが見つかりません');return;}
      let d=JSON.parse(f.text);
      d=migrateData(d);
      dataShaCache[d.pid]=f.sha;
      ghProjectDataCache[path]=JSON.parse(JSON.stringify(d));
      applyLoadedData(d);
      setLastPid(d.pid);
      setGhProjectCacheEntry(d.pid,d.proj||fallbackName);
      loadSharedMemo(); // プロジェクトを開くたびにMemoも読み直す
      toast(`読み込みました: ${d.proj||fallbackName}`);
    }catch(err){
      toast('❌ 読み込み失敗: '+err.message);
    }
  }

  const GH_DROP_LIMIT=5;
  let ghDropExpanded=false; // 「すべて表示」が押されたら真。ドロップダウンを開き直すたびリセット
  let ghDropFiles=[]; // 現在表示中の並び順（日時が後から届いても勝手に並べ替えないため保持する）

  // 表示用の日時を決める優先順位：
  //  1. GitHubから取得済みの正確な最終コミット日時（セッション中キャッシュ）
  //  2. 端末に残っている前回の保存/読込日時
  //  3. pidから復元した作成日時（通信不要。空欄を避けるための最終手段）
  function dropDateFor(path,pid,cache){
    const exact=ghFileDateCache[path];
    if(exact)return exact;
    const cached=cache[pid];
    if(cached&&cached.date)return cached.date;
    return dateFromPid(pid);
  }

  function sortDropFiles(files,cache){
    return files.slice().sort((a,b)=>{
      const pa=a.name.replace(/\.json$/,''),pb=b.name.replace(/\.json$/,'');
      const da=dropDateFor(a.path,pa,cache),db=dropDateFor(b.path,pb,cache);
      if(da&&db)return db.localeCompare(da); // 新しい順
      if(da&&!db)return -1; // 日時不明は末尾へ
      if(!da&&db)return 1;
      return 0;
    });
  }

  // GitHub接続時：data/フォルダの一覧を取得したら即座に表示し、
  // 正確な最終コミット日時は裏側で取得して「日付表示だけ」を差し替える（並び順は動かさない）
  async function renderDropGh(){
    ghDropExpanded=false;
    if(ghDirListCache){
      // 2回目以降：前回取得した一覧をまず即座に表示し、裏側で最新版を取り直して差分があれば静かに反映する
      const files=ghDirListCache.filter(f=>f.type==='file'&&f.name.endsWith('.json'));
      ghDropFiles=sortDropFiles(files,getGhProjectCache());
      renderGhList(ghDropFiles);
      fillExactDates(ghDropFiles);
      refreshDirListQuietly();
      return;
    }
    // 初回：手がかりが無いため、通信を待ってから表示するしかない
    const loadingHtml='<div class="ph-new" id="ph-new-btn">＋ 新規プロジェクト作成</div><div class="ph-sep"></div><div class="ph-empty">読み込み中...</div>';
    drop.innerHTML=loadingHtml;
    document.getElementById('ph-new-btn').addEventListener('click',newProject);
    let raw;
    try{
      raw=await ghListDir('data');
    }catch(err){
      drop.innerHTML='<div class="ph-new" id="ph-new-btn">＋ 新規プロジェクト作成</div><div class="ph-sep"></div><div class="ph-empty">一覧の取得に失敗しました</div>';
      document.getElementById('ph-new-btn').addEventListener('click',newProject);
      return;
    }
    ghDirListCache=raw;
    const files=raw.filter(f=>f.type==='file'&&f.name.endsWith('.json'));
    ghDropFiles=sortDropFiles(files,getGhProjectCache());
    renderGhList(ghDropFiles); // まず手元の情報だけで即表示
    fillExactDates(ghDropFiles); // 正確な日時は裏側で取得（awaitしない）
  }

  // 裏側で最新のファイル一覧を取り直し、キャッシュを更新する。
  // 一覧の中身（存在するファイルの集合）に変化があり、かつドロップダウンがまだ開いたままの場合のみ、
  // 表示を静かに再描画する（変化が無ければ何もせず、ちらつきを避ける）
  async function refreshDirListQuietly(){
    try{
      const raw=await ghListDir('data');
      const newFiles=raw.filter(f=>f.type==='file'&&f.name.endsWith('.json'));
      const oldPaths=ghDirListCache.filter(f=>f.type==='file'&&f.name.endsWith('.json')).map(f=>f.path).sort().join(',');
      const newPaths=newFiles.map(f=>f.path).sort().join(',');
      ghDirListCache=raw;
      if(newPaths===oldPaths)return; // 変化なし
      ghDropFiles=sortDropFiles(newFiles,getGhProjectCache());
      if(drop.classList.contains('show')){
        renderGhList(ghDropFiles);
        fillExactDates(ghDropFiles);
      }
    }catch{/* 裏側の更新なので、失敗してもキャッシュ表示のまま静かに無視する */}
  }

  // 正確な最終コミット日時を取得し、表示中の該当項目の日付だけを静かに更新する。
  // 並び順は変えない（勝手に順序が入れ替わると混乱するため。並べ替えは「並び順を更新」ボタンで明示的に行う）
  async function fillExactDates(files){
    const targets=files.filter(f=>ghFileDateCache[f.path]===undefined);
    if(!targets.length)return;
    await Promise.all(targets.map(async f=>{
      const iso=await ghGetLastCommitDate(f.path);
      ghFileDateCache[f.path]=iso;
      if(!iso)return;
      // ドロップダウンが開いたままの場合のみ、該当項目の日付表示を差し替える
      const item=drop.querySelector(`.ph-item[data-path="${CSS.escape(f.path)}"] .ph-date`);
      if(item)item.textContent=formatHistDate(iso);
    }));
  }

  function renderGhList(files){
    const cache=getGhProjectCache();
    let html='<div class="ph-new" id="ph-new-btn">＋ 新規プロジェクト作成</div>';
    if(files.length>0){
      html+='<div class="ph-item" id="ph-resort" style="justify-content:center;color:#7ab4e0">並び順を更新</div>';
      html+='<div class="ph-sep"></div>';
      const shown=ghDropExpanded?files:files.slice(0,GH_DROP_LIMIT);
      html+=shown.map(f=>{
        const pid=f.name.replace(/\.json$/,'');
        const cached=cache[pid];
        const name=cached?cached.proj:pid;
        const dateIso=dropDateFor(f.path,pid,cache);
        const date=dateIso?formatHistDate(dateIso):'';
        return `<div class="ph-item" data-path="${esc(f.path)}" data-pid="${esc(pid)}" title="${esc(f.path)}">
          <span class="ph-name">${esc(name)}</span>
          <span class="ph-date">${esc(date)}</span>
        </div>`;
      }).join('');
      if(!ghDropExpanded&&files.length>GH_DROP_LIMIT){
        html+=`<div class="ph-sep"></div><div class="ph-item" id="ph-show-all" style="justify-content:center;color:#7ab4e0">すべて表示（${files.length}件）</div>`;
      }
    }else{
      html+='<div class="ph-sep"></div><div class="ph-empty">プロジェクトはまだありません</div>';
    }
    drop.innerHTML=html;
    document.getElementById('ph-new-btn').addEventListener('click',newProject);
    drop.querySelectorAll('.ph-item[data-path]').forEach(item=>{
      item.addEventListener('click',()=>{
        loadGhProject(item.dataset.path,item.dataset.pid);
      });
    });
    const resortBtn=document.getElementById('ph-resort');
    if(resortBtn){
      resortBtn.addEventListener('click',(e)=>{
        e.stopPropagation();
        ghDropFiles=sortDropFiles(ghDropFiles,getGhProjectCache());
        renderGhList(ghDropFiles);
        fillExactDates(ghDropFiles);
      });
    }
    const showAllBtn=document.getElementById('ph-show-all');
    if(showAllBtn){
      showAllBtn.addEventListener('click',(e)=>{
        e.stopPropagation();
        ghDropExpanded=true;
        renderGhList(files);
      });
    }
  }

  // GitHub未接続時：従来通りローカル読み込み履歴からファイル選択を促す
  function renderDropLocal(){
    const hist=getHistory();
    let html='<div class="ph-new" id="ph-new-btn">＋ 新規プロジェクト作成</div>';
    if(hist.length>0){
      html+='<div class="ph-sep"></div>';
      html+=hist.map(h=>`
        <div class="ph-item" data-file="${esc(h.file)}" title="${esc(h.file)}">
          <span class="ph-name">${esc(h.proj||h.file)}</span>
          <span class="ph-date">${formatHistDate(h.date)}</span>
        </div>`).join('');
    }else{
      html+='<div class="ph-sep"></div><div class="ph-empty">読み込み履歴はありません</div>';
    }
    drop.innerHTML=html;
    document.getElementById('ph-new-btn').addEventListener('click',newProject);
    drop.querySelectorAll('.ph-item').forEach(item=>{
      item.addEventListener('click',()=>{
        closeDrop();
        toast('📂 JSONファイルを選択してください（'+item.dataset.file+'）');
        document.getElementById('impf').click();
      });
    });
  }

  function openDrop(){
    const r=btn.getBoundingClientRect();
    drop.style.left=r.left+'px';
    drop.classList.add('show');
    if(isGhConfigured())renderDropGh();else renderDropLocal();
  }
  function closeDrop(){drop.classList.remove('show');}

  btn.addEventListener('click',e=>{
    e.stopPropagation();
    drop.classList.contains('show')?closeDrop():openDrop();
  });
  document.addEventListener('click',e=>{
    if(!drop.contains(e.target)&&e.target!==btn)closeDrop();
  });
})();

// 起動時のGitHub自動読み込み（前回開いていたプロジェクトを再読込）
async function tryAutoLoadGh(){
  if(!isGhConfigured())return;
  loadSharedMemo(); // 起動時の自動読み込み対象。前回のプロジェクトが無い場合でも必ず読み込む
  const pid=getLastPid();
  if(!pid){
    setTimeout(()=>toast('▾からプロジェクトを選択、または新規作成してください'),1000);
    return;
  }
  toast('🔄 ☁️ GitHubから読み込み中...');
  const path=`data/${pid}.json`;
  try{
    const f=await ghGetFile(path);
    if(!f){
      toast('⚠️ 前回のプロジェクトがGitHub上に見つかりません。▾から選択してください');
      return;
    }
    let d=JSON.parse(f.text);
    d=migrateData(d);
    dataShaCache[d.pid]=f.sha;
    ghProjectDataCache[path]=JSON.parse(JSON.stringify(d)); // 切り替え高速化用キャッシュにもここで登録する
    applyLoadedData(d); // 全体表示・undo初期化等はここで一元管理（重複実装によるズレを防ぐ）
    setGhProjectCacheEntry(d.pid,d.proj||'');
    toast('☁️ GitHubから読み込みました');
  }catch(err){
    toast('❌ GitHub自動読込に失敗しました: '+err.message);
  }
}

/* ═══════════════════════════════════════
   INIT
═══════════════════════════════════════ */
load();renderAll();updateTitle();setTimeout(fitAll,100);
// renderAll後に初期状態をundoStackに積む（最初の操作もUndoできるように）
undoStack=[takeSnapshot()];redoStack=[];
updateUndoButtons();
updateGhStatusLabel();
if(isGhConfigured()){
  tryAutoLoadGh();
}else{
  setTimeout(()=>toast('⚙️ 画面右上のGitHubボタンから接続設定を行ってください'),1200);
}
window.addEventListener('resize',()=>{applyT();minimap();});
</script>
