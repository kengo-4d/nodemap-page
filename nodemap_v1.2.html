<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nodemap</title>
<!--
===========================================
 NODEMAP v1 チェックリスト
 改良後は以下を必ず確認すること
===========================================

【基本操作】
□ ノードの追加（ツールバー・右クリック）
□ ノードの移動（ドラッグ）
□ ノードの削除（右クリック・Deleteキー）
□ ダブルクリックで編集モーダルが開く
□ モーダルのSave・Cancelが動作する
□ モーダル外クリックで閉じない（編集状態維持）
□ モーダルをリサイズしても閉じない
□ JSONボタンでノード単体のJSONが表示される（左寄せ・Cancelと同デザイン）
□ JSON編集パネルを開いた状態でSaveすると編集内容が反映される
□ JSON内のidを書き換えてもSave時に元のIDに強制される
□ 不正なJSON（構文エラー）はSave時にエラー表示され反映されない
□ JSONパネルを開かずに通常フォームでSaveすると今まで通り動作する

【接続】
□ ハンドル（○）をドラッグして接続線を引ける
□ メモの・行のハンドルから接続線を引ける
□ メモ行を編集・追加してもSaveすると既存の接続線が切れずに維持される
□ メモ行を編集モーダルで開くと「・[1]テキスト」のようにID付きで表示される
□ キャンバス上（ノード本体）ではIDが見えずテキストのみ表示される
□ 同じID番号を2行に書いてSaveすると重複警告が出る（保存続行/編集続行を選べる）
□ 既存のID番号を消す・書き換えるとSave時に警告が出る
□ ID番号の対応するテキストが入れ替わった場合もSave時に警告が出る（接続は維持・新しい行を指す）
□ ID番号が消失した場合は警告→保存続行すると該当の接続線は自動削除される
□ 警告でキャンセルすると編集を続けられる、OKすると保存される
□ 新しい・行を追加してSaveすると自動で新しいID番号が振られる
□ メモハンドルがあるノードは右ハンドルが非表示（・行があれば右ハンドルは使わない仕様）
□ 右クリックメニューに「ここから接続」は無い（廃止・余白ドロップでの新規接続に統合）
□ 接続線を右クリックで削除できる
□ 接続線をクリックでハイライト・Deleteで削除
□ 同じハンドルから同じ着地点へ再接続すると古い接続を置き換える（誤操作の上書き）
□ Aの右→Bの左で接続後、Bの左→Aの右と逆ハンドルから引いても1本に置き換わる
□ ・1→Bと・2→Bのように異なるハンドルから同じ着地点に繋ぐと両方共存する（収束を許容）
□ ・1→Bと・2→Cのように異なる着地点なら両方共存する

【選択・整列】
□ Ctrl+クリックで複数選択
□ 背景ドラッグで範囲選択（ノード・フレーム・テキスト）
□ 複数選択してドラッグで一括移動
□ 整列ボタン6種が動作する
□ Deleteキーで選択要素を削除

【囲い枠】
□ ノード選択後に囲い枠追加ボタンで自動生成
□ 未選択時に囲い枠追加ボタンで描画モード
□ 囲い枠のリサイズ（ホバー時にハンドル表示）
□ 囲い枠タイトルのクリック・ダブルクリック編集
□ 囲い枠の右クリックメニュー（名称変更・削除）

【テキストラベル】
□ テキストの追加・移動
□ ダブルクリックでインライン編集
□ テキストの右クリック削除

【表示・ナビゲーション】
□ 中ボタンドラッグでパン（Windows）
□ 2本指スワイプでパン（Mac）
□ ピンチ・ホイールでズーム
□ 全体表示ボタン・zキーがノード以外（テキスト・画像・囲い枠）も含めて全体表示する
□ ミニマップが表示される

【メモ表示】
□ - テキスト → 通常テキストとして表示
□ ・テキスト → ハンドル付き行として表示
□ URL → リンクとして表示・クリックでジャンプ
□ それ以外の行は表示されない

【画像配置】
□ D&Dで画像を追加できる（blobURLで一時表示）
□ ツールバー・右クリックで画像追加できる
□ パスラベルをクリックして絶対パスを設定できる
□ 絶対パス設定後は実際のファイルが表示される
□ 通常リサイズ：縦横比を維持してリサイズ
□ Shift+ハンドル：自由変形（トリミング枠変形）
□ Shift+画像内ドラッグ：トリミング枠を移動
□ ダブルクリックで全画面ビューワ表示
□ 8点リサイズハンドル（ホバー時表示）
□ 画像不可時グレープレースホルダー表示

【データ管理】
□ Saveボタンでcanvas_プロジェクト名.jsonをダウンロード
□ Backupボタンでタイムスタンプ付きJSONをダウンロード
□ LoadボタンでJSONを読み込める
□ ページ再読み込み後もデータが残る
□ プロジェクト名の変更が保存される

【プロジェクト管理】
□ ▾ボタンで最近のプロジェクト履歴が表示される
□ 履歴クリックでLoadダイアログが開く
□ 新規プロジェクト作成が動作する
□ 未保存時に新規作成すると確認ダイアログが出る
□ 新規作成後にプロジェクト名が選択状態になる

【Undo/Redo】
□ Ctrl+Zで直前の操作を元に戻せる（最大20回）
□ Ctrl+Yでやり直せる（Ctrl+Shift+Zはブラウザと競合するため非対応）
□ Undo/Redoボタンが動作する
□ 操作がない時はUndo/Redoボタンがdisabledになる
□ 最初の操作も1回目のCtrl+Zで戻る（2回目まで反応しない、は不具合）
□ ノード移動・画像リサイズ・トリミング・フレームリサイズ：
  最初のUndoで「操作開始前」の状態に戻る（操作直後の状態に戻るのは不具合）
□ ノード追加・編集・削除・移動がUndoできる
□ テキストラベル追加・編集（変更時のみ）・削除がUndoできる
□ 囲い枠追加・タイトル編集（変更時のみ）・リサイズ・削除がUndoできる
□ 接続線追加・削除・方向変更がUndoできる
□ 画像追加・削除・パス編集（変更時のみ）・埋め込みがUndoできる
□ Ctrl+D複製・カラー変更・矢印キー移動がUndoできる
□ 矢印キー連続押下は離した時にまとめて1回分のUndoになる
□ 新規プロジェクト作成後にUndoスタックがリセットされる
□ Loadでプロジェクトを切り替えた後にUndoスタックがリセットされる
  （切替前のプロジェクトの内容がUndoで復元されない）

【右クリックメニュー】
□ 全メニューアイコンがモノクロSVGで表示される
□ ノードメニュー：編集・カラー・複製・削除（子ノード追加・ここから接続は廃止＝接続線を空白に伸ばして追加する機能に統合）
□ キャンバスメニュー：追加・テキスト・囲い枠・画像・削除
□ エッジメニュー：方向4種・削除
□ フレームメニュー：名称変更・削除
□ 画像メニュー：パス編集・埋め込み・削除

===========================================
-->
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#141412;--dot:rgba(255,255,255,0.065);
  --text:#f0ede8;--text-s:#a0a09c;--text-t:#484846;
  --border:rgba(255,255,255,0.1);--bh:rgba(255,255,255,0.22);
  --blue:#378add;--blue-d:rgba(55,138,221,0.18);
  /* 「現在の状態」を示すボタン（grid・囲い枠・Memo・Draft・JSON表示など）の押された見た目の色。
     Saveボタンの警告色（青）とは区別し、主張しすぎない薄いグレーにしている */
  --gray-d:rgba(255,255,255,0.14);
  --th:50px;
  /* Draftメモのリサイズ領域が枠線の外側にはみ出す幅(px)。内側にも同じ幅を取るため、
     ハンドル一辺の長さは必ずこの2倍になる。値を調整したい場合はここだけを変える */
  --draft-rs-outset:6px;
}
html,body{width:100%;height:100%;overflow:hidden;
  font-family:'Meiryo','Yu Gothic UI',-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Segoe UI',sans-serif;
  background:var(--bg);color:var(--text)}

/* TOOLBAR */
#tb{position:fixed;top:0;left:0;right:0;height:var(--th);
  background:rgba(20,20,18,0.96);backdrop-filter:blur(10px);
  border-bottom:0.5px solid var(--border);
  display:flex;align-items:center;padding:0 14px;z-index:300;gap:10px}
#proj-name{font-size:18px;font-weight:600;color:var(--text);
  background:transparent;border:none;outline:none;
  border-bottom:1px solid transparent;cursor:pointer;
  padding:2px 4px;min-width:80px;max-width:220px;transition:border-color .15s}
#proj-name:hover{border-bottom-color:var(--border)}
#proj-name:focus{border-bottom-color:var(--blue);cursor:text}
/* プロジェクト履歴ドロップダウン */
#proj-hist-btn{background:transparent;border:none;padding:2px 6px;cursor:pointer;
  color:var(--text-s);font-size:17px;line-height:1;flex-shrink:0;border-radius:4px;
  transition:color .15s}
#proj-hist-btn:hover{color:var(--text)}
#proj-hist-drop{position:fixed;top:var(--th);left:0;min-width:220px;max-width:340px;
  background:#1e1e1c;border:0.5px solid var(--bh);border-radius:8px;
  box-shadow:0 4px 16px rgba(0,0,0,0.5);z-index:400;padding:4px 0;display:none}
#proj-hist-drop.show{display:block}
.ph-item{padding:7px 14px;font-size:13px;color:var(--text);cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;
  align-items:center;gap:8px}
.ph-item:hover{background:rgba(255,255,255,0.06)}
.ph-item .ph-name{flex:1;overflow:hidden;text-overflow:ellipsis}
.ph-item .ph-date{font-size:11px;color:var(--text-s);flex-shrink:0}
.ph-empty{padding:10px 14px;font-size:12px;color:var(--text-s)}
.ph-sep{height:0.5px;background:var(--border);margin:4px 0}
.ph-new{padding:8px 14px;font-size:13px;color:#7ab4e0;cursor:pointer;
  display:flex;align-items:center;gap:8px}
.ph-new:hover{background:rgba(55,138,221,0.1)}
.tsp{flex:1}
.sep{width:0.5px;height:18px;background:var(--border);flex-shrink:0;align-self:center}
/* ツールバーグループ（2行） */
.tb-group{display:flex;flex-direction:column;gap:3px;flex-shrink:0}
.tb-row{display:flex;align-items:center;gap:3px}
.tb{background:transparent;border:0.5px solid var(--bh);border-radius:6px;
  padding:3px 8px;font-size:11px;font-family:inherit;cursor:pointer;
  color:var(--text);display:flex;align-items:center;gap:3px;white-space:nowrap;flex-shrink:0;
  height:20px;line-height:1}
.tb svg{flex-shrink:0}
.tb:hover{background:rgba(255,255,255,0.06)}
.tb.on{background:var(--gray-d);color:var(--text);border-color:rgba(255,255,255,0.3)}
.tb.warn{background:rgba(168,120,48,0.22);color:#c8a060;border-color:rgba(168,120,48,0.5)}
.tb.pri{background:var(--blue-d);color:#b5d4f4;border-color:rgba(55,138,221,0.4)}
.tb.unsaved{background:rgba(55,138,221,0.12);color:#7ab4e0;border-color:rgba(55,138,221,0.35);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{border-color:rgba(55,138,221,0.35)}50%{border-color:rgba(55,138,221,0.7)}}
#zlbl{font-size:11px;color:var(--text-s);min-width:34px;text-align:center;flex-shrink:0}
/* ツールバーが2行構成のため、高さを2行分確保している */
:root{--th:84px}
/* ツールバーグループ間のセパレーター */
#tb>.sep{align-self:stretch;height:auto;margin:6px 4px}

/* CANVAS */
#wrap{position:fixed;inset:0;top:var(--th);overflow:hidden}
#wrap.pan{cursor:grabbing}
#wrap.con{cursor:crosshair}
#wrap.draw-frame{cursor:crosshair}
#cv{position:absolute;top:0;left:0;width:8000px;height:8000px;
  background-color:var(--bg);
  background-image:radial-gradient(circle,var(--dot) 1px,transparent 1px);
  background-size:28px 28px}
#sv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:3}
.edge-sel{filter:drop-shadow(0 0 5px currentColor)}

/* グリッド表示（格子＋原点の十字）。#cvの子要素として置き、z-index:-1にすることで、
   #cv内のDOM挿入順（囲い枠は常に最初の子に挿入し直される等）に関わらず、
   ノード・接続線・囲い枠・テキストより常に背面になるようにしている。
   #cv自体のtransform（パン・ズーム）にそのまま乗るため、パン中に再描画するのは位置・大きさのみでよい。
   位置・大きさ（top/left/width/height）は表示範囲に合わせてJS側で毎回計算するため、ここでは固定値を持たない。 */
#grid-layer{position:absolute;z-index:-1;pointer-events:none;display:none}
#grid-layer.show{display:block}
/* 原点を通る十字線。格子より太くし、色は明度で差をつける（JSでGRID_ORIGIN_COLORを設定）。
   太さ（width/height）は画面上のズーム倍率に応じてJS側で毎回計算するため、ここでは固定値を持たない。
   縦線は#grid-layerの上端から下端まで、横線は左端から右端まで伸ばすため、伸びる方向の位置はJS側で計算する。 */
#grid-origin-v{position:absolute;top:0}
#grid-origin-h{position:absolute;left:0}

/* CANVAS FIXED UI（Memo/Draft）
   #cv（ズーム・パンのtransformがかかる領域）の外側に配置しているため、パン・ズームの影響を受けない。
   z-index:200 は、#cv配下の要素（最大でも.frame-titleのz-index:15等）より前面、
   ツールバー#tb（z-index:300）より背面になるよう設定している */
#cv-mini-bar{position:fixed;top:calc(var(--th) + 10px);left:14px;z-index:200;
  display:flex;gap:8px}
/* 幅・高さの初期値、最小値、文字サイズはJS側の定数（DRAFT_MEMO_W/H/MIN_W/MIN_H/FONT_SIZE）から適用する
   （文字サイズ選択を実装する次段階に備え、値の定義箇所を1か所にまとめるため） */
/* 背景色はキャンバス背景（--bg:#141412）に近い色味。不透明度を8割程度にして、
   背後のキャンバスがうっすら透けて見えるようにしている */
#draft-box{position:fixed;z-index:200;
  display:none;flex-direction:column;
  background:rgba(28,28,26,0.8);border:1.5px solid rgba(255,255,255,0.18);
  border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,0.5)}
#draft-box.show{display:flex}
/* 移動用の帯状領域。畳むボタン・タイトルもこの帯の中に収める（掴める範囲を広げるための領域） */
#draft-header{position:relative;flex:none;height:28px;
  display:flex;align-items:center;justify-content:flex-start;
  padding:0 32px 0 10px;cursor:grab}
#draft-header:active{cursor:grabbing}
#draft-title{font-size:16px;font-weight:600;letter-spacing:0.04em;
  color:var(--text-s);pointer-events:none;user-select:none}
#draft-fold{position:absolute;top:6px;right:6px;z-index:1;
  width:20px;height:20px;padding:0;display:flex;align-items:center;justify-content:center;
  background:transparent;border:0.5px solid var(--bh);border-radius:6px;
  color:var(--text-s);cursor:pointer}
#draft-fold:hover{background:rgba(255,255,255,0.08);color:var(--text)}
#draft-text{flex:1;width:100%;box-sizing:border-box;margin:0;padding:0 12px 12px;
  background:transparent;color:rgba(255,255,255,0.85);
  border:none;outline:none;resize:none;
  font-family:inherit;line-height:1.6;cursor:text;min-height:0}
/* リサイズ用ハンドル（4隅）。キャンバスの変形の影響を受けない画面固定要素なので、
   囲い枠のリサイズ（startResize）とは異なりzoomで割らない素のpx差分をそのまま使う。
   枠線をまたぐ位置（外側に--draft-rs-outset、内側にも同じ幅）に配置し、枠線のあたりを
   大まかに狙えばリサイズが始まるようにしている（幅・高さは常に--draft-rs-outsetの2倍）。
   上2つは畳むボタン・移動用の帯（#draft-header）と重なるが、.draft-rsのz-index(2)が
   #draft-header（z-index指定なし）より高く、かつDOM順でも後にあるため、
   重なった部分ではリサイズ操作が優先される */
.draft-rs{position:absolute;z-index:2;
  width:calc(var(--draft-rs-outset) * 2);height:calc(var(--draft-rs-outset) * 2)}
.draft-rs.se{right:calc(var(--draft-rs-outset) * -1);bottom:calc(var(--draft-rs-outset) * -1);cursor:se-resize}
.draft-rs.sw{left:calc(var(--draft-rs-outset) * -1);bottom:calc(var(--draft-rs-outset) * -1);cursor:sw-resize}
.draft-rs.ne{right:calc(var(--draft-rs-outset) * -1);top:calc(var(--draft-rs-outset) * -1);cursor:ne-resize}
.draft-rs.nw{left:calc(var(--draft-rs-outset) * -1);top:calc(var(--draft-rs-outset) * -1);cursor:nw-resize}

/* MEMO（画面固定メモ・全プロジェクト共通）。外観・操作はDraftと同じにする。
   Memo/Draftを同時に開いた場合にDraftを手前に表示するため、z-indexをDraft（#draft-box:200）より1つ低くする。
   リサイズハンドルの張り出し幅は見た目を揃えるためDraftと同じ--draft-rs-outsetを流用する */
#memo-box{position:fixed;z-index:199;
  display:none;flex-direction:column;
  background:rgba(28,28,26,0.8);border:1.5px solid rgba(255,255,255,0.18);
  border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,0.5)}
#memo-box.show{display:flex}
#memo-header{position:relative;flex:none;height:28px;
  display:flex;align-items:center;justify-content:flex-start;
  padding:0 56px 0 10px;cursor:grab}
#memo-header:active{cursor:grabbing}
#memo-title{font-size:16px;font-weight:600;letter-spacing:0.04em;
  color:var(--text-s);pointer-events:none;user-select:none}
#memo-fold{position:absolute;top:6px;right:6px;z-index:1;
  width:20px;height:20px;padding:0;display:flex;align-items:center;justify-content:center;
  background:transparent;border:0.5px solid var(--bh);border-radius:6px;
  color:var(--text-s);cursor:pointer}
#memo-fold:hover{background:rgba(255,255,255,0.08);color:var(--text)}
/* Memoの保存ボタン。横棒（たたむ）ボタンの左に並べる。未保存時は画面右上のSaveボタン（.tb.unsaved）と同じ配色・点滅にする */
#memo-save-btn{position:absolute;top:6px;right:30px;z-index:1;
  width:20px;height:20px;padding:0;display:flex;align-items:center;justify-content:center;
  background:transparent;border:0.5px solid var(--bh);border-radius:6px;
  color:var(--text-s);cursor:pointer}
#memo-save-btn:hover{background:rgba(255,255,255,0.08);color:var(--text)}
#memo-save-btn.unsaved{background:rgba(55,138,221,0.12);color:#7ab4e0;border-color:rgba(55,138,221,0.35);animation:pulse 2s infinite}
#memo-text{flex:1;width:100%;box-sizing:border-box;margin:0;padding:0 12px 12px;
  background:transparent;color:rgba(255,255,255,0.85);
  border:none;outline:none;resize:none;
  font-family:inherit;line-height:1.6;cursor:text;min-height:0}
.memo-rs{position:absolute;z-index:2;
  width:calc(var(--draft-rs-outset) * 2);height:calc(var(--draft-rs-outset) * 2)}
.memo-rs.se{right:calc(var(--draft-rs-outset) * -1);bottom:calc(var(--draft-rs-outset) * -1);cursor:se-resize}
.memo-rs.sw{left:calc(var(--draft-rs-outset) * -1);bottom:calc(var(--draft-rs-outset) * -1);cursor:sw-resize}
.memo-rs.ne{right:calc(var(--draft-rs-outset) * -1);top:calc(var(--draft-rs-outset) * -1);cursor:ne-resize}
.memo-rs.nw{left:calc(var(--draft-rs-outset) * -1);top:calc(var(--draft-rs-outset) * -1);cursor:nw-resize}

/* SELECTION BOX */
#sel-box{position:absolute;border:1.5px dashed var(--blue);
  background:rgba(55,138,221,0.06);pointer-events:none;display:none;z-index:50}
/* DRAW FRAME PREVIEW */
#frame-preview{position:absolute;border:1.5px dashed rgba(255,255,255,0.4);
  border-radius:10px;background:rgba(255,255,255,0.03);
  pointer-events:none;display:none;z-index:2}

/* FRAME — 背景・枠線は最背面（z-indexを持たせず、DOM順で自然に背面へ）。
   タイトルだけは.frame-title側で高いz-indexを与え、ノード等より前面に出す */
.frame{position:absolute;border:1.5px solid rgba(255,255,255,0.18);
  border-radius:12px;background:rgba(255,255,255,0.025);
  cursor:grab;user-select:none}
.frame.sel{background:rgba(255,255,255,0.04)}/* border set by JS */
.frame-title{
  z-index:15;/* ノード(z-index:10)より前面に出す */
  position:absolute;top:-1px;left:12px;transform:translateY(-50%);
  font-size:13px;font-weight:500;color:rgba(255,255,255,0.6);
  background:var(--bg);padding:0 8px;
  white-space:nowrap;cursor:text;line-height:1;
}
.frame:hover .frame-title{color:rgba(255,255,255,0.9)}
/* リサイズハンドル：ホバー時のみ表示 */
.rs{position:absolute;width:10px;height:10px;border-radius:2px;
  background:rgba(255,255,255,0.3);z-index:30;
  opacity:0;transition:opacity .15s}
.frame:hover .rs{opacity:1}
.node:hover .rs{opacity:1}
/* ノードの左右リサイズハンドルは、中央にある接続ポート(.hl/.hr)と重ならないよう上寄りに配置 */
.node .rs.e{top:16px;right:-5px;transform:none}
.node .rs.w{top:16px;left:-5px;transform:none}
.rs.se{right:-5px;bottom:-5px;cursor:se-resize}
.rs.sw{left:-5px;bottom:-5px;cursor:sw-resize}
.rs.ne{right:-5px;top:-5px;cursor:ne-resize}
.rs.nw{left:-5px;top:-5px;cursor:nw-resize}
.rs.e{right:-5px;top:50%;transform:translateY(-50%);cursor:e-resize}
.rs.w{left:-5px;top:50%;transform:translateY(-50%);cursor:w-resize}
.rs.s{bottom:-5px;left:50%;transform:translateX(-50%);cursor:s-resize}
.rs.n{top:-5px;left:50%;transform:translateX(-50%);cursor:n-resize}

/* TEXT LABEL — z-index:5 */
.tlabel{position:absolute;cursor:grab;user-select:none;z-index:5;padding:4px 6px}
.tlabel.sel{outline:1.5px dashed var(--blue);outline-offset:3px;border-radius:4px}
.tlabel.editing{outline:none}/* 編集中はtextarea自身の実線枠だけを見せる（点線と二重にしない） */
.tlabel-text{color:rgba(255,255,255,0.75);white-space:pre-wrap;
  word-break:break-all;line-height:1.5;min-width:40px;min-height:24px}
.tlabel-edit-input{box-sizing:border-box}

/* NODE — z-index:10 */
.node{position:absolute;min-width:160px;max-width:260px;
  border-radius:10px;border:1.5px solid;overflow:visible;
  box-shadow:0 3px 14px rgba(0,0,0,0.55);cursor:grab;user-select:none;z-index:10}
/* フォントサイズ: 小(デフォルト)・中・大 */
.node.fs-m{max-width:320px}
.node.fs-l{max-width:400px}
.node.fs-m .ntitle{font-size:20px}
.node.fs-l .ntitle{font-size:28px}
/* メモの「・」行（接続ハンドル付き行）は文字サイズ設定に連動させる。「-」行(.mline-text)は12px固定のまま */
.node.fs-m .mline-handle{font-size:17px}
.node.fs-l .mline-handle{font-size:24px}
.nbadge{position:absolute;top:-11px;left:10px;z-index:14;
  font-size:10px;font-weight:700;padding:2px 10px;
  border-radius:99px;white-space:nowrap;
  box-shadow:0 1px 6px rgba(0,0,0,0.5)}
.b-todo{background:#2e2e2a;color:#888884;border:1px solid #444}
.b-wip{background:#4a2e06;color:#f5b84a;border:1px solid #8a5c12}
.b-done{background:#163010;color:#88cc55;border:1px solid #3a7a18}
.b-unset{background:#2e2e2a;color:#888884;border:1px solid #444}
.ninner{border-radius:9px;overflow:hidden}
.ntitle{font-size:13px;font-weight:500;padding:18px 12px 8px;line-height:1.45;word-break:break-all}
/* ステータス未設定のノードはバッジが表示されないため、上の余白を左右と同じ12pxに詰める（値を変える場合はここ） */
.node.st-unset .ntitle{padding-top:12px}
.nmemo{padding:0 12px 10px}
.mline-text{font-size:12px;color:#b0b0a8;padding:2px 0;line-height:1.55;word-break:break-all}
.memo-link{color:#7ab4e0;text-decoration:none;font-size:11px;cursor:pointer;}
.memo-link:hover{text-decoration:underline;color:#b5d4f4}
.mline-handle{position:relative;display:flex;align-items:center;gap:6px;padding:3px 0;font-size:12px;line-height:1.55}
.mline-bullet{color:#808080;font-size:11px;flex-shrink:0}
.mline-htxt{flex:1;word-break:break-all;color:#b0b0a8}

/* HANDLES */
.handle{position:absolute;width:14px;height:14px;border-radius:50%;
  border:2px solid;cursor:crosshair;z-index:20;
  opacity:0;transition:opacity .12s}
.node:hover .handle,.handle:hover{opacity:1}
.hl{left:-7px;top:50%;transform:translateY(-50%)}
.hr{right:-7px;top:50%;transform:translateY(-50%)}
.hm{right:-7px;margin-top:-7px}

/* CONTEXT MENU */
.cm{position:fixed;background:#252523;border:0.5px solid var(--bh);
  border-radius:10px;box-shadow:0 6px 28px rgba(0,0,0,0.6);
  padding:5px;min-width:178px;z-index:600;display:none}
.cm.show{display:block}
.ci{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:7px;
  font-size:13px;cursor:pointer;color:var(--text);
  background:transparent;border:none;width:100%;text-align:left;font-family:inherit}
.ci:hover{background:rgba(255,255,255,0.07)}
.ci.d:hover{background:rgba(200,50,50,0.18);color:#f09595}
.csep{height:0.5px;background:var(--border);margin:4px 0}

/* MODAL */
#mo{position:fixed;inset:0;background:rgba(0,0,0,0.6);
  z-index:700;display:none;align-items:center;justify-content:center}
#mo.show{display:flex}
/* GitHub設定モーダル */
#gh-mo{position:fixed;inset:0;background:rgba(0,0,0,0.6);
  z-index:750;display:none;align-items:center;justify-content:center}
#gh-mo.show{display:flex}
#gh-md{background:#252523;border:0.5px solid var(--bh);border-radius:14px;
  padding:1.3rem;width:380px;max-width:92vw;box-shadow:0 12px 44px rgba(0,0,0,0.6)}
/* 画像削除確認モーダル */
#imgdel-mo{position:fixed;inset:0;background:rgba(0,0,0,0.6);
  z-index:760;display:none;align-items:center;justify-content:center}
#imgdel-mo.show{display:flex}
#imgdel-md{background:#252523;border:0.5px solid var(--bh);border-radius:14px;
  padding:1.3rem;width:340px;max-width:90vw;box-shadow:0 12px 44px rgba(0,0,0,0.6)}
#imgdel-md button{font-family:inherit;font-size:13px;
  border-radius:8px;border:0.5px solid var(--bh);
  background:transparent;color:var(--text);cursor:pointer}
#imgdel-md button:hover{background:rgba(255,255,255,0.07)}
#imgdel-md button#imgdel-both{background:rgba(200,50,50,0.15);color:#f0a0a0;border-color:rgba(200,80,80,0.4)}
#imgdel-md button#imgdel-both:hover{background:rgba(200,50,50,0.25)}
/* モーダルドラッグ: #md自体をドラッグ対象に */
#md{cursor:default}
#md{
  background:#252523;border:0.5px solid var(--bh);border-radius:14px;
  padding:1.3rem;width:700px;min-width:420px;max-width:95vw;
  height:620px;min-height:440px;max-height:92vh;
  box-shadow:0 12px 44px rgba(0,0,0,0.6);
  resize:both;overflow:hidden;
  display:flex;flex-direction:column;
}
.md-fixed{flex-shrink:0}
.md-memo-wrap{flex:1;display:flex;flex-direction:column;min-height:0;margin-bottom:0}
.md-memo-wrap .ml{flex-shrink:0;margin-bottom:5px}
.md-memo-wrap textarea{
  flex:1;min-height:0;resize:none;
  font-family:inherit;font-size:15px;width:100%;padding:8px 10px;
  background:rgba(0,0,0,0.4);color:var(--text);
  border:0.5px solid var(--bh);border-radius:8px;outline:none;
  line-height:1.6;
}
.md-memo-wrap textarea:focus{
  border-color:var(--blue);box-shadow:0 0 0 2px rgba(55,138,221,0.2)}
.mrow{display:flex;align-items:flex-start;gap:20px;margin-bottom:12px}
.mst{flex:0 0 130px}.mcl{flex:1}
.mf{margin-bottom:12px}
.ml{display:block;font-size:10px;color:var(--text-s);margin-bottom:5px;
  font-weight:600;letter-spacing:.06em;text-transform:uppercase}
#md .mf input,#md .mf textarea{
  font-family:inherit;font-size:15px;width:100%;padding:8px 10px;
  background:rgba(0,0,0,0.4);color:var(--text);
  border:0.5px solid var(--bh);border-radius:8px;outline:none}
.mf input,.mf textarea{
  font-family:inherit;font-size:13px;width:100%;padding:8px 10px;
  background:rgba(0,0,0,0.4);color:var(--text);
  border:0.5px solid var(--bh);border-radius:8px;outline:none}
.mrow select{
  font-family:inherit;font-size:13px;width:100%;padding:8px 10px;
  background:rgba(0,0,0,0.4);color:var(--text);
  border:0.5px solid var(--bh);border-radius:8px;outline:none}
.mf input:focus,.mf textarea:focus,.mrow select:focus{
  border-color:var(--blue);box-shadow:0 0 0 2px rgba(55,138,221,0.2)}

#f-ti{min-height:38px;max-height:120px;overflow-y:auto}
.mrow select option{background:#1a1a18;color:var(--text)}
.swrow{display:flex;gap:7px;flex-wrap:wrap;align-items:center;
  padding:8px 10px;background:rgba(0,0,0,0.4);
  border:0.5px solid var(--bh);border-radius:8px;margin-top:5px}
.sw{width:20px;height:20px;border-radius:50%;cursor:pointer;
  border:2px solid transparent;flex-shrink:0;transition:transform .12s}
.sw:hover{transform:scale(1.2)}
.sw.on{border-color:#fff;transform:scale(1.12)}
.mac{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:8px}
.mac-right{display:flex;gap:8px}
.mac button{font-family:inherit;font-size:13px;padding:7px 18px;
  border-radius:8px;border:0.5px solid var(--bh);
  background:transparent;color:var(--text);cursor:pointer}
.mac button:hover{background:rgba(255,255,255,0.07)}
.mac button.ok{background:var(--blue-d);color:#b5d4f4;border-color:rgba(55,138,221,0.4)}
.mac button.ok:hover{background:rgba(55,138,221,0.3)}
.mac button.on{background:var(--gray-d);color:var(--text);border-color:rgba(255,255,255,0.3)}
.md-json-wrap{flex-shrink:0;display:flex;flex-direction:column;padding-top:10px;border-top:0.5px solid var(--bh);margin-top:4px}
.md-json-wrap textarea{width:100%;resize:vertical;background:rgba(0,0,0,0.4);color:var(--text);
  border:0.5px solid var(--bh);border-radius:8px;padding:8px 10px;outline:none;box-sizing:border-box}
.md-json-wrap textarea:focus{border-color:var(--blue)}

/* IMAGE OBJECT */
.img-obj{position:absolute;cursor:grab;user-select:none;z-index:2;display:inline-block}
.img-obj.sel{outline:1.5px solid rgba(255,255,255,0.6);outline-offset:2px}
/* トリミングクリップは内部のimg-cropに持たせる */
.img-crop{position:absolute;inset:0;overflow:hidden;border-radius:3px}
/* img サイズはJS側で imgW×imgH に設定し、オフセットでずらす */
.img-crop img{display:block;position:absolute;top:0;left:0;object-fit:fill;border-radius:0}
.img-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(80,80,80,0.3);border:1.5px dashed #666;color:#888;font-size:12px;
  gap:6px;width:100%;height:100%;border-radius:4px}
.img-placeholder .img-icon{font-size:28px}
.img-obj .rs{position:absolute;width:10px;height:10px;border-radius:2px;
  background:rgba(255,255,255,0.5);z-index:30;opacity:0;transition:opacity .15s}
.img-obj:hover .rs,.img-obj.sel .rs{opacity:1}
/* トリミングモード中：アウトラインを明るいシアンに */
.img-obj.cropping{outline:2px solid rgba(80,200,220,0.9);outline-offset:2px}
.img-label{position:absolute;bottom:-16px;right:0;font-size:10px;
  color:rgba(200,198,194,0.75);white-space:nowrap;max-width:260px;overflow:hidden;
  text-overflow:ellipsis;text-align:right;cursor:pointer;user-select:none;
  line-height:1.4;padding-bottom:1px}
.img-label:hover{color:rgba(255,255,255,0.9)}
/* パス未設定（セッション内blobのみ）のラベル */
.img-label.no-path{color:rgba(200,198,194,0.5)}
/* 注記テキスト（再読み込みで表示不可など） */
.img-label-note{display:block;font-size:9px;color:rgba(160,158,154,0.6);line-height:1.4}
.img-label-input{position:absolute;bottom:-24px;right:0;font-family:inherit;font-size:12px;
  color:#f0ede8;background:#252523;border:0.5px solid var(--bh);border-radius:4px;

/* NODE HOVER PREVIEW（マウスオーバーでメモ全文を表示） */
#node-hover-preview{position:fixed;display:none;z-index:850;pointer-events:none;

#node-hover-preview .nhp-title{font-weight:600;margin-bottom:4px;color:#fff}
#node-hover-preview .nhp-line{color:#c8c6c0;word-break:break-word}
/* IMAGE VIEWER */
#img-viewer{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:800;

#iv-img{max-width:90vw;max-height:90vh;object-fit:contain;

#iv-close{position:fixed;top:16px;right:20px;color:rgba(255,255,255,0.7);

#iv-hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);

/* TOAST */

#color-popup{

}
#color-popup.show{display:flex}

  border:2px solid transparent;flex-shrink:0;transition:transform .12s}

#color-popup .csw.on{border-color:#fff;transform:scale(1.1)}
#size-popup{

#draft-size-popup .dssw.on{background:rgba(255,255,255,0.14);font-weight:600}
/* Memoの文字サイズ選択ポップアップ。見た目のみ#draft-size-popupと揃えて専用に用意した */

#memo-size-popup .mssw.on{background:rgba(255,255,255,0.14);font-weight:600}

#mm{position:fixed;bottom:14px;right:14px;
  width:calc(max(180px, 15vw));height:calc(max(114px, 9.5vw));
  background:#1a1a18;border:0.5px solid var(--border);

function getHistory(){

function addHistory(projName,fileName){
  if(!projName||!fileName)return;
  let hist=getHistory();

function formatHistDate(iso){
  const d=new Date(iso),now=new Date();
  const diff=now-d;
  if(diff<60000)return 'たった今';
  if(diff<3600000)return Math.floor(diff/60000)+'分前';
  if(diff<86400000)return Math.floor(diff/3600000)+'時間前';
  if(diff<86400000*7)return Math.floor(diff/86400000)+'日前';
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
}

function dateFromPid(pid){

    const body=pid.slice(1);
    if(body.length<=6)return null;

}

/* ═══════════════════════════════════════

═══════════════════════════════════════ */
const GH_KEY='nm1_gh_config';
const GH_CACHE_KEY='nm1_gh_proj_cache';
const GH_LASTPID_KEY='nm1_gh_last_pid';

function getGhConfig(){
  try{return JSON.parse(localStorage.getItem(GH_KEY)||'null');}catch{return null;}
}
function saveGhConfig(cfg){
  try{localStorage.setItem(GH_KEY,JSON.stringify(cfg));}catch{}
}
function clearGhConfig(){
  try{localStorage.removeItem(GH_KEY);}catch{}
}
function isGhConfigured(){
  const c=getGhConfig();
  return !!(c&&c.user&&c.repo&&c.token);
}
function ghBranch(){
  const c=getGhConfig();
  return (c&&c.branch)||'main';
}

// UTF-8セーフなBase64エンコード/デコード（日本語ファイル名・メモ対応）
function b64EncodeUtf8(str){
  return btoa(unescape(encodeURIComponent(str)));
}
function b64DecodeUtf8(b64){
  return decodeURIComponent(escape(atob(b64)));
}

// Contents APIのURLを組み立てる（パスの各セグメントをURIエンコード）
function ghUrl(path,params){
  const c=getGhConfig();
  const encPath=path?path.split('/').map(encodeURIComponent).join('/'):'';
  let url=`https://api.github.com/repos/${c.user}/${c.repo}/contents${encPath?'/'+encPath:''}`;
  if(params){
    const qs=new URLSearchParams(params).toString();
    if(qs)url+='?'+qs;
  }
  return url;
}
async function ghFetch(path,params,options={}){
  const c=getGhConfig();
  if(!c||!c.user||!c.repo||!c.token)throw new Error('GitHub未設定');
  const url=ghUrl(path,params);
  return fetch(url,{
    ...options,
    cache:'no-store', // 同一URLに異なるAcceptヘッダー（JSON/raw）でアクセスするため、
                       // ブラウザキャッシュの混同（バイナリ応答をJSONとして誤解析等）を防ぐ
    headers:{
      'Authorization':'Bearer '+c.token,
      'Accept':(options.headers&&options.headers['Accept'])||'application/vnd.github+json',
      ...(options.headers||{})
    }
  });
}
// ファイル取得（テキスト・sha付き）。存在しなければnullを返す
async function ghGetFile(path){
  const res=await ghFetch(path,{ref:ghBranch()});
  if(res.status===404)return null;
  if(!res.ok)throw new Error(`GitHub取得エラー: ${res.status}`);
  const j=await res.json();
  if(Array.isArray(j))throw new Error('指定パスはフォルダです');
  return {sha:j.sha,text:b64DecodeUtf8(j.content.replace(/\n/g,''))};
}
// SHAのみ取得（バイナリファイル用。コンテンツのUTF-8デコードを行わないため
// 画像等のバイナリファイルに対して安全に使用できる。存在しなければnullを返す）
async function ghGetFileSha(path){
  const res=await ghFetch(path,{ref:ghBranch()});
  if(res.status===404)return null;
  if(!res.ok)throw new Error(`GitHub取得エラー: ${res.status}`);
  const j=await res.json();
  if(Array.isArray(j))throw new Error('指定パスはフォルダです');
  return j.sha;
}
// ファイル取得（バイナリ・Blob）。非公開リポジトリの画像表示に使用
async function ghGetFileBlob(path){
  const res=await ghFetch(path,{ref:ghBranch()},{headers:{'Accept':'application/vnd.github.raw'}});
  if(!res.ok)throw new Error(`画像取得エラー: ${res.status}`);
  return await res.blob();
}
// ファイル作成/更新（テキスト）
async function ghPutFile(path,contentText,message,sha){
  const body={message,content:b64EncodeUtf8(contentText),branch:ghBranch()};
  if(sha)body.sha=sha;
  const res=await ghFetch(path,null,{method:'PUT',body:JSON.stringify(body),headers:{'Content-Type':'application/json'}});
  if(!res.ok){
    const j=await res.json().catch(()=>({}));
    const err=new Error(`GitHub保存エラー: ${res.status} ${j.message||''}`);
    err.status=res.status;
    throw err;
  }
  return await res.json();
}
// ファイル作成（バイナリ・base64済みコンテンツをそのまま送る＝画像用）
async function ghPutBinary(path,base64Content,message){
  const body={message,content:base64Content,branch:ghBranch()};
  const res=await ghFetch(path,null,{method:'PUT',body:JSON.stringify(body),headers:{'Content-Type':'application/json'}});
  if(!res.ok){
    const j=await res.json().catch(()=>({}));
    throw new Error(`画像アップロードエラー: ${res.status} ${j.message||''}`);
  }
  return await res.json();
}
// ファイル削除
async function ghDeleteFile(path,sha,message){
  const res=await ghFetch(path,null,{method:'DELETE',body:JSON.stringify({message,sha,branch:ghBranch()}),headers:{'Content-Type':'application/json'}});
  if(!res.ok&&res.status!==404){
    const j=await res.json().catch(()=>({}));
    throw new Error(`GitHub削除エラー: ${res.status} ${j.message||''}`);
  }
  return true;
}
// 指定ファイルの最終コミット日時を取得（プロジェクト一覧を「ファイル基準の更新日時」で並べ替えるため）。
// 取得失敗時はnullを返し、呼び出し側で末尾扱いにする（一覧表示自体は継続させる）。
async function ghGetLastCommitDate(path){
  try{
    const c=getGhConfig();
    if(!c||!c.user||!c.repo||!c.token)return null;
    const qs=new URLSearchParams({path,sha:ghBranch(),per_page:'1'}).toString();
    const url=`https://api.github.com/repos/${c.user}/${c.repo}/commits?${qs}`;
    const res=await fetch(url,{cache:'no-store',headers:{
      'Authorization':'Bearer '+c.token,'Accept':'application/vnd.github+json'
    }});
    if(!res.ok)return null;
    const arr=await res.json();
    if(!Array.isArray(arr)||!arr.length)return null;
    const cm=arr[0].commit;
    return (cm&&cm.committer&&cm.committer.date)||(cm&&cm.author&&cm.author.date)||null;
  }catch{return null;}
}
// フォルダ内一覧（存在しなければ空配列）
async function ghListDir(path){
  const res=await ghFetch(path,{ref:ghBranch()});
  if(res.status===404)return [];
  if(!res.ok)throw new Error(`GitHub一覧取得エラー: ${res.status}`);
  const j=await res.json();
  return Array.isArray(j)?j:[];
}

function migrateData(d){
  const v=(d.version||0);
  // v4 → v4.1: imgW/imgH/imgOffX/imgOffY を既存imageに補完
  if(v<4.1&&d.images){
    d.images.forEach(img=>{
      if(img.imgW===undefined)img.imgW=img.w||320;
      if(img.imgH===undefined)img.imgH=img.h||200;
      if(img.imgOffX===undefined)img.imgOffX=0;
      if(img.imgOffY===undefined)img.imgOffY=0;
    });
  }
  // v4.1 → v4.2: ノードにfs（フォントサイズ）を補完
  if(v<4.2&&d.nodes){
    Object.values(d.nodes).forEach(n=>{
      if(n.fs===undefined)n.fs='s';
    });
  }
  // v4.2 → v4.3: メモの・行に内部ID（・[N]）を付与し、
  // edgesのfp/tp（旧 m0 形式のインデックス指定）を新ID形式（m_N）に変換
  if(v<4.3&&d.nodes){
    Object.values(d.nodes).forEach(n=>{
      if(!n.memo)return;
      const rawLines=n.memo.split('\n');
      const portMap={}; // 旧インデックスポート名(m0,m1...) -> 新ID形式(m_N)
      let idx=0,nextId=1;
      const newLines=rawLines.map(raw=>{
        if(!raw.startsWith('・'))return raw;
        const rest=raw.slice(1).trim();
        // すでに[N]形式が付与済みならそのまま尊重
        const already=rest.match(/^\[(\d+)\]\s*/);
        const oldPort='m'+idx;
        if(already){
          idx++;
          return raw;
        }
        if(!rest){idx++;return raw;}
        const pid=nextId++;
        portMap[oldPort]='m_'+pid;
        idx++;
        return `・[${pid}]${rest}`;
      });
      n.memo=newLines.join('\n');
      if(Object.keys(portMap).length&&d.edges){
        d.edges.forEach(e=>{
          if(e.fn===n.id&&portMap[e.fp])e.fp=portMap[e.fp];
          if(e.tn===n.id&&portMap[e.tp])e.tp=portMap[e.tp];
        });
      }
      // 注: メモハンドルを持つノードへの fp/tp='r' 接続（過去バージョンで
      // 子ノード追加機能等により誤って作られたもの）は、運用初期につき
      // 自動振り直しは行わない。原因（nm-childの常時fp='r'指定）は撤去済みのため、
      // 今後v4.3以降は同様の不整合データは新規には発生しない。
    });
  }
  // v4.3 → v5.0: Nodemap v1への改名・localStorageエラーハンドリング追加
  // （データ構造の変更なし。バージョン番号のみ更新）
  d.version=5.0;
  // v5.0 → v5.1: GitHub版用にプロジェクトID（pid）を追加
  // 既存データ（pidを持たないローカル版データ等）を開いた場合は自動発行する
  if(!d.pid){
    d.pid=genPid();
  }
  d.version=5.1;
  // v5.1 → v5.2: テキストラベルにcolorフィールドを追加（省略時は既存デフォルト色のまま表示されるため、
  // 既存データへの変換処理は不要）
  d.version=5.2;
  // v5.2 → v5.3: Draftメモ（画面固定メモ）のdraftText/draftX/draftYを追加
  // （省略時はapplyDraftData側で空欄・未配置の初期値になるため、既存データへの変換処理は不要）
  d.version=5.3;
  // v5.3 → v5.4: Draftメモにリサイズ機能を追加し、draftW/draftHを追加
  // （省略時はapplyDraftData側でデフォルトサイズ（DRAFT_MEMO_W/H）になるため、既存データへの変換処理は不要）
  d.version=5.4;
  // v5.4 → v5.5: Draftメモに文字サイズ選択を追加し、draftFontSizeを追加
  // （省略時はapplyDraftData側でデフォルト値（DRAFT_MEMO_FONT_SIZE_DEFAULT=13px）になるため、既存データへの変換処理は不要）
  d.version=5.5;
  return d;
}

function gid(){return '_'+Math.random().toString(36).slice(2,9)}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

// 16進カラーを明るくする
function lightenColor(hex,amount){
  const num=parseInt(hex.replace('#',''),16);
  const r=Math.min(255,(num>>16)+amount);
  const g=Math.min(255,((num>>8)&0xff)+amount);
  const b=Math.min(255,(num&0xff)+amount);
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
// hex色を指定アルファのrgba()文字列に変換（囲い枠の薄い背景色付け用）
function hexToRgba(hex,alpha){
  const num=parseInt(hex.replace('#',''),16);
  const r=(num>>16)&0xff,g=(num>>8)&0xff,b=num&0xff;
  return `rgba(${r},${g},${b},${alpha})`;
}
// ノードの選択表示：外側に別の枠を足すのではなく、ノード自身の枠線を明るく・太くする
function applyNodeSelBorder(el,n,isSelected){
  const p=P(n.cl);
  const baseShadow='0 3px 14px rgba(0,0,0,0.55)'; // .node本来の落ち影（インライン上書きするので明示的に維持する）
  if(isSelected){

    // レイアウトに一切影響しないinsetのbox-shadowを内側に重ねて「枠が太くなった」ように見せる
    el.style.boxShadow=`${baseShadow}, inset 0 0 0 1.5px ${selC}`;
  }else{

}

// テキスト内のURLをクリック可能なリンクに変換
function linkify(s){
  const escaped=esc(s);
  return escaped.replace(/https?:\/\/[^\s&<>"]+/g, url=>{
    return '<span class="memo-link" data-url="'+url+'">'+url+'</span>';
  });
}

/* ═══════════════════════════════════════
   MEMO PARSE
═══════════════════════════════════════ */
function parseMemo(memo){
  if(!memo)return[];
  const out=[];
  for(const raw of memo.split('\n')){
    if(raw.startsWith('"・"')||raw.startsWith('"-"')){out.push({t:'text',s:raw});continue;}
    if(raw.startsWith('・')){
      let rest=raw.slice(1).trim();
      let pid=null;
      // ・[N]テキスト 形式からIDを抽出（ユーザーには見せない内部情報）
      const m=rest.match(/^\[(\d+)\]\s*/);
      if(m){pid=parseInt(m[1],10);rest=rest.slice(m[0].length);}
      if(rest)out.push({t:'handle',s:rest,pid});
      continue;
    }
    if(raw.match(/^-[\s\u3000]/) || raw==='-' || (raw.startsWith('-')&&raw.length>1&&!raw.startsWith('--'))){
      const s=raw.slice(1).trim();
      out.push({t:'text',s}); // 「-」だけの行（中身が空）でも1行として保持し、空白行として表示する
      continue;
    }
  }
  return out;
}

/* ═══════════════════════════════════════
   MEMO PORT ID 整合性チェック・自動採番
   ・[N]テキスト 形式のIDを解析し、
   重複があれば警告メッセージを返す（確定はしない）。
═══════════════════════════════════════ */
function checkMemoIdIssues(oldMemo,newMemo){
  const issues=[];
  const orphanedIds=new Set(); // 接続線の孤立化が起きるID（保存続行時に該当エッジを削除する対象）
  // 新memo内のID重複検出
  const newIdToText=new Map();
  const dupSeen=new Map();
  (newMemo||'').split('\n').forEach(raw=>{
    if(!raw.startsWith('・'))return;
    const rest=raw.slice(1).trim();
    const m=rest.match(/^\[(\d+)\]\s*/);
    if(!m)return;
    const pid=parseInt(m[1],10);
    const text=rest.slice(m[0].length);
    if(dupSeen.has(pid)){
      issues.push(`ID [${pid}] が複数行で重複しています（「${dupSeen.get(pid)}」と「${text}」）`);
    }else{
      dupSeen.set(pid,text);
      newIdToText.set(pid,text);
    }
  });
  // 旧memoのID→テキスト対応を取得
  const oldIdToText=new Map();
  (oldMemo||'').split('\n').forEach(raw=>{
    if(!raw.startsWith('・'))return;
    const rest=raw.slice(1).trim();
    const m=rest.match(/^\[(\d+)\]\s*/);
    if(m)oldIdToText.set(parseInt(m[1],10),rest.slice(m[0].length));
  });
  // 既存IDの消失検出（このIDに紐づく接続線は保存続行時に削除対象）
  const missingIds=[...oldIdToText.keys()].filter(id=>!newIdToText.has(id));
  if(missingIds.length){
    issues.push(`既存のID [${missingIds.join(', ')}] が見つかりません（保存すると、これに繋がっていた接続線は削除されます）`);
    missingIds.forEach(id=>orphanedIds.add(id));
  }
  // 既存ID保持しているが対応テキストが変わった（＝番号の付け替わり）を検出
  // この場合も実質的に旧テキストへの接続は意味を失うため孤立扱いとする
  oldIdToText.forEach((oldText,pid)=>{
    if(!newIdToText.has(pid))return; // 消失済みは上で検出済み
    const newText=newIdToText.get(pid);
    if(newText!==oldText){
      issues.push(`ID [${pid}] の対応行が変わっています（旧：「${oldText}」→新：「${newText}」。保存すると、このIDの旧接続は維持されますが新しい行を指すようになります）`);
    }
  });
  return{issues,orphanedIds};
}

// ID未設定の・行に新規採番し、最終的なmemo文字列を確定する
// 重複IDがあった場合は重複側を新規ID扱いにする（警告は事前にcheckMemoIdIssuesで提示済み前提）
// 孤立エッジの情報を収集：削除される前に接続元/先のノード名・行テキストを取得する
function collectOrphanedEdgeInfo(nodeId,orphanedIds,oldMemo){
  if(!orphanedIds||!orphanedIds.size)return[];
  // 旧memoのpid→テキストのマップを作成
  const pidToText={};
  (oldMemo||'').split('\n').forEach(raw=>{
    if(!raw.startsWith('・'))return;
    const rest=raw.slice(1).trim();
    const m=rest.match(/^\[(\d+)\]\s*/);
    if(m)pidToText[parseInt(m[1],10)]=rest.slice(m[0].length);
  });
  const srcNode=nodes[nodeId];
  const srcTitle=srcNode?srcNode.title:'(不明)';
  const entries=[];
  edges.forEach(e=>{
    const fOrphan=(e.fn===nodeId&&e.fp&&e.fp.startsWith('m_')&&orphanedIds.has(parseInt(e.fp.slice(2),10)));
    const tOrphan=(e.tn===nodeId&&e.tp&&e.tp.startsWith('m_')&&orphanedIds.has(parseInt(e.tp.slice(2),10)));
    if(fOrphan){
      const pid=parseInt(e.fp.slice(2),10);
      const lineText=pidToText[pid]||`[${pid}]`;
      const dstNode=nodes[e.tn];
      const dstTitle=dstNode?dstNode.title:'(削除済みノード)';
      entries.push({srcLabel:`${srcTitle}/[${pid}]${lineText}`,dstLabel:dstTitle});
    }
    if(tOrphan){
      const pid=parseInt(e.tp.slice(2),10);
      const lineText=pidToText[pid]||`[${pid}]`;
      const srcNodeFrom=nodes[e.fn];
      const fromTitle=srcNodeFrom?srcNodeFrom.title:'(削除済みノード)';
      entries.push({srcLabel:`${fromTitle}`,dstLabel:`${srcTitle}/[${pid}]${lineText}`});
    }
  });
  return entries;
}

function finalizeMemoIds(memo){
  if(!memo)return memo;
  const rawLines=memo.split('\n');
  const parsedLines=rawLines.map(raw=>{
    if(!raw.startsWith('・'))return{raw,isHandle:false};
    const rest=raw.slice(1).trim();
    const m=rest.match(/^\[(\d+)\]\s*/);
    if(m)return{raw,isHandle:true,pid:parseInt(m[1],10),text:rest.slice(m[0].length)};
    return{raw,isHandle:true,pid:null,text:rest};
  });
  const usedIds=new Set();
  parsedLines.forEach(l=>{if(l.isHandle&&l.pid!=null)usedIds.add(l.pid);});
  let nextId=usedIds.size?Math.max(...usedIds)+1:1;
  const seenAssign=new Set();
  const newLines=parsedLines.map(l=>{
    if(!l.isHandle)return l.raw;
    let pid=l.pid;
    if(pid==null||seenAssign.has(pid)){pid=nextId++;}
    seenAssign.add(pid);
    return l.text?`・[${pid}]${l.text}`:l.raw;
  });
  return newLines.join('\n');
}

// 行の挿入時に既存接続が無関係な行へ付け替わるバグがあったため）。
// finalizeMemoIdsが既存pidをそのまま維持するため、ポート付け替えは元々不要。

function bClass(s){return s==='done'?'b-done':s==='wip'?'b-wip':s==='unset'?'b-unset':'b-todo'}

  el.innerHTML=`
    ${n.st!=='unset'?`<span class="nbadge ${bClass(n.st)}">${sLabel(n.st)}</span>`:''}
    <div class="ninner" style="background:${p.bg}">
      <div class="ntitle" style="color:${p.tc}">${titleHtml}</div>
      ${mHtml}
    </div>
    <div class="handle hl" style="background:${p.bd};border-color:${p.bg}" data-nid="${n.id}" data-port="l"></div>
    ${!hasH?`<div class="handle hr" style="background:${p.bd};border-color:${p.bg}" data-nid="${n.id}" data-port="r"></div>`:''}
    <div class="rs e" data-rs="e"></div><div class="rs w" data-rs="w"></div>`;

  cv.appendChild(el);
  bindNode(el,n.id);

  if(hasH){
    requestAnimationFrame(()=>{
      const nmemo=el.querySelector('.nmemo');if(!nmemo)return;

      const scale=elRect.width/el.offsetWidth||1;
      lines.forEach((l,i)=>{
        if(l.t!=='handle')return;
        const lineEl=nmemo.querySelector(`[data-mi="${i}"]`);if(!lineEl)return;
        const lr=lineEl.getBoundingClientRect();
        const topPx=((lr.top+lr.height/2)-elRect.top)/scale;
        const h=document.createElement('div');
        h.className='handle hm';
        h.style.cssText=`background:${p.bd};border-color:${p.bg};top:${topPx}px`;
        // pidが確定していればm_N形式、未確定（保存前の暫定状態）は配列インデックスでフォールバック
        const portId=l.pid!=null?'m_'+l.pid:'m'+i;
        h.dataset.nid=n.id;h.dataset.port=portId;
        el.appendChild(h);
        h.addEventListener('mousedown',e=>{if(e.button!==0)return;e.stopPropagation();startCon(n.id,portId);});
      });
      renderEdges();
    });
  }
  return el;
}

/* ═══════════════════════════════════════
   RENDER IMAGE
═══════════════════════════════════════ */
function getFileName(src,displayName){
  if(displayName)return displayName;
  if(!src)return '';
  if(src.startsWith('blob:'))return '（パスを設定してください）';
  const parts=src.replace(/\\/g,'/').split('/');
  return parts[parts.length-1];
}
function applyImgTransform(el,img){
  el.style.width=img.w+'px';
  el.style.height=img.h+'px';
  const crop=el.querySelector('.img-crop');
  if(crop){crop.style.width=img.w+'px';crop.style.height=img.h+'px';}
  const imgEl=el.querySelector('img');
  if(imgEl){
    const iw=img.imgW||img.w;
    const ih=img.imgH||img.h;
    const ox=img.imgOffX||0;
    const oy=img.imgOffY||0;
    imgEl.style.width=iw+'px';
    imgEl.style.height=ih+'px';
    imgEl.style.left=ox+'px';
    imgEl.style.top=oy+'px';
  }
}
function renderImage(img){
  const old=document.getElementById('im-'+img.id);if(old)old.remove();
  const el=document.createElement('div');
  el.className='img-obj'+(selIds.has(img.id)?' sel':'');
  el.id='im-'+img.id;
  el.style.cssText=`left:${img.x}px;top:${img.y}px;width:${img.w}px;height:${img.h}px`;

  // トリミング用クリップラッパー
  const crop=document.createElement('div');
  crop.className='img-crop';
  crop.style.cssText=`width:${img.w}px;height:${img.h}px`;

  // 画像本体
  const imgEl=document.createElement('img');
  // _blobSrcがあればセッション内表示に使用、なければsrcを使用
  const displaySrc=img._blobSrc||img.src||'';
  const isBlobSrc=displaySrc.startsWith('blob:');
  imgEl.src=displaySrc;
  imgEl.alt=img.displayName||getFileName(img.src,img.displayName);
  imgEl.draggable=false;
  imgEl.onerror=()=>{
    imgEl.style.display='none';
    if(crop.querySelector('.img-placeholder'))return;
    const ph=document.createElement('div');
    ph.className='img-placeholder';
    const label=img.displayName||getFileName(img.src,img.displayName)||'（ファイル名不明）';
    const hasSrc=img.src&&!img.src.startsWith('blob:');
    // パスが手動設定されていればパスも表示、なければファイル名のみ
    ph.innerHTML=`<span class="img-icon">🖼</span>`
      +`<span style="font-size:11px">${esc(label)}</span>`
      +(hasSrc?`<span style="font-size:9px;color:#888;word-break:break-all;text-align:center;max-width:90%;padding:0 4px">${esc(img.src)}</span>`:'');
    crop.insertBefore(ph,crop.firstChild);
  };
  crop.appendChild(imgEl);
  el.appendChild(crop);
  applyImgTransform(el,img);

  // リサイズハンドル（8点）
  [['se','right:-5px;bottom:-5px;cursor:se-resize'],
   ['sw','left:-5px;bottom:-5px;cursor:sw-resize'],
   ['ne','right:-5px;top:-5px;cursor:ne-resize'],
   ['nw','left:-5px;top:-5px;cursor:nw-resize'],
   ['e', 'right:-5px;top:50%;transform:translateY(-50%);cursor:e-resize'],
   ['w', 'left:-5px;top:50%;transform:translateY(-50%);cursor:w-resize'],
   ['s', 'bottom:-5px;left:50%;transform:translateX(-50%);cursor:s-resize'],
   ['n', 'top:-5px;left:50%;transform:translateX(-50%);cursor:n-resize'],
  ].forEach(([dir,css])=>{
    const h=document.createElement('div');
    h.className='rs';h.style.cssText=css;h.dataset.dir=dir;
    el.appendChild(h);
  });

  // パスラベル
  const lbl=document.createElement('div');
  lbl.className='img-label';
  const isDataUrl=img.src&&img.src.startsWith('data:');
  const hasPermSrc=img.src&&!img.src.startsWith('blob:')&&!isDataUrl;
  const hasBlobSrc=!!img._blobSrc;
  const dispName=img.displayName||getFileName(img.src,img.displayName)||'';

  if(isDataUrl){
    // 埋め込み済み：画像名のみ
    lbl.textContent=dispName||'埋め込み画像';
    lbl.title='埋め込み済み（JSONに保存）';
  } else if(hasBlobSrc){
    // セッション中（blob）：ファイル名＋警告
    lbl.classList.add('no-path');
    lbl.innerHTML=`${esc(dispName||'（ファイル名不明）')}<span class="img-label-note">再読み込みで表示不可</span>`;
    lbl.title='パス未設定のため再起動後は表示不可';
  } else if(hasPermSrc){
    // 手動パス設定済み：パス＋画像名
    const fname=getFileName(img.src,img.displayName)||dispName||'';
    lbl.textContent=fname?`${img.src}`:img.src;
    lbl.title=img.src;
    // パスとファイル名を2行で表示
    lbl.innerHTML=`<span class="img-label-note" style="color:rgba(160,158,154,0.7)">${esc(img.src)}</span>${esc(fname)}`;
  } else {
    // 再読み込み後・blob消えた状態：ファイル名のみ
    lbl.classList.add('no-path');
    lbl.textContent=dispName||'パスを設定';
    lbl.title=dispName?`ファイル名: ${dispName}`:'パス未設定';
  }
  lbl.onclick=e=>{e.stopPropagation();startImgLabelEdit(img.id,lbl,el);};
  el.appendChild(lbl);

  cv.appendChild(el);
  bindImage(el,img.id);
  return el;
}

function startImgLabelEdit(imgId,lbl,el){
  const img=images.find(i=>i.id===imgId);if(!img)return;
  const inp=document.createElement('input');
  inp.type='text';inp.className='img-label-input';
  // data:URLは入力欄に表示しない。通常の絶対パス/URLのみ表示
  const isDataUrl=img.src&&img.src.startsWith('data:');
  const isBlobSrc=img.src&&img.src.startsWith('blob:');
  inp.value=(img.src&&!isDataUrl&&!isBlobSrc)?img.src:'';
  inp.placeholder=isDataUrl?'埋め込み済み（パスは不要）':'絶対パスまたはURL...';
  el.appendChild(inp);
  // #wrapは overflow:hidden でもスクロールコンテナ扱いのため、focus()時にブラウザが
  // 勝手に#wrapをスクロールしてしまうことがある（本来のパンはcvへのtransformのみで行っており、
  // #wrap.scrollTop/scrollLeftは常に0であるべき）。ズーム・パンの基準がズレる不具合の原因になるため、
  // ここで明示的に抑止・固定する。
  inp.focus({preventScroll:true});
  inp.select();
  wrap.scrollLeft=0;wrap.scrollTop=0;
  lbl.style.display='none';
  function finish(){
    const val=inp.value.trim();
    if(val&&!val.startsWith('blob:')&&!val.startsWith('data:')){
      // 新しいパスが入力された場合のみpushUndoして更新
      pushUndo();
      img.src=val;
      img.displayName='';
      img._blobSrc=null;
    }
    // 空欄 or data:/blob: → 変更なし（pushUndoしない）
    inp.remove();lbl.style.display='';
    const old=document.getElementById('im-'+imgId);if(old)old.remove();
    renderImage(img);persist();if(val)markUnsaved();
  }
  inp.addEventListener('blur',finish);
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!e.isComposing)inp.blur();
    if(e.key==='Escape'){inp.removeEventListener('blur',finish);inp.remove();lbl.style.display='';}
    e.stopPropagation();
  });
  inp.addEventListener('mousedown',e=>e.stopPropagation());
}

function bindImage(el,imgId){
  el.addEventListener('mousedown',e=>{
    if(e.button!==0)return;
    if(e.target.dataset.dir){e.stopPropagation();startImgResize(imgId,e.target.dataset.dir,e);return;}
    if(e.target.classList.contains('img-label')||e.target.classList.contains('img-label-input'))return;
    e.stopPropagation();
    if(e.ctrlKey||e.metaKey){toggleSel(imgId);return;}
    if(!selIds.has(imgId)){clearSel();selIds.add(imgId);applySel();}
    // Shift+ドラッグ = トリミング枠移動（外枠を動かす、画像自体は固定）
    if(e.shiftKey&&selIds.size===1){startImgCropPan(imgId,e);return;}
    if(e.altKey)duplicateSelectionInPlace(); // Alt+ドラッグ：その場で複製してから移動
    startDragMulti(e);
  });
  el.addEventListener('dblclick',e=>{
    if(e.target.classList.contains('img-label'))return;
    e.stopPropagation();
    const img=images.find(i=>i.id===imgId);
    if(!img)return;
    const viewSrc=img._blobSrc||img.src||'';
    if(viewSrc)openViewer(viewSrc);
  });
  el.addEventListener('contextmenu',e=>{
    e.preventDefault();e.stopPropagation();
    ctxImgId=imgId;
    posMenu(document.getElementById('img-menu'),e.clientX,e.clientY);
  });
}

function startImgResize(imgId,dir,e){
  e.stopPropagation();
  const img=images.find(i=>i.id===imgId);if(!img)return;
  pushUndo(); // 操作開始時点の状態を保存（mouseupではなくmousedownで取る）
  const shiftKey=e.shiftKey; // Shift押下時 = 自由変形（トリミング）

  // 通常リサイズ時の縦横比
  const aspectRatio=(img.imgH||img.h)/(img.imgW||img.w);

  // スナップショット
  const ox=img.x,oy=img.y,ow=img.w,oh=img.h;
  const oImgW=img.imgW||img.w,oImgH=img.imgH||img.h;
  const oOffX=img.imgOffX||0,oOffY=img.imgOffY||0;
  const sx=e.clientX,sy=e.clientY;

  const el=document.getElementById('im-'+imgId);

  if(shiftKey&&el)el.classList.add('cropping');

  function mm(ev){
    const dx=(ev.clientX-sx)/zoom,dy=(ev.clientY-sy)/zoom;
    if(shiftKey){
      /* ── Shift：自由変形（外枠のみ変更、imgW/H/Off は固定） ── */
      if(dir.includes('e'))img.w=Math.max(20,ow+dx);
      if(dir.includes('s'))img.h=Math.max(20,oh+dy);
      if(dir.includes('w')){const nw=Math.max(20,ow-dx);img.x=ox+(ow-nw);img.w=nw;}
      if(dir.includes('n')){const nh=Math.max(20,oh-dy);img.y=oy+(oh-nh);img.h=nh;}
      // imgOffを調整して画像の見える領域を変える
      // 西方向：外枠左端が右に動く → OffXを増やす
      if(dir.includes('w')){
        const nw=Math.max(20,ow-dx);
        img.imgOffX=oOffX-(ow-nw);
      }
      if(dir.includes('n')){
        const nh=Math.max(20,oh-dy);
        img.imgOffY=oOffY-(oh-nh);
      }
    } else {
      /* ── 通常：縦横比維持リサイズ（imgW/H/Off も一緒にスケール） ── */
      // まず外枠の新サイズを計算（縦横比維持）
      let nw=ow,nh=oh;
      if(dir==='se'||dir==='e'||dir==='ne'){nw=Math.max(20,ow+dx);}
      if(dir==='sw'||dir==='w'||dir==='nw'){nw=Math.max(20,ow-dx);}
      if(dir==='se'||dir==='s'||dir==='sw'){nh=Math.max(20,oh+dy);}
      if(dir==='ne'||dir==='n'||dir==='nw'){nh=Math.max(20,oh-dy);}

      // 単軸ハンドル（e/w/n/s）は縦横比に従って他軸を決定
      if(dir==='e'||dir==='w')nh=nw*aspectRatio;
      else if(dir==='n'||dir==='s')nw=nh/aspectRatio;
      else{
        // 斜めハンドル：どちらか大きい変化量を基準にする
        const scaleW=nw/ow,scaleH=nh/oh;
        const scale=Math.max(scaleW,scaleH);
        nw=ow*scale;nh=oh*scale;
      }
      nw=Math.max(20,nw);nh=Math.max(20,nh);

      // スケール比
      const scale=nw/ow;

      // 位置調整（固定起点はハンドルの反対側）
      if(dir.includes('w'))img.x=ox+(ow-nw);
      if(dir.includes('n'))img.y=oy+(oh-nh);
      if(!dir.includes('w'))img.x=ox;
      if(!dir.includes('n'))img.y=oy;

      img.w=nw;img.h=nh;
      img.imgW=oImgW*scale;
      img.imgH=oImgH*scale;
      img.imgOffX=oOffX*scale;
      img.imgOffY=oOffY*scale;
    }

    if(el){
      el.style.left=img.x+'px';el.style.top=img.y+'px';
      el.style.width=img.w+'px';el.style.height=img.h+'px';
      applyImgTransform(el,img);
    }
  }
  function mu(){
    document.removeEventListener('mousemove',mm);
    document.removeEventListener('mouseup',mu);
    if(el)el.classList.remove('cropping');
    persist();markUnsaved();
  }
  document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);
}

/* Shift+ドラッグ：トリミング枠移動（外枠を動かす、画像表示位置は固定） */
function startImgCropPan(imgId,e){
  e.stopPropagation();
  const img=images.find(i=>i.id===imgId);if(!img)return;
  pushUndo(); // 操作開始時点の状態を保存
  const ox=img.x,oy=img.y;
  const oOffX=img.imgOffX||0,oOffY=img.imgOffY||0;
  const sx=e.clientX,sy=e.clientY;
  const el=document.getElementById('im-'+imgId);
  if(el)el.classList.add('cropping');
  function mm(ev){
    const dx=(ev.clientX-sx)/zoom,dy=(ev.clientY-sy)/zoom;
    // 外枠を動かし、オフセットを反対方向に動かすことで「窓を動かす」感覚
    img.x=ox+dx;img.y=oy+dy;
    img.imgOffX=oOffX-dx;img.imgOffY=oOffY-dy;
    if(el){
      el.style.left=img.x+'px';el.style.top=img.y+'px';
      applyImgTransform(el,img);
    }
  }
  function mu(){
    document.removeEventListener('mousemove',mm);
    document.removeEventListener('mouseup',mu);
    if(el)el.classList.remove('cropping');
    persist();markUnsaved();
  }
  document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);
}
