/* クリック座標に最も近い文字位置（テキストノード内のオフセット）を取得。
   非表示化する前のテキスト要素に対して呼び出す必要がある（textarea化した後だと取得できない）。
   ブラウザが対応していない、またはクリックがテキスト要素外だった場合はnullを返す。 */
function getCaretIndexFromPoint(textNode,x,y){
  try{
    if(document.caretPositionFromPoint){
      const pos=document.caretPositionFromPoint(x,y);
      if(pos&&pos.offsetNode===textNode)return pos.offset;
      return null;
    }
    if(document.caretRangeFromPoint){
      const range=document.caretRangeFromPoint(x,y);
      if(range&&range.startContainer===textNode)return range.startOffset;
      return null;
    }
  }catch{}
  return null;
}

/* インライン編集
   isNew=true：「+テキスト」新規作成直後（プレースホルダー文字列をすぐ上書きできるよう全選択のまま）
   isNew=false（既定）：既存テキストをダブルクリックで編集開始。
     clickX/clickYが渡された場合は、その座標に対応する文字位置にカーソルを置く
     （拡大表示中に文章途中を編集したいのに文末へ飛ばされる問題への対応）。
     座標が無い/取得できない場合は文末にフォールバック。 */
function startInlineEdit(lid,isNew=false,clickX=null,clickY=null){
  const lb=labels.find(l=>l.id===lid);if(!lb)return;
  const el=document.getElementById('lb-'+lid);if(!el)return;
  const textDiv=el.querySelector('.tlabel-text');if(!textDiv)return;
  // 既に編集中のinputがあれば無視
  if(el.querySelector('.tlabel-edit-input'))return;

  // クリック位置に対応する文字位置を、テキストがまだ表示されている（非表示化する前の）段階で計算しておく
  let caretIndex=null;
  if(!isNew&&clickX!=null&&clickY!=null&&textDiv.firstChild){
    caretIndex=getCaretIndexFromPoint(textDiv.firstChild,clickX,clickY);
  }

  // テキストを非表示にしてその上にinputを重ねる
  const rect=textDiv.getBoundingClientRect();
  const elRect=el.getBoundingClientRect();
  textDiv.style.visibility='hidden';

  const inp=document.createElement('textarea');
  inp.className='tlabel-edit-input';
  inp.value=lb.text||'';
  // テキストの描画位置は絶対に動かさない。その上で、枠線だけを見た目上わずかに外側へ
  // はみ出させたい（点線の位置に近づけたい）ため、「枠を外にEXTRA分広げる」と同時に
  // 「内側の余白（padding）も同じEXTRA分だけ増やす」ことで、広げた分と増やした余白が
  // ちょうど打ち消し合い、テキスト自体の描画位置は数式上まったく動かない形にする。
  const BORDER_W=1,PAD_V=2,PAD_H=6; // このinp自身のCSS値（枠線・上下左右の内側余白）
  const EXTRA=4; // 枠線を外側にどれだけはみ出させるか（点線に寄せるための量）
  const dTop=(rect.top-elRect.top)/zoom-(BORDER_W+PAD_V)-EXTRA;
  const dLeft=(rect.left-elRect.left)/zoom-(BORDER_W+PAD_H)-EXTRA;
  const localW=rect.width/zoom;
  const localH=rect.height/zoom;
  const H_OVERHEAD=2*BORDER_W+2*(PAD_H+EXTRA); // 枠線×2 + (左右padding+EXTRA)×2
  const V_OVERHEAD=2*EXTRA; // 上下paddingの増加分（枠線分はmin-heightの実測込みなので対象外）
  inp.style.cssText=[
    'position:absolute',
    `top:${dTop}px`,
    `left:${dLeft}px`,
    `min-width:${Math.max(localW+H_OVERHEAD,80)}px`,
    `min-height:${Math.max(localH+V_OVERHEAD,24)}px`,
    'width:auto','height:auto',
    'background:transparent',
    `border:${BORDER_W}px solid ${lb.color?P(lb.color).bd:P('gray').bd}`,
    'border-radius:4px',
    'outline:none',
    'font-family:inherit',
    `font-size:${lb.size||13}px`,
    `color:${lb.color?P(lb.color).tc:'rgba(255,255,255,0.75)'}`,
    `padding:${PAD_V+EXTRA}px ${PAD_H+EXTRA}px`,
    'resize:both',
    'overflow:hidden',
    'z-index:50',
    'line-height:1.5',
    'white-space:pre-wrap',
  ].join(';');

  el.appendChild(inp);
  el.classList.add('editing'); // 編集中は外側の点線ハイライトを隠し、textarea自身の実線枠だけを見せる
  // #wrapはoverflow:hiddenだがスクロールコンテナとして扱われるため、
  // focus()やこの後のリサイズ時にブラウザが「フォーカス位置を画面内に収めよう」として
  // 勝手に#wrapをスクロールしてしまうことがある（本来のパンはcvへのtransformのみで行っており、
  // #wrap.scrollTop/scrollLeftは常に0であるべき）。ダブルクリックした表示位置がズレないよう、
  // フォーカス時にpreventScrollで抑止した上、念のため明示的に0へ固定する。
  const lockWrapScroll=()=>{wrap.scrollLeft=0;wrap.scrollTop=0;};
  inp.focus({preventScroll:true});
  lockWrapScroll();
  if(isNew)inp.select();
  else if(caretIndex!=null)inp.setSelectionRange(caretIndex,caretIndex);
  else inp.setSelectionRange(inp.value.length,inp.value.length);

  // 入力に合わせて自動リサイズ
  function autoResize(){
    inp.style.height='auto';
    inp.style.height=inp.scrollHeight+'px';
    inp.style.width='auto';
    inp.style.width=Math.max(inp.scrollWidth,80)+'px';
    lockWrapScroll(); // リサイズ時にもブラウザが再度スクロールしようとする場合があるため都度固定
  }
  inp.addEventListener('input',autoResize);
  autoResize();

  function finish(){
    const newText=inp.value||'テキスト';
    if(newText!==lb.text){pushUndo();markUnsaved();}
    lb.text=newText;
    inp.remove();
    el.classList.remove('editing');
    textDiv.style.visibility='';
    textDiv.textContent=lb.text;
    persist();
  }
  inp.addEventListener('blur',finish);
  inp.addEventListener('keydown',e=>{
    if(e.key==='Escape'){
      inp.removeEventListener('blur',finish);
      inp.remove();
      el.classList.remove('editing');
      textDiv.style.visibility='';
    }
    e.stopPropagation();
  });
  inp.addEventListener('mousedown',e=>e.stopPropagation());
}

/* ═══════════════════════════════════════
   RENDER FRAME
═══════════════════════════════════════ */
// 囲い枠の見た目（枠線・背景・タイトル文字色）をまとめて反映。
// 選択中は既存の明るいハイライトを優先し、非選択かつカラー指定があればその色を反映する。
function applyFrameStyle(el,fr,isSelected){
  if(isSelected===undefined)isSelected=selIds.has(fr.id);
  const ft=el.querySelector('.frame-title')||document.getElementById('ft-'+fr.id);
  if(isSelected){
    if(fr.cl){
      // 色付き囲い枠は選択中も色味を保ったまま明るくする（ノードの選択表示と同じ考え方）
      const p=P(fr.cl);
      el.style.borderColor=lightenColor(p.bd,80);
      el.style.borderWidth='2px';
      el.style.background=hexToRgba(p.bd,0.1);
      if(ft)ft.style.color=p.tc;
    }else{
      el.style.borderColor='rgba(255,255,255,0.6)';
      el.style.borderWidth='2px';
      el.style.background='';// .frame.selのCSS指定に任せる
      if(ft)ft.style.color='';
    }
  }else if(fr.cl){
    const p=P(fr.cl);
    el.style.borderColor=p.bd;
    el.style.borderWidth='';
    el.style.background=hexToRgba(p.bd,0.1); // 薄い色付け
    if(ft)ft.style.color=p.tc;
  }else{
    el.style.borderColor='';el.style.borderWidth='';el.style.background='';
    if(ft)ft.style.color='';
  }
}
function renderFrame(fr){
  const old=document.getElementById('fr-'+fr.id);if(old)old.remove();
  const el=document.createElement('div');
  el.className='frame'+(selIds.has(fr.id)?' sel':'');
  el.id='fr-'+fr.id;
  el.style.cssText=`left:${fr.x}px;top:${fr.y}px;width:${fr.w}px;height:${fr.h}px`;
  el.innerHTML=`
    <span class="frame-title" id="ft-${fr.id}" style="font-size:${fr.size||13}px">${esc(fr.title||'')}</span>
    <div class="rs se" data-rs="se"></div><div class="rs sw" data-rs="sw"></div>
    <div class="rs ne" data-rs="ne"></div><div class="rs nw" data-rs="nw"></div>
    <div class="rs e"  data-rs="e"></div><div class="rs w"  data-rs="w"></div>
    <div class="rs s"  data-rs="s"></div><div class="rs n"  data-rs="n"></div>`;
  applyFrameStyle(el,fr);
  applyFrameTitleScale(fr);
  // フレームは最背面に挿入
  cv.insertBefore(el,cv.firstChild);
  bindFrame(el,fr.id);
  return el;
}

function bindFrame(el,frid){
  el.addEventListener('mousedown',e=>{
    if(e.button!==0)return;
    if(e.target.dataset.rs){e.stopPropagation();startResize(frid,e.target.dataset.rs,e);return;}
    if(e.target.classList.contains('frame-title')){e.stopPropagation();startFrameTitleEdit(frid);return;}
    e.stopPropagation();
    if(e.ctrlKey||e.metaKey){toggleSel(frid);return;}
    if(!selIds.has(frid)){clearSel();selIds.add(frid);applySel();}
    if(e.altKey)duplicateSelectionInPlace(); // Alt+ドラッグ：その場で複製してから移動
    startDragMulti(e);
  });
  el.addEventListener('dblclick',e=>{
    e.stopPropagation();
    startFrameTitleEdit(frid);
  });
  // frame-title 上のシングルクリックでも編集開始
  el.querySelector('.frame-title')?.addEventListener('click',e=>{
    e.stopPropagation();
    startFrameTitleEdit(frid);
  });
  el.addEventListener('contextmenu',e=>{
    e.preventDefault();e.stopPropagation();
    ctxFrid=frid;
    posMenu(document.getElementById('frm'),e.clientX,e.clientY);
  });
}

function startFrameTitleEdit(frid){
  const fr=frames.find(f=>f.id===frid);if(!fr)return;
  // フレームのタイトル部分にオーバーレイinputを表示
  const ft=document.getElementById('ft-'+frid);if(!ft)return;
  // 既にinputがあれば無視
  if(ft.tagName==='INPUT')return;

  // 表示中のタイトルの実際の画面上の位置・大きさを直接測定し、編集欄をそこに正確に重ねる。
  // 数式で位置を追いかけると、文字サイズ変更やズーム時の最低サイズ補正など仕様が増えるたびに
  // ズレが生じていたため、実測を基準にすることで今後の仕様変更にも強くする。
  const ftRect=ft.getBoundingClientRect();
  const cvRect=cv.getBoundingClientRect();
  const localLeft=(ftRect.left-cvRect.left)/zoom;
  const localTop=(ftRect.top-cvRect.top)/zoom;
  const localW=ftRect.width/zoom;
  // フォントサイズも、表示中と同じ実効サイズ（ズーム時の最低サイズ補正込み）になるよう
  // ローカル座標系で逆算する（zoom適用後にちょうど同じ見た目になる値）
  const naturalPx=(fr.size||13)*zoom;
  const compFactor=naturalPx<FRAME_TITLE_MIN_PX?FRAME_TITLE_MIN_PX/naturalPx:1;
  const effectiveFontPx=(fr.size||13)*compFactor;

  const inp=document.createElement('textarea');
  inp.value=fr.title||'';
  inp.style.cssText=[
    'position:absolute',
    'z-index:200',
    'background:#252523',
    'border:1px solid #378add',
    'border-radius:5px',
    'outline:none',
    `font-size:${effectiveFontPx}px`,
    'font-weight:500',
    `color:${fr.cl?P(fr.cl).tc:'#f0ede8'}`,
    'font-family:inherit',
    'padding:2px 8px',
    `min-width:${Math.max(localW,120)}px`,
    `left:${localLeft}px`,
    `top:${localTop}px`,
    'white-space:nowrap',
    'overflow:hidden',
    'resize:none',
    'line-height:1',
  ].join(';');

  // cvに直接追加してz-indexで最前面に
  cv.appendChild(inp);
  // #wrapのスクロール位置が本来常に0のはずが、focus()でブラウザに勝手にスクロールされることがあり、
  // それがズーム・パンの基準ズレの原因になるため明示的に抑止・固定する
  inp.focus({preventScroll:true});
  inp.select();
  wrap.scrollLeft=0;wrap.scrollTop=0;

  function finish(){
    // textareaはinputと違い改行を含んだ貼り付けをブロックしないため、念のため除去する
    const newTitle=inp.value.replace(/\n/g,' ').trim()||'グループ';
    if(newTitle!==fr.title){pushUndo();markUnsaved();}
    fr.title=newTitle;
    inp.remove();
    const ftEl=document.getElementById('ft-'+frid);
    if(ftEl)ftEl.textContent=fr.title;
    persist();
  }
  inp.addEventListener('blur',finish);
  inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!e.isComposing){e.preventDefault();inp.blur();}
    if(e.key==='Escape'){inp.removeEventListener('blur',finish);inp.remove();}
    e.stopPropagation();
  });
  inp.addEventListener('mousedown',e=>e.stopPropagation());
}

function startResize(frid,dir,e){
  e.stopPropagation();
  const fr=frames.find(f=>f.id===frid);if(!fr)return;
  pushUndo(); // 操作開始時点の状態を保存
  const ox=fr.x,oy=fr.y,ow=fr.w,oh=fr.h;
  const sx=e.clientX,sy=e.clientY;
  function mm(ev){
    const dx=(ev.clientX-sx)/zoom,dy=(ev.clientY-sy)/zoom;
    if(dir.includes('e'))fr.w=Math.max(80,ow+dx);
    if(dir.includes('s'))fr.h=Math.max(60,oh+dy);
    if(dir.includes('w')){fr.x=ox+dx;fr.w=Math.max(80,ow-dx);}
    if(dir.includes('n')){fr.y=oy+dy;fr.h=Math.max(60,oh-dy);}
    const el=document.getElementById('fr-'+frid);
    if(el)el.style.cssText=`left:${fr.x}px;top:${fr.y}px;width:${fr.w}px;height:${fr.h}px`;
  }
  function mu(){document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);persist();}
  document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);
}
// ノードの横幅リサイズ（高さは中身に応じて自動のまま）
const NODE_MIN_W=100;
function startNodeResize(nid,dir,e){
  e.stopPropagation();
  const n=nodes[nid];if(!n)return;
  const el=document.getElementById('nd-'+nid);if(!el)return;
  pushUndo();
  // 未リサイズ（自動幅）の場合は、その時点の実描画幅を引き継いでから手動リサイズを開始する
  const startW=n.w||el.getBoundingClientRect().width/zoom;
  const ox=n.x;
  const sx=e.clientX;
  function mm(ev){
    const dx=(ev.clientX-sx)/zoom;
    if(dir==='e'){
      n.w=Math.max(NODE_MIN_W,startW+dx);
    }else{
      n.x=ox+dx;
      n.w=Math.max(NODE_MIN_W,startW-dx);
    }
    el.style.left=n.x+'px';
    el.style.width=n.w+'px';
    el.style.minWidth='0';
    el.style.maxWidth='none';
    renderEdges(); // 幅が変わると折り返し高さ・接続ポート位置が変わるため追従させる
  }
  function mu(){
    document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);
    persist();markUnsaved();
  }
  document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);
}

/* ═══════════════════════════════════════
   RENDER ALL
═══════════════════════════════════════ */
function renderAll(){
  cv.querySelectorAll('.node,.tlabel,.frame,.img-obj').forEach(e=>e.remove());
  frames.forEach(f=>renderFrame(f));
  images.forEach(i=>renderImage(i));
  Object.values(nodes).forEach(n=>renderNode(n));
  labels.forEach(l=>renderLabel(l));
  // ノードのレイアウト確定を待ってからエッジを描画
  // rAFを3重にすることでブラウザのレイアウト計算完了を確実に待つ
  requestAnimationFrame(()=>requestAnimationFrame(()=>requestAnimationFrame(()=>{
    renderEdges();
    // メモハンドルのy座標も再計算（ノードサイズ確定後）
    Object.values(nodes).forEach(n=>{
      const el=document.getElementById('nd-'+n.id);
      if(!el)return;
      el.querySelectorAll('.hm').forEach(h=>h.remove());
      const lines=parseMemo(n.memo);
      const hasH=lines.some(l=>l.t==='handle');
      if(!hasH)return;
      const p=P(n.cl);
      const elRect=el.getBoundingClientRect();
      const scale=elRect.width/el.offsetWidth||1;
      const nmemo=el.querySelector('.nmemo');if(!nmemo)return;
      lines.forEach((l,i)=>{
        if(l.t!=='handle')return;
        const lineEl=nmemo.querySelector(`[data-mi="${i}"]`);if(!lineEl)return;
        const lr=lineEl.getBoundingClientRect();
        const topPx=((lr.top+lr.height/2)-elRect.top)/scale;
        const h=document.createElement('div');
        h.className='handle hm';
        h.style.cssText=`background:${p.bd};border-color:${p.bg};top:${topPx}px`;
        const portId=l.pid!=null?'m_'+l.pid:'m'+i;
        h.dataset.nid=n.id;h.dataset.port=portId;
        el.appendChild(h);
        h.addEventListener('mousedown',e=>{
          if(e.button!==0)return;e.stopPropagation();startCon(n.id,portId);
        });
      });
    });
    renderEdges();
  })));
}

/* ═══════════════════════════════════════
   SELECTION
═══════════════════════════════════════ */
function clearSel(){
  selIds.forEach(id=>{
    const ndEl=document.getElementById('nd-'+id);
    if(ndEl){
      const n=nodes[id];
      if(n)applyNodeSelBorder(ndEl,n,false);
      ndEl.classList.remove('sel');
    }
    const frEl=document.getElementById('fr-'+id);
    if(frEl){
      const fr=frames.find(f=>f.id===id);
      if(fr)applyFrameStyle(frEl,fr,false);
      frEl.classList.remove('sel');
    }
    const lbEl=document.getElementById('lb-'+id);
    if(lbEl)lbEl.classList.remove('sel');
    const imEl=document.getElementById('im-'+id);
    if(imEl){imEl.classList.remove('sel');imEl.style.outline='';}
  });
  selIds.clear();
}
function toggleSel(id){
  if(selIds.has(id)){selIds.delete(id);}
  else{selIds.add(id);}
  applySel();
}
function applySel(){
  // 一旦全selをクリア（画像含む）
  cv.querySelectorAll('.node.sel,.tlabel.sel,.frame.sel,.img-obj.sel').forEach(el=>{
    el.classList.remove('sel');
    el.style.outline='';
  });
  // フレームは選択時にborder/background/タイトル色を直接上書きしているため、非選択に戻すものは
  // カラー指定（あれば）または既定に復元する（選択中のものは下のループで改めて処理する）
  frames.forEach(fr=>{
    if(selIds.has(fr.id))return;
    const el=document.getElementById('fr-'+fr.id);
    if(el)applyFrameStyle(el,fr,false);
  });
  // ノードも選択時に枠線の太さ・色を直接上書きしているため、同様に非選択のものを復元する
  Object.values(nodes).forEach(n=>{
    if(selIds.has(n.id))return;
    const el=document.getElementById('nd-'+n.id);
    if(el)applyNodeSelBorder(el,n,false);
  });
  selIds.forEach(id=>{
    // ノード
    const ndEl=document.getElementById('nd-'+id);
    if(ndEl){
      ndEl.classList.add('sel');
      const n=nodes[id];
      if(n)applyNodeSelBorder(ndEl,n,true);
    }
    // テキストラベル
    const lbEl=document.getElementById('lb-'+id);
    if(lbEl){
      lbEl.classList.add('sel');
      const lb=labels.find(l=>l.id===id);
      if(lb)lbEl.style.outlineColor=lb.color?P(lb.color).bd:P('gray').bd;
    }
    // フレーム
    const frEl=document.getElementById('fr-'+id);
    if(frEl){
      frEl.classList.add('sel');
      const fr=frames.find(f=>f.id===id);
      if(fr)applyFrameStyle(frEl,fr,true);
    }
    // 画像
    const imEl=document.getElementById('im-'+id);
    if(imEl)imEl.classList.add('sel');
  });
}

/* ═══════════════════════════════════════
   BIND NODE
═══════════════════════════════════════ */
function bindNode(el,nid){
  el.addEventListener('mousedown',e=>{
    if(e.button!==0)return;
    const h=e.target.closest('[data-port]');
    if(h){e.stopPropagation();startCon(h.dataset.nid,h.dataset.port);return;}
    if(e.target.dataset.rs){e.stopPropagation();startNodeResize(nid,e.target.dataset.rs,e);return;}
    e.stopPropagation();
    if(e.ctrlKey||e.metaKey){toggleSel(nid);return;}
    if(!selIds.has(nid)){clearSel();selIds.add(nid);applySel();}
    if(e.altKey)duplicateSelectionInPlace(); // Alt+ドラッグ：その場で複製してから移動
    startDragMulti(e);
  });
  el.addEventListener('dblclick',e=>{e.stopPropagation();openModal(nid);});
  el.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation();openNM(e.clientX,e.clientY,nid);});
  // マウスオーバーでメモのプレビューを表示（0.5秒ホールドで表示、画面端では自動的に反対側に表示）
  let hoverT=null;
  el.addEventListener('mouseenter',()=>{
    const n=nodes[nid];if(!n||!n.memo||!n.memo.trim())return;
    clearTimeout(hoverT);
    hoverT=setTimeout(()=>showNodeHoverPreview(n,el),500);
  });
  el.addEventListener('mouseleave',()=>{
    clearTimeout(hoverT);
    hideNodeHoverPreview();
  });
  el.addEventListener('mousedown',()=>hideNodeHoverPreview());
}
function showNodeHoverPreview(n,el){
  const prev=document.getElementById('node-hover-preview');
  // 編集モーダルのMEMO欄と同じ内容を表示する（・[N]等のIDタグも含め、ノード上で隠れている生テキストをそのまま見せる）
  let html=`<div class="nhp-title">${esc(n.title||'')}</div>`;
  const rawLines=(n.memo||'').split('\n');
  rawLines.forEach(line=>{
    html+=`<div class="nhp-line">${linkify(line)||'&nbsp;'}</div>`;
  });
  prev.innerHTML=html;
  prev.classList.add('show');
  const r=el.getBoundingClientRect();
  const pw=prev.offsetWidth,ph=prev.offsetHeight;
  // 右側に表示。画面右端に収まらなければ左側に反転。上下も画面内に収める
  let left=r.right+10,top=r.top;
  if(left+pw>window.innerWidth-8)left=r.left-pw-10;
  if(left<8)left=8;
  if(top+ph>window.innerHeight-8)top=window.innerHeight-ph-8;
  if(top<8)top=8;
  prev.style.left=left+'px';
  prev.style.top=top+'px';
}
function hideNodeHoverPreview(){
  document.getElementById('node-hover-preview').classList.remove('show');
}

/* ═══════════════════════════════════════
   DRAG MULTI
═══════════════════════════════════════ */
// 選択中の要素をその場で複製する（Alt+ドラッグ用）。ノード・ラベル・枠・画像に対応。
// 選択範囲内のノード同士をつなぐ接続線も一緒に複製する（範囲外への接続は複製しない）
// 複製直後に呼ばれるstartDragMultiの最初のpushUndoを抑制し、複製+移動をひとつのUndo単位にまとめる
function duplicateSelectionInPlace(){
  const ids=[...selIds];
  if(!ids.length)return;
  pushUndo();
  const newIds=[];
  const idMap={}; // 旧ID→新ID（複製ノードの接続線再構築に使用）
  ids.forEach(id=>{
    if(nodes[id]){
      const newId=gid();
      nodes[newId]={...JSON.parse(JSON.stringify(nodes[id])),id:newId};
      renderNode(nodes[newId]);newIds.push(newId);idMap[id]=newId;return;
    }
    const lb=labels.find(l=>l.id===id);
    if(lb){
      const newId=gid();
      const copy={...JSON.parse(JSON.stringify(lb)),id:newId};
      labels.push(copy);renderLabel(copy);newIds.push(newId);return;
    }
    const fr=frames.find(f=>f.id===id);
    if(fr){
      const newId=gid();
      const copy={...JSON.parse(JSON.stringify(fr)),id:newId};
      frames.push(copy);renderFrame(copy);newIds.push(newId);return;
    }
    const im=images.find(i=>i.id===id);
    if(im){
      const newId=gid();
      const copy={...JSON.parse(JSON.stringify(im)),id:newId};
      images.push(copy);renderImage(copy);newIds.push(newId);return;
    }
  });
  // 選択範囲内のノード同士を結ぶ接続線を複製する（fn・tn両方が複製対象だった場合のみ）
  edges.forEach(ed=>{
    if(idMap[ed.fn]&&idMap[ed.tn]){
      edges.push({...JSON.parse(JSON.stringify(ed)),id:gid(),fn:idMap[ed.fn],tn:idMap[ed.tn]});
    }
  });
  clearSel();newIds.forEach(id=>selIds.add(id));applySel();
  renderEdges();
  _skipNextPushUndo=true;
}
function startDragMulti(e){
  const initPos={};
  selIds.forEach(id=>{
    const n=nodes[id];
    const lb=labels.find(l=>l.id===id);
    const fr=frames.find(f=>f.id===id);
    const im=images.find(i=>i.id===id);
    const obj=n||lb||fr||im;
    if(obj)initPos[id]={x:obj.x,y:obj.y};
  });
  const sx=e.clientX,sy=e.clientY;
  let moved=false;
  function mm(ev){
    let dx=(ev.clientX-sx)/zoom,dy=(ev.clientY-sy)/zoom;
    if(Math.abs(dx)>3||Math.abs(dy)>3){
      if(!moved)pushUndo(); // 実際に動き始めた瞬間（移動前の状態）に1回だけ保存
      moved=true;
    }
    // Shift押下中は、移動量が大きい方の軸だけに固定（水平・垂直移動）
    if(ev.shiftKey){
      if(Math.abs(dx)>Math.abs(dy))dy=0;else dx=0;
    }
    selIds.forEach(id=>{
      const init=initPos[id];if(!init)return;
      const n=nodes[id];const lb=labels.find(l=>l.id===id);const fr=frames.find(f=>f.id===id);const im=images.find(i=>i.id===id);
      const obj=n||lb||fr||im;if(!obj)return;
      obj.x=init.x+dx;obj.y=init.y+dy;
      const elId=n?'nd-'+id:lb?'lb-'+id:fr?'fr-'+id:'im-'+id;
      const el=document.getElementById(elId);
      if(el){el.style.left=obj.x+'px';el.style.top=obj.y+'px';}
    });
    renderEdges();
  }
  function mu(){
    document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);
    if(moved){persist();markUnsaved();}
  }
  document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);
}

/* ═══════════════════════════════════════
   RUBBER BAND
═══════════════════════════════════════ */
function startRubberBand(e){
  const p=cvXY(e.clientX,e.clientY);
  const startP={x:p.x,y:p.y};
  selBox.style.cssText=`display:block;left:${p.x}px;top:${p.y}px;width:0;height:0`;
  clearSel();
  function mm(ev){
    const cur=cvXY(ev.clientX,ev.clientY);
    const x=Math.min(startP.x,cur.x),y=Math.min(startP.y,cur.y);
    const w=Math.abs(cur.x-startP.x),h=Math.abs(cur.y-startP.y);
    selBox.style.cssText=`display:block;left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
    clearSel();
    // ノード
    Object.values(nodes).forEach(n=>{
      const el=document.getElementById('nd-'+n.id);if(!el)return;
      if(n.x+el.offsetWidth>x&&n.x<x+w&&n.y+el.offsetHeight>y&&n.y<y+h)selIds.add(n.id);
    });
    // フレーム
    frames.forEach(fr=>{
      if(fr.x+fr.w>x&&fr.x<x+w&&fr.y+fr.h>y&&fr.y<y+h)selIds.add(fr.id);
    });
    // テキストラベル
    labels.forEach(lb=>{
      const el=document.getElementById('lb-'+lb.id);if(!el)return;
      if(lb.x+el.offsetWidth>x&&lb.x<x+w&&lb.y+el.offsetHeight>y&&lb.y<y+h)selIds.add(lb.id);
    });
    // 画像
    images.forEach(im=>{
      if(im.x+im.w>x&&im.x<x+w&&im.y+im.h>y&&im.y<y+h)selIds.add(im.id);
    });
    applySel();
  }
  function mu(){
    document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);
    selBox.style.display='none';
  }
  document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);
}

/* ═══════════════════════════════════════
   DRAW FRAME (自由描画)
═══════════════════════════════════════ */
function startDrawFrame(e){
  const p=cvXY(e.clientX,e.clientY);
  const startP={x:p.x,y:p.y};
  framePreview.style.cssText=`display:block;left:${p.x}px;top:${p.y}px;width:0;height:0`;
  function mm(ev){
    const cur=cvXY(ev.clientX,ev.clientY);
    const x=Math.min(startP.x,cur.x),y=Math.min(startP.y,cur.y);
    const w=Math.abs(cur.x-startP.x),h=Math.abs(cur.y-startP.y);
    framePreview.style.cssText=`display:block;left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
  }
  function mu(ev){
    document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);
    framePreview.style.display='none';
    drawingFrame=false;
    wrap.classList.remove('draw-frame');
    document.getElementById('btn-frame').classList.remove('on');
    const cur=cvXY(ev.clientX,ev.clientY);
    const x=Math.min(startP.x,cur.x),y=Math.min(startP.y,cur.y);
    const w=Math.abs(cur.x-startP.x),h=Math.abs(cur.y-startP.y);
    if(w>20&&h>20)addFrame(x,y,w,h);
  }
  document.addEventListener('mousemove',mm);document.addEventListener('mouseup',mu);
}

/* ═══════════════════════════════════════
   EDGES
═══════════════════════════════════════ */
// ノードの実際の幅・高さを返す（offsetWidthが0の場合はBoundingClientRectから実測。zoom考慮）
function nodeSize(nid){
  const el=document.getElementById('nd-'+nid);
  let w=el?el.offsetWidth:200,h=el?el.offsetHeight:80;
  if(el&&w===0){
    const r=el.getBoundingClientRect();
    w=r.width/zoom||200;h=r.height/zoom||80;
  }
  return{w,h};
}
function portXY(nid,port){
  const n=nodes[nid];if(!n)return{x:0,y:0};
  const el=document.getElementById('nd-'+nid);
  const{w,h}=nodeSize(nid);
  if(port==='l')return{x:n.x,y:n.y+h/2};
  if(port==='r')return{x:n.x+w,y:n.y+h/2};
  if(port&&port[0]==='m'){
    const hEl=el?.querySelector(`.hm[data-port="${port}"]`);
    if(hEl){const t=parseFloat(hEl.style.top)||0;return{x:n.x+w,y:n.y+t};}
    return{x:n.x+w,y:n.y+h/2};
  }
  return{x:n.x+w/2,y:n.y+h/2};
}
// ノードそのものの矩形（左上・右下）を返す
function nodeRect(nid){
  const n=nodes[nid];if(!n)return{left:0,top:0,right:0,bottom:0};
  const{w,h}=nodeSize(nid);
  return{left:n.x,top:n.y,right:n.x+w,bottom:n.y+h};
}
// 矩形を上下左右にm px広げた矩形を返す
function expandRect(r,m){
  return{left:r.left-m,top:r.top-m,right:r.right+m,bottom:r.bottom+m};
}
// ノードの周囲に確保する見えない矩形の枠までの距離(px)。接続線はこの枠の外周に沿って進む
const EDGE_FRAME_MARGIN=20;
// 同じノードの同じ辺を通る接続線を区別するためにずらす幅(px)
const EDGE_LANE_GAP=10;
// 経路の角を丸める円弧の半径(px)。区間が短い場合は角ごとに自動で縮める
const EDGE_CORNER_RADIUS=12;
// 接続線の区間をドラッグしたとみなす最小移動量(px)。これ未満の移動はクリック（選択）として扱う。
// 接続線は元々シングルクリックで選択できるため、閾値が無いとクリックのつもりの操作が
// 意図せず経路をずらしてしまう
const EDGE_SEG_DRAG_THRESHOLD=4;
// 手動でずらした接続線の表示で、区間の長さがこの値(px)以下なら前後の区間とつなげて省略する。
// 微調整の結果として残る意味のない小さな折れを見せないための閾値で、値は運用しながら調整する想定
const SHORT_SEGMENT_MERGE_LEN=10;
// 矩形の4隅を、時計回りに辿ったときにその隅から始まる辺の名前つきで返す
function frameCorners(f){
  return[
    {x:f.left,y:f.top,side:'top'},
    {x:f.right,y:f.top,side:'right'},
    {x:f.right,y:f.bottom,side:'bottom'},
    {x:f.left,y:f.bottom,side:'left'}
  ];
}
// 矩形の外周を時計回りに辿ったときの、左上角からの距離（弧長）を返す。pはside('top'/'right'/'bottom'/'left')を持つ点
function perimeterPos(f,p){
  const w=f.right-f.left,h=f.bottom-f.top;
  if(p.side==='top')return p.x-f.left;
  if(p.side==='right')return w+(p.y-f.top);
  if(p.side==='bottom')return w+h+(f.right-p.x);
  return w+h+w+(f.bottom-p.y); // left
}
// 矩形の外周に沿って、fromからtoまで時計回り／反時計回りのうち短い方の経路を選び、
// その途中で通過する角（矩形の頂点）だけを順番に並べて返す（from・to自体は含まない）
function walkFramePerimeter(f,from,to){
  const w=f.right-f.left,h=f.bottom-f.top,total=2*(w+h);
  const posFrom=perimeterPos(f,from),posTo=perimeterPos(f,to);
  const cw=(posTo-posFrom+total)%total; // 時計回りに進んだ場合の距離
  const ccw=(posFrom-posTo+total)%total; // 反時計回りに進んだ場合の距離
  const corners=frameCorners(f).map(c=>({...c,pos:perimeterPos(f,c)}));
  if(cw<=ccw){
    return corners
      .map(c=>({...c,rel:(c.pos-posFrom+total)%total}))
      .filter(c=>c.rel>0&&c.rel<cw)
      .sort((a,b)=>a.rel-b.rel);
  }
  return corners
    .map(c=>({...c,rel:(posFrom-c.pos+total)%total}))
    .filter(c=>c.rel>0&&c.rel<ccw)
    .sort((a,b)=>a.rel-b.rel);
}
// 隣接する点が実質同じ座標になっている場合（角が枠の頂点と一致した場合など）や、
// 前後の区間と進行方向が変わらない中継点（実際には折れていない点）を取り除く。
// 進行方向が変わらない点を残したままにすると、角を丸める処理が「折れていない場所」にも
// 適用され、半径×2の弦を持つ円弧＝半円状のふくらみが描かれてしまうため、ここで除去する。
function dedupePoints(points){
  const out=[];
  points.forEach(p=>{
    const last=out[out.length-1];
    if(!last||Math.hypot(p.x-last.x,p.y-last.y)>0.01)out.push(p);
  });
  let changed=true;
  while(changed){
    changed=false;
    for(let i=1;i<out.length-1;i++){
      const prev=out[i-1],cur=out[i],next=out[i+1];
      const inX=cur.x-prev.x,inY=cur.y-prev.y,outX=next.x-cur.x,outY=next.y-cur.y;
      const inLen=Math.hypot(inX,inY),outLen=Math.hypot(outX,outY);
      if(inLen<0.01||outLen<0.01)continue;
      const cross=inX*outY-inY*outX,dot=inX*outX+inY*outY;
      if(Math.abs(cross)<0.01&&dot>0){out.splice(i,1);changed=true;break;}
    }
  }
  return out;
}
// 2つの枠を橋渡しする区間の候補を複数パターン作る。それぞれ出口eF・入口eTと、
// 必要なら間の中継点bridgeを持つ。候補を絞り込むことはせず、位置関係にかかわらず
// 常に同じパターンを機械的に作る（接続元と接続先の位置関係による場合分けはしない）
function buildBridgeCandidates(frameF,frameT,cf,ct,dF,dT){
  const xOv={lo:Math.max(frameF.left,frameT.left),hi:Math.min(frameF.right,frameT.right)};
  const yOv={lo:Math.max(frameF.top,frameT.top),hi:Math.min(frameF.bottom,frameT.bottom)};
  const fCx=(frameF.left+frameF.right)/2,fCy=(frameF.top+frameF.bottom)/2;
  const tCx=(frameT.left+frameT.right)/2,tCy=(frameT.top+frameT.bottom)/2;
  const list=[];
  if(yOv.lo<=yOv.hi){
    // 上下方向に重なりがある→その帯の中で水平に橋渡しする候補
    const y=Math.min(Math.max((cf.y+ct.y)/2,yOv.lo),yOv.hi);
    const fIsLeft=fCx<=tCx;
    list.push({
      eF:{x:fIsLeft?frameF.right:frameF.left,y,side:fIsLeft?'right':'left'},
      eT:{x:fIsLeft?frameT.left:frameT.right,y,side:fIsLeft?'left':'right'},
      bridge:null
    });
  }
  if(xOv.lo<=xOv.hi){
    // 左右方向に重なりがある→その帯の中で垂直に橋渡しする候補
    const x=Math.min(Math.max((cf.x+ct.x)/2,xOv.lo),xOv.hi);
    const fIsAbove=fCy<=tCy;
    list.push({
      eF:{x,y:fIsAbove?frameF.bottom:frameF.top,side:fIsAbove?'bottom':'top'},
      eT:{x,y:fIsAbove?frameT.top:frameT.bottom,side:fIsAbove?'top':'bottom'},
      bridge:null
    });
  }
  {
    // 枠同士の最も近い角同士を、垂直・水平2区間で橋渡しする候補（重なりの有無によらず常に作る）。
    // 中継点は接続元側で折れるパターン（eF.yを維持）・接続先側で折れるパターン（eT.xを維持しeF.xを維持）の
    // 両方を機械的に作る。片方しか作らないと、他の候補が枠を横切って無効になる場面で、
    // 接続先寄りで折れる経路が候補にすら含まれず選べなくなるため
    const fIsLeft=fCx<=tCx,fIsAbove=fCy<=tCy;
    const eF={x:fIsLeft?frameF.right:frameF.left,y:fIsAbove?frameF.bottom:frameF.top,side:fIsAbove?'bottom':'top'};
    const eT={x:fIsLeft?frameT.left:frameT.right,y:fIsAbove?frameT.top:frameT.bottom,side:fIsAbove?'top':'bottom'};
    list.push({eF,eT,bridge:{x:eT.x,y:eF.y}});
    list.push({eF,eT,bridge:{x:eF.x,y:eT.y}});
  }
  {
    // 出口dF・入口dTを、枠の角を経由せずに1つの中継点だけで直結する候補。
    // 上の「最も近い角同士」の候補は、枠の実際の頂点を経由するため、
    // 出口・入口の高さ（または横位置）が枠の頂点と一致しない場合に
    // 本来不要な余分な折れが生じる。中継点の縦横を入れ替えた2パターンを
    // 両方機械的に作り、他の候補と合わせて折れ最小・同数なら最短の基準で選ばせる。
    // 枠の内部を横切る経路になる場合はbuildEdgeRoute側で候補から除外される。
    list.push({eF:dF,eT:dT,bridge:{x:dF.x,y:dT.y}});
    list.push({eF:dF,eT:dT,bridge:{x:dT.x,y:dF.y}});
  }
  return list;
}
// 水平・垂直な線分が、矩形rの内部（境界は含まない）を通過するかどうか
function segmentCrossesRectInterior(a,b,r){
  const EPS=0.01;
  if(Math.abs(a.x-b.x)<EPS){
    const x=a.x;
    if(x<=r.left+EPS||x>=r.right-EPS)return false;
    const y0=Math.min(a.y,b.y),y1=Math.max(a.y,b.y);
    return y1>r.top+EPS&&y0<r.bottom-EPS;
  }
  if(Math.abs(a.y-b.y)<EPS){
    const y=a.y;
    if(y<=r.top+EPS||y>=r.bottom-EPS)return false;
    const x0=Math.min(a.x,b.x),x1=Math.max(a.x,b.x);
    return x1>r.left+EPS&&x0<r.right-EPS;
  }
  return false;
}
// 経路の中間区間（接続点から枠を垂直に出入りする最初と最後の区間は除く）が、
// 指定した枠の内部を横切っていないかを調べる
function routeAvoidsFrame(points,rect){
  for(let i=2;i<=points.length-2;i++){
    if(segmentCrossesRectInterior(points[i-1],points[i],rect))return false;
  }
  return true;
}
// 経路の折れ（進行方向が変わる箇所）の数を数える
function routeBendCount(points){
  let bends=0;
  for(let i=1;i<points.length-1;i++){
    const prev=points[i-1],cur=points[i],next=points[i+1];
    const inX=cur.x-prev.x,inY=cur.y-prev.y,outX=next.x-cur.x,outY=next.y-cur.y;
    const dIn=Math.abs(inX)>Math.abs(inY)?(inX>0?'R':'L'):(inY>0?'D':'U');
    const dOut=Math.abs(outX)>Math.abs(outY)?(outX>0?'R':'L'):(outY>0?'D':'U');
    if(dIn!==dOut)bends++;
  }
  return bends;
}
// 経路の全長を求める
function routeLength(points){
  let len=0;
  for(let i=1;i<points.length;i++)len+=Math.hypot(points[i].x-points[i-1].x,points[i].y-points[i-1].y);
  return len;
}
// 各折れ点について、始点(cf)からそこに至るまでの経路上の距離（dedupePoints済みの
// 経路では、残っている中継点はすべて実際に方向が変わる箇所になっている）を求め、合計する。
// 最初の折れ点までの距離だけを見ると、複数の折れ点を持つ経路同士で「最初の折れ」がたまたま
// 同じ位置になる場合（例：接続元側で早く曲がる経路と、接続先側でまとめて曲がる経路が
// 同じ出口の直後まで同じ経路をたどる場合）に区別できない。折れ点ごとの距離を合計することで、
// 後半の折れ点が終点寄りにあるほど値が大きくなるようにし、経路全体としてどちらに
// 折れが偏っているかを判定できるようにする
function routeBendLeadSum(points){
  if(points.length<3)return Infinity; // 折れが無い経路は比較不要
  let sum=0,cum=0;
  for(let i=1;i<points.length-1;i++){
    cum+=Math.hypot(points[i].x-points[i-1].x,points[i].y-points[i-1].y);
    sum+=cum;
  }
  return sum;
}
// 接続元・接続先それぞれの枠に沿った経路の通過点列を作る（始点cf・終点ctを含む）。
// 橋渡し区間の候補（buildBridgeCandidates）ごとに、枠を回る方向（短い方）を機械的に決めて
// 経路を組み立て、その中から折れの数が最小のものを選ぶ（同数なら距離が短い方、
// さらに同数なら折れ点がより終点寄りに偏っている方＝接続先寄りで折れている方）。
// 接続元側の回り込みと接続先側の回り込みを別々に決めるのではなく、全体を1つの経路として
// まとめて評価する。経路探索は行わず、考慮するのもこの2つの枠だけ（他ノードの枠は無視する）
function buildEdgeRoute(cf,outF,frameF,ct,outT,frameT){
  // 接続点から枠の外周へ垂直に出た点（枠が存在しない区間の始点・終点）
  const dF={x:outF<0?frameF.left:frameF.right,y:cf.y,side:outF<0?'left':'right'};
  const dT={x:outT<0?frameT.left:frameT.right,y:ct.y,side:outT<0?'left':'right'};

  let best=null,bestBends=Infinity,bestLen=Infinity,bestLead=-Infinity;
  buildBridgeCandidates(frameF,frameT,cf,ct,dF,dT).forEach(({eF,eT,bridge})=>{
    const pathF=walkFramePerimeter(frameF,dF,eF);
    const pathT=walkFramePerimeter(frameT,eT,dT);
    const points=[cf,dF,...pathF,eF];
    if(bridge)points.push(bridge);
    points.push(eT,...pathT,dT,ct);
    const route=dedupePoints(points);
    // 相手側の枠の内部を横切ってしまう経路は候補から除外する
    if(!routeAvoidsFrame(route,frameF)||!routeAvoidsFrame(route,frameT))return;
    const bends=routeBendCount(route),len=routeLength(route),lead=routeBendLeadSum(route);
    if(bends<bestBends||(bends===bestBends&&len<bestLen)||
       (bends===bestBends&&len===bestLen&&lead>bestLead)){
      best=route;bestBends=bends;bestLen=len;bestLead=lead;
    }
  });
  return best;
}
// 水平・垂直の区間だけからなる折れ線のパス文字列を作る。各角はradiusで丸めるが、
// 前後の区間がradius*2より短い場合はその角だけ半径を自動的に縮める
function roundedOrthogonalPath(points,radius){
  let d=`M${points[0].x},${points[0].y}`;
  for(let i=1;i<points.length-1;i++){
    const prev=points[i-1],cur=points[i],next=points[i+1];
    const lenIn=Math.hypot(cur.x-prev.x,cur.y-prev.y);
    const lenOut=Math.hypot(next.x-cur.x,next.y-cur.y);
    const r=Math.min(radius,lenIn/2,lenOut/2);
    if(r<=0){d+=` L${cur.x},${cur.y}`;continue;}
    const inX=(cur.x-prev.x)/lenIn,inY=(cur.y-prev.y)/lenIn;
    const outX=(next.x-cur.x)/lenOut,outY=(next.y-cur.y)/lenOut;
    const arcStart={x:cur.x-inX*r,y:cur.y-inY*r};
    const arcEnd={x:cur.x+outX*r,y:cur.y+outY*r};
    const sweep=(inX*outY-inY*outX)>0?1:0;
    d+=` L${arcStart.x},${arcStart.y} A${r},${r} 0 0,${sweep} ${arcEnd.x},${arcEnd.y}`;
  }
  const last=points[points.length-1];
  d+=` L${last.x},${last.y}`;
  return d;
}
// 同じノードの同じ辺（'l'側／'r'・'m'側）を通る接続線を数え、本数の中心を0として
// EDGE_LANE_GAPずつ対称にずらすオフセット量を、エッジIDごとに求める。
// 接続元側('f')・接続先側('t')それぞれ独立に集計するため、両方の枠に反映される
function computeEdgeLaneOffsets(){
  const groups={};
  edges.forEach(e=>{
    const fKey=e.fn+':'+(e.fp==='l'?'left':'right');
    const tKey=e.tn+':'+(e.tp==='l'?'left':'right');
    (groups[fKey]=groups[fKey]||[]).push({id:e.id,side:'f'});
    (groups[tKey]=groups[tKey]||[]).push({id:e.id,side:'t'});
  });
  const offset={};
  Object.values(groups).forEach(list=>{
    const n=list.length;
    list.forEach((item,i)=>{
      offset[item.id]=offset[item.id]||{f:0,t:0};
      offset[item.id][item.side]=(i-(n-1)/2)*EDGE_LANE_GAP;
    });
  });
  return offset;
}
// エッジに保存されている手動のずらし量(routeAdjust)を、自動計算した経路(points)に適用する。
// routeAdjustは「何番目の区間に何pxずらすか」という相対量で保持しており、絶対座標では持たない。
// 区間数(points.length-1)が保存時と変わっていた場合は、どの区間を指すか対応が取れなくなるため
// ずらし量ごと破棄し、自動計算された初期状態に戻す
function applyRouteOffsets(e,points){
  const segCount=points.length-1;
  if(e.routeAdjust&&e.routeAdjust.n!==segCount)e.routeAdjust=null;
  const off=e.routeAdjust&&e.routeAdjust.off;
  if(!off)return points;
  const shifted=points.map(p=>({...p}));
  Object.keys(off).forEach(key=>{
    const i=Number(key);
    if(i<1||i>segCount-2)return; // 接続点直結の最初・最後の区間、および範囲外は対象外
    const amt=off[key];
    const a=shifted[i],b=shifted[i+1];
    if(Math.abs(a.y-b.y)<0.01){a.y+=amt;b.y+=amt;} // 横区間→上下にずらす
    else{a.x+=amt;b.x+=amt;} // 縦区間→左右にずらす
  });
  return shifted;
}
// 手動でずらされた接続線について、長さがSHORT_SEGMENT_MERGE_LEN以下の中間区間を省略し、
// その前後の区間をつなげた表示用の点列を返す。手動調整されていない接続線には適用しない
// （自動計算だけの経路にできる小さな段差は、接続点の位置から必然的に生じるものであり、
// 消してしまうと後述の理由で線が接続点から浮いて見えるおそれがあるため）。
// 接続点に直結する最初と最後の区間（区間番号0とsegCount-1）は、routeAdjustの適用対象からも
// 除外されている区間であり、ここでも同様に省略の対象から外す。
// この関数はrenderEdges内でd属性（表示用パスと当たり判定用パスの両方が共有する）を作る直前にだけ
// 使い、ドラッグ判定や区間数の判定にはapplyRouteOffsets後・省略前のpointsをそのまま使うため、
// ここでの省略はrouteAdjust（ずらし量）にも区間数の判定にも影響しない
function simplifyManualRoute(e,points){
  const off=e.routeAdjust&&e.routeAdjust.off;
  if(!off||!Object.keys(off).length)return points;
  const segCount=points.length-1;
  if(segCount<3)return points; // 最初・最後以外に区間が無ければ省略対象がない
  const removed=new Array(points.length).fill(false);
  for(let i=1;i<=segCount-2;i++){
    const a=points[i],b=points[i+1];
    if(Math.hypot(b.x-a.x,b.y-a.y)<=SHORT_SEGMENT_MERGE_LEN){removed[i]=true;removed[i+1]=true;}
  }
  const result=points.filter((_,idx)=>!removed[idx]);
  return result.length>=2?result:points;
}
// 点ptから線分a-bまでの最短距離
function distToSegment(pt,a,b){
  const dx=b.x-a.x,dy=b.y-a.y,len2=dx*dx+dy*dy;
  if(len2<0.0001)return Math.hypot(pt.x-a.x,pt.y-a.y);
  let t=((pt.x-a.x)*dx+(pt.y-a.y)*dy)/len2;
  t=Math.max(0,Math.min(1,t));
  return Math.hypot(pt.x-(a.x+t*dx),pt.y-(a.y+t*dy));
}
// 経路(points)の区間のうち、点ptに最も近い区間の番号と向きを返す
function nearestRouteSegment(points,pt){
  let idx=-1,best=Infinity;
  for(let i=0;i<points.length-1;i++){
    const d=distToSegment(pt,points[i],points[i+1]);
    if(d<best){best=d;idx=i;}
  }
  if(idx<0)return null;
  const a=points[idx],b=points[idx+1];
  return {idx,orient:Math.abs(a.x-b.x)<0.01?'v':'h'};
}
// 接続線の中間区間をドラッグして経路をずらす操作。判定用の透明パス(hit)のmousedownから呼ばれる。
// EDGE_SEG_DRAG_THRESHOLD以上動いた時点で初めてドラッグとみなし、そこでpushUndoを1回だけ呼ぶ。
// 閾値未満のまま指を離した場合は、従来通りクリックとして接続線の選択切替を行う
function startEdgeSegDrag(ev,e,points){
  if(ev.button!==0)return;
  ev.stopPropagation();
  const startX=ev.clientX,startY=ev.clientY;
  const seg=nearestRouteSegment(points,cvXY(startX,startY));
  const segCount=points.length-1;
  const draggable=seg&&seg.idx>=1&&seg.idx<=segCount-2;
  const baseAmt=draggable&&e.routeAdjust&&e.routeAdjust.off&&e.routeAdjust.off[seg.idx]!==undefined
    ?e.routeAdjust.off[seg.idx]:0;
  let dragging=false;
  function mm(mev){
    if(!draggable)return;
    const moveDist=Math.hypot(mev.clientX-startX,mev.clientY-startY);
    if(!dragging){
      if(moveDist<EDGE_SEG_DRAG_THRESHOLD)return;
      dragging=true;
      pushUndo(); // ドラッグ開始時点（操作前）の状態を1回だけ保存
    }
    const dx=(mev.clientX-startX)/zoom,dy=(mev.clientY-startY)/zoom;
    const amt=baseAmt+(seg.orient==='v'?dx:dy);
    e.routeAdjust=e.routeAdjust||{n:segCount,off:{}};
    e.routeAdjust.n=segCount;
    e.routeAdjust.off[seg.idx]=amt;
    renderEdges();
  }
  function mu(){
    document.removeEventListener('mousemove',mm);
    document.removeEventListener('mouseup',mu);
    if(dragging){
      persist();markUnsaved();
    }else{
      selEdgeId=selEdgeId===e.id?null:e.id;
      renderEdges();
    }
  }
  document.addEventListener('mousemove',mm);
  document.addEventListener('mouseup',mu);
}
function renderEdges(){
  sv.innerHTML='';
  const defs=document.createElementNS('http://www.w3.org/2000/svg','defs');
  sv.appendChild(defs);
  const laneOffsets=computeEdgeLaneOffsets();
  edges.forEach(e=>{
    const nf=nodes[e.fn],nt=nodes[e.tn];if(!nf||!nt)return;
    const pf=P(nf.cl),pt=P(nt.cl);
    const cf=portXY(e.fn,e.fp),ct=portXY(e.tn,e.tp);
    const isSel=selEdgeId===e.id;
    const dir=e.dir||'forward'; // forward/backward/both/none

    // markerを毎回作成（sv.innerHTML=''後なので常に新規）
    const addMarker=(mid2,color,flip)=>{
      const mk=document.createElementNS('http://www.w3.org/2000/svg','marker');
      mk.id=mid2;mk.setAttribute('markerWidth','6');mk.setAttribute('markerHeight','6');
      mk.setAttribute('refX',flip?'1':'5');mk.setAttribute('refY','3');mk.setAttribute('orient','auto');
      const po=document.createElementNS('http://www.w3.org/2000/svg','polygon');
      po.setAttribute('points',flip?'8 0,0 3,8 6':'0 0,8 3,0 6');po.setAttribute('fill',color);
      mk.appendChild(po);defs.appendChild(mk);
    };
    // 通常マーカー
    const markId='arr-'+e.id; // エッジIDベースで一意に
    const markIdR='arr-r-'+e.id;
    // 選択時は▼も明るく（線と同じ明るい色）
    const strokeColor=isSel?lightenColor(pf.bd,70):pf.bd;
    addMarker(markId,strokeColor,false);
    if(dir==='backward'||dir==='both')addMarker(markIdR,strokeColor,true);

    // 接続点から見た枠側への向き（'l'なら左へ、'r'・メモ行なら右へ）
    const outF=e.fp==='l'?-1:1,outT=e.tp==='l'?-1:1;
    const lane=laneOffsets[e.id]||{f:0,t:0};
    // 同じ辺を通る線が複数あるときは、枠までの距離をlane分だけ増減させて分離する
    const frameF=expandRect(nodeRect(e.fn),EDGE_FRAME_MARGIN+lane.f);
    const frameT=expandRect(nodeRect(e.tn),EDGE_FRAME_MARGIN+lane.t);
    const points=applyRouteOffsets(e,buildEdgeRoute(cf,outF,frameF,ct,outT,frameT));
    // 表示用の点列だけ短い区間を省略する。ドラッグ判定(startEdgeSegDrag)には
    // 省略前のpointsをそのまま渡し、区間番号とrouteAdjustの対応を保つ
    const displayPoints=simplifyManualRoute(e,points);
    const d=roundedOrthogonalPath(displayPoints,EDGE_CORNER_RADIUS);
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');

    // hit area（表示用パスと同じ経路を使う）
    const hit=document.createElementNS('http://www.w3.org/2000/svg','path');
    hit.setAttribute('d',d);hit.setAttribute('fill','none');
    hit.setAttribute('stroke','transparent');hit.setAttribute('stroke-width','16');
    hit.style.pointerEvents='stroke';hit.style.cursor='pointer';
    hit.addEventListener('mousedown',ev=>startEdgeSegDrag(ev,e,points));
    hit.addEventListener('contextmenu',ev=>{
      ev.preventDefault();ev.stopPropagation();
      ctxEid=e.id;posMenu(document.getElementById('em'),ev.clientX,ev.clientY);
    });
    g.appendChild(hit);

    // line：選択時は明るく・太く
    const line=document.createElementNS('http://www.w3.org/2000/svg','path');
    line.setAttribute('d',d);line.setAttribute('fill','none');
    line.setAttribute('stroke',strokeColor);
    line.setAttribute('stroke-width','1.8');
    if(dir==='forward'||dir==='both')line.setAttribute('marker-end','url(#'+markId+')');
    if(dir==='backward'||dir==='both')line.setAttribute('marker-start','url(#'+markIdR+')');
    g.appendChild(line);

    // 始点・終点の○
    [[cf,pf],[ct,pt]].forEach(([pt2,pal2])=>{
      const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('cx',pt2.x);c.setAttribute('cy',pt2.y);c.setAttribute('r','4');
      c.setAttribute('fill',pal2.bd);g.appendChild(c);
    });
    sv.appendChild(g);
  });
}

// メモハンドルを持つノードに対して'r'（存在しない右ハンドル）が指定された場合、
// 最初のメモポートへ自動補正する（今後 fp/tp='r' の誤指定が紛れ込んでも安全にするための防御）
function safePort(nid,port){
  if(port!=='r')return port;
  const n=nodes[nid];if(!n)return port;
  const lines=parseMemo(n.memo);
  const firstHandle=lines.find(l=>l.t==='handle');
  if(firstHandle&&firstHandle.pid!=null)return 'm_'+firstHandle.pid;
  return port;
}
function addEdge(fn,fp,tn,tp){
  const rfp=safePort(fn,fp||'r'), rtp=safePort(tn,tp||'l');
  // 削除対象の既存エッジ判定：
  // ① 全く同じ接続（完全一致＝同じハンドルから同じ着地点への再接続）
  // ② 逆ハンドルから引いた同じ2点間の接続（A→Bの後にB→Aと逆向きに引いた場合）
  // ※ 異なるハンドル（・1と・2等）から同じ着地点への接続は意図的に共存させる
  edges=edges.filter(e=>{
    const sameForward=(e.fn===fn&&e.fp===rfp&&e.tn===tn&&e.tp===rtp);
    const sameReversed=(e.fn===tn&&e.fp===rtp&&e.tn===fn&&e.tp===rfp);
    return !(sameForward||sameReversed);
  });
  edges.push({id:gid(),fn,fp:rfp,tn,tp:rtp,dir:'forward'});
  pushUndo();renderEdges();persist();markUnsaved();
}

function cvXY(cx,cy){const r=cv.getBoundingClientRect();return{x:(cx-r.left)/zoom,y:(cy-r.top)/zoom};}

// 囲い枠タイトルは、ズームアウトしても画面上でこのpxを下回らないようにする

/* ═══════════════════════════════════════
   グリッド表示
═══════════════════════════════════════ */
// グリッドの基準間隔（論理px。ズーム100%のときの間隔）
const GRID_BASE_SPACING=100;
// 画面上の間隔がこの範囲に収まるよう、間隔を100pxの倍・半分に切り替える
const GRID_MIN_SCREEN_PX=40;
const GRID_MAX_SCREEN_PX=160;
const GRID_LINE_COLOR='rgba(255,255,255,0.07)'; // 格子線の色（背景として目立たせすぎない）
const GRID_ORIGIN_COLOR='rgba(255,255,255,0.22)'; // 原点の十字線の色（格子より明るくする）
// 格子線・原点の十字線は#cvの内部に描画され、#cvのscale(zoom)の影響をそのまま受ける。
// そのため「太さ」をズーム倍率で割った値をCSSに指定すると、画面上の太さはズーム倍率によらず一定になる。
// ただしズームインで指定値が小さくなりすぎると、ブラウザの描画が乱れて線が太く見えたり消えたりするため、
// 指定する太さの下限を設ける（ズーム倍率が100%以上のときは、画面上の太さは下限以上を保ったまま増える）。
const GRID_LINE_TARGET_PX=1; // 格子線の目標の太さ（画面上のピクセル数）
const GRID_LINE_MIN_PX=1; // 格子線に指定する太さの下限（ピクセル数）
const GRID_ORIGIN_TARGET_PX=2; // 原点の十字線の目標の太さ（画面上のピクセル数）。格子線より太くして目立たせる
const GRID_ORIGIN_MIN_PX=2; // 原点の十字線に指定する太さの下限（ピクセル数）
// 上記の目標の太さをズーム倍率で割り、下限を下回らないようにした値を返す
function gridStrokePx(targetPx,minPx){
  return Math.max(targetPx/zoom,minPx);
}
const GRID_VISIBLE_KEY='nm1_grid_visible'; // 表示状態はプロジェクトJSONに含めず、ブラウザ側にのみ保存する
// 格子を表示範囲より広めに描画するマージン（間隔の何個分か）。パン中に格子の境界が画面内に見えないようにする
const GRID_COVER_MARGIN_CELLS=1;
let gridVisible=false;
try{gridVisible=localStorage.getItem(GRID_VISIBLE_KEY)==='1';}catch{}
let gridDrawnSpacing=null; // 直近に描画した「間隔+線の太さ」。この組み合わせが変わらない限り背景パターンの文字列は再設定しない
const gridLayerEl=document.getElementById('grid-layer');
const gridOriginVEl=document.getElementById('grid-origin-v');
const gridOriginHEl=document.getElementById('grid-origin-h');
gridOriginVEl.style.background=GRID_ORIGIN_COLOR;
gridOriginHEl.style.background=GRID_ORIGIN_COLOR;
// 現在のズームで画面上の間隔がGRID_MIN_SCREEN_PX〜GRID_MAX_SCREEN_PXに収まる、論理px単位の間隔を求める
function currentGridSpacing(){
  let s=GRID_BASE_SPACING;
  while(s*zoom>GRID_MAX_SCREEN_PX)s/=2;
  while(s*zoom<GRID_MIN_SCREEN_PX)s*=2;
  return s;
}
// 格子の線は、キャンバス座標の原点(0,0)からの間隔sの倍数の位置にのみ引く。
// #grid-layerの位置・大きさは固定値ではなく、現在の表示範囲（パン・ズーム）を覆うように毎回計算し直す。
// これにより、どのズーム倍率・パン位置でも格子は画面全体を覆い、原点の十字と必ず一致する。
function updateGridPattern(){
  if(!gridVisible)return;
  const s=currentGridSpacing();
  // 現在の表示範囲を、キャンバス座標（原点基準）で求める
  const viewLeft=-pan.x/zoom,viewTop=-pan.y/zoom;
  const viewRight=viewLeft+wrap.clientWidth/zoom,viewBottom=viewTop+wrap.clientHeight/zoom;
  // 原点から見て間隔sの倍数になる位置まで、表示範囲より広めに切り上げ・切り下げる
  const margin=s*GRID_COVER_MARGIN_CELLS;
  const left=Math.floor(viewLeft/s)*s-margin,top=Math.floor(viewTop/s)*s-margin;
  const right=Math.ceil(viewRight/s)*s+margin,bottom=Math.ceil(viewBottom/s)*s+margin;
  const w=right-left,h=bottom-top;
  gridLayerEl.style.left=left+'px';
  gridLayerEl.style.top=top+'px';
  gridLayerEl.style.width=w+'px';
  gridLayerEl.style.height=h+'px';
  const lineW=gridStrokePx(GRID_LINE_TARGET_PX,GRID_LINE_MIN_PX); // 画面上の太さが一定になるよう、ズーム倍率で調整した太さ
  const drawKey=s+'_'+lineW;
  if(drawKey!==gridDrawnSpacing){
    gridDrawnSpacing=drawKey;
    gridLayerEl.style.backgroundImage=
      `repeating-linear-gradient(to right,${GRID_LINE_COLOR} 0,${GRID_LINE_COLOR} ${lineW}px,transparent ${lineW}px,transparent ${s}px),`+
      `repeating-linear-gradient(to bottom,${GRID_LINE_COLOR} 0,${GRID_LINE_COLOR} ${lineW}px,transparent ${lineW}px,transparent ${s}px)`;
  }
  // 原点(0,0)を通る十字線。太さも同じ理由（#cvのscaleの影響）でズーム倍率に応じて調整する。
  // #grid-layerの左上が原点からずれている分に加え、線の太さの半分だけ、逆方向にずらして中心を原点に合わせる
  const originW=gridStrokePx(GRID_ORIGIN_TARGET_PX,GRID_ORIGIN_MIN_PX);
  gridOriginVEl.style.width=originW+'px';
  gridOriginVEl.style.left=(-left-originW/2)+'px';
  gridOriginVEl.style.height=h+'px';
  gridOriginHEl.style.height=originW+'px';
  gridOriginHEl.style.top=(-top-originW/2)+'px';
  gridOriginHEl.style.width=w+'px';
}
function applyGridVisibility(){
  gridLayerEl.classList.toggle('show',gridVisible);
  document.getElementById('btn-grid').classList.toggle('on',gridVisible);
  gridDrawnSpacing=null; // 表示ON直後は必ず背景パターンを再設定させる
  updateGridPattern();
}
applyGridVisibility(); // 初期状態（保存されていれば復元）を反映
function applyT(){
  cv.style.transform=`translate(${pan.x}px,${pan.y}px) scale(${zoom})`;
  cv.style.transformOrigin='0 0';
  document.getElementById('zlbl').textContent=Math.round(zoom*100)+'%';
  minimap();
  frames.forEach(applyFrameTitleScale);
  updateGridPattern();
}
let panSt=null;
wrap.addEventListener('mousedown',e=>{
  if(e.button===1){e.preventDefault();panSt={sx:e.clientX,sy:e.clientY,px:pan.x,py:pan.y};wrap.classList.add('pan');return;}
  if(e.button===0){
    if(conFrom)return;
    if(drawingFrame&&(e.target===wrap||e.target===cv||e.target===sv)){startDrawFrame(e);return;}
    if(e.target===wrap||e.target===cv||e.target===sv){
      // 背景クリックで接続線選択解除
      if(selEdgeId){selEdgeId=null;renderEdges();}

});
// 空白部分のダブルクリックでノードを追加（右クリックメニュー「ノードを追加」のショートカット版）
wrap.addEventListener('dblclick',e=>{

document.addEventListener('mousemove',e=>{
  if(panSt){pan.x=panSt.px+(e.clientX-panSt.sx);pan.y=panSt.py+(e.clientY-panSt.sy);applyT();}
  if(tmpL){const p=cvXY(e.clientX,e.clientY);tmpL.setAttribute('x2',p.x);tmpL.setAttribute('y2',p.y);}

document.addEventListener('mouseup',e=>{
  if(e.button===1&&panSt){panSt=null;wrap.classList.remove('pan');}
  if(e.button===0&&conFrom){
    const h=e.target.closest('[data-port]');
    if(h&&h.dataset.nid!==conFrom){
      addEdge(conFrom,conFromPort,h.dataset.nid,h.dataset.port);
      cancelCon();return;
    }
    const nd=e.target.closest('.node');
    if(nd){
      const toId=nd.id.replace('nd-','');
      if(toId!==conFrom){
        const fromN=nodes[conFrom],toN=nodes[toId];
        const toPort=toN&&fromN&&toN.x<fromN.x?'r':'l';
        addEdge(conFrom,conFromPort,toId,toPort);
      }
      cancelCon();return;
    }
    // ツールバー・モーダル等のUI要素上でのドロップは何もせずキャンセルのみ（誤ってノードを作らないため）
    if(e.target.closest('#tb,#mo,#gh-mo,#imgdel-mo,.cm,#color-popup,#del-log-panel')){cancelCon();return;}
    // 上記以外（キャンバスの空白部分）へのドロップは、ドロップ位置に新規ノードを生成して自動接続する。
    // documentに直接バインドすることで、以前#cv要素へのバインドだった時に発生していた
    // 「transform/z-index等の影響でe.targetが#cvの外と判定され、ノードが生成されずキャンセルだけされる」
    // 不具合を構造的に解消している
    const pos=cvXY(e.clientX,e.clientY);
    const fromN=nodes[conFrom];
    const newX=pos.x-90,newY=pos.y-30;
    const toPort=fromN&&pos.x<fromN.x?'r':'l';
    const savedFrom=conFrom,savedPort=conFromPort;
    cancelCon();
    pushUndo();
    _skipNextPushUndo=true; // addNode内のpushUndoを抑制
    const newId=addNode(newX,newY);
    setTimeout(()=>{
      _skipNextPushUndo=true; // addEdge内のpushUndoを抑制
      addEdge(savedFrom,savedPort,newId,toPort);
    },50);
  }
});
wrap.addEventListener('wheel',e=>{
  e.preventDefault();
  if(e.ctrlKey){
    // ピンチ操作（Macトラックパッド）またはCtrl+ホイール → ズーム
    const delta=e.deltaMode===1?e.deltaY*0.05:e.deltaY*0.01;
    const nz=Math.min(3,Math.max(0.12,zoom*(1-delta)));
    const r=wrap.getBoundingClientRect();
    const mx=e.clientX-r.left,my=e.clientY-r.top;
    pan.x=mx-(mx-pan.x)*(nz/zoom);pan.y=my-(my-pan.y)*(nz/zoom);
    zoom=nz;applyT();
  } else if(e.deltaX!==0||Math.abs(e.deltaY)<50){
    // Macの2本指スワイプ（deltaYが小さい・deltaXあり）→ パン
    pan.x-=e.deltaX;pan.y-=e.deltaY;
    applyT();
  } else {
    // Windowsの通常ホイール（deltaYが大きい）→ ズーム
    const delta=e.deltaMode===1?e.deltaY*0.05:e.deltaY*0.001;
    const nz=Math.min(3,Math.max(0.12,zoom*(1-delta)));
    const r=wrap.getBoundingClientRect();
    const mx=e.clientX-r.left,my=e.clientY-r.top;
    pan.x=mx-(mx-pan.x)*(nz/zoom);pan.y=my-(my-pan.y)*(nz/zoom);
    zoom=nz;applyT();
  }
},{passive:false});

document.getElementById('btn-zo').onclick=()=>{zoom=Math.max(0.12,zoom/1.2);applyT()};

document.getElementById('zlbl').style.cursor='pointer';

  const cx=wrap.clientWidth/2,cy=wrap.clientHeight/2;

function fitAll(){
  const ns=Object.values(nodes);
  if(!ns.length&&!labels.length&&!frames.length&&!images.length)return;
  const xs=[],ys=[];
  ns.forEach(n=>{xs.push(n.x,n.x+260);ys.push(n.y,n.y+120);});
  labels.forEach(l=>{
    const el=document.getElementById('lb-'+l.id);
    const w=el?el.offsetWidth:120,h=el?el.offsetHeight:24;
    xs.push(l.x,l.x+w);ys.push(l.y,l.y+h);
  });
  frames.forEach(f=>{xs.push(f.x,f.x+f.w);ys.push(f.y,f.y+f.h);});
  images.forEach(im=>{xs.push(im.x,im.x+im.w);ys.push(im.y,im.y+im.h);});
  if(!xs.length)return;
  const x0=Math.min(...xs)-40,y0=Math.min(...ys)-40;
  const x1=Math.max(...xs)+40,y1=Math.max(...ys)+40;
  const ww=wrap.clientWidth,wh=wrap.clientHeight;
  zoom=Math.min(ww/(x1-x0),wh/(y1-y0),1.4)*0.88;
  pan.x=-x0*zoom+(ww-(x1-x0)*zoom)/2;pan.y=-y0*zoom+(wh-(y1-y0)*zoom)/2;
  applyT();
}

/* ═══════════════════════════════════════
   DELETE SELECTED
═══════════════════════════════════════ */
async function deleteSelected(){
  const ids=[...selIds];
  // 選択中にGitHub画像が含まれる場合は削除前に確認（Delete/Backspace・右クリック共通）
  const ghImageTargets=ids
    .map(id=>images.find(i=>i.id===id))
    .filter(img=>img&&isGhConfigured()&&img.src&&img.src.startsWith('images/'));
  let deleteRemote=false;
  if(ghImageTargets.length){
    const choice=await confirmImageDelete(ghImageTargets.length);
    if(choice==='cancel')return;
    deleteRemote=(choice==='both');
  }
  pushUndo();
  ids.forEach(id=>{
    if(nodes[id]){delete nodes[id];edges=edges.filter(e=>e.fn!==id&&e.tn!==id);document.getElementById('nd-'+id)?.remove();}
    const li=labels.findIndex(l=>l.id===id);
    if(li>=0){labels.splice(li,1);document.getElementById('lb-'+id)?.remove();}
    const fi=frames.findIndex(f=>f.id===id);
    if(fi>=0){frames.splice(fi,1);document.getElementById('fr-'+id)?.remove();}
    const ii=images.findIndex(i=>i.id===id);
    if(ii>=0){images.splice(ii,1);document.getElementById('im-'+id)?.remove();}
  });
  selIds.clear();renderEdges();persist();markUnsaved();
  if(deleteRemote&&ghImageTargets.length){
    let failCount=0;
    for(const img of ghImageTargets){
      try{
        const sha=await ghGetFileSha(img.src);
        if(sha)await ghDeleteFile(img.src,sha,`Delete image: ${img.src}`);
      }catch(err){failCount++;}
    }
    if(failCount)toast(`❌ GitHub上の画像削除に${failCount}件失敗しました`);
    else toast('🗑 GitHub上の画像を削除しました');
  }
}

function addNode(x,y,title,cl){

  renderNode(nodes[id]);renderEdges();markUnsaved();

}

  labels.push(lb);renderLabel(lb);persist();

function addFrame(x,y,w,h){
  pushUndo();
  const id=gid();
  const fr={id,x,y,w:w||300,h:h||200,title:'グループ'};
  frames.push(fr);renderFrame(fr);persist();

function addFrameFromSelection(){
  const PAD=40;
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  selIds.forEach(id=>{
    // ノード
    const n=nodes[id];
    if(n){
      const el=document.getElementById('nd-'+n.id);
      const w=el?el.offsetWidth:200,h=el?el.offsetHeight:80;
      minX=Math.min(minX,n.x);minY=Math.min(minY,n.y);
      maxX=Math.max(maxX,n.x+w);maxY=Math.max(maxY,n.y+h);
      return;
    }
    // テキストラベル
    const lb=labels.find(l=>l.id===id);
    if(lb){
      const el=document.getElementById('lb-'+lb.id);
      const w=el?el.offsetWidth:80,h=el?el.offsetHeight:24;
      minX=Math.min(minX,lb.x);minY=Math.min(minY,lb.y);
      maxX=Math.max(maxX,lb.x+w);maxY=Math.max(maxY,lb.y+h);
      return;
    }
    // 画像
    const im=images.find(i=>i.id===id);
    if(im){
      minX=Math.min(minX,im.x);minY=Math.min(minY,im.y);
      maxX=Math.max(maxX,im.x+im.w);maxY=Math.max(maxY,im.y+im.h);
      return;
    }
  });
  if(minX===Infinity){toast('ノード・画像・テキストを選択してください');return;}
  addFrame(minX-PAD,minY-PAD,maxX-minX+PAD*2,maxY-minY+PAD*2);
}

window.saveModal=()=>{
  if(!editId)return;
  if(editId===pendingNewNodeId)pendingNewNodeId=null; // 保存確定したので以後は破棄対象にしない
  const n=nodes[editId];
  const jsonWrap=document.getElementById('md-json-wrap');
  const jsonOpen=jsonWrap.style.display!=='none';

  if(jsonOpen){
    // JSONパネルが開いている場合はJSONの内容を優先して反映
    const raw=document.getElementById('f-json').value;
    let parsed;
    try{
      parsed=JSON.parse(raw);
    }catch(err){
      document.getElementById('json-err').textContent='JSON構文エラー: '+err.message;
      document.getElementById('json-err').style.display='block';
      return; // 不正なJSONは反映しない
    }
    // idの書き換えは禁止（接続線が迷子になるため）
    if(parsed.id!==undefined&&parsed.id!==editId){
      document.getElementById('json-err').textContent='id は変更できません（自動的に元のIDを維持します）';
      document.getElementById('json-err').style.display='block';
    }
    // x,yの型チェック
    const newX=typeof parsed.x==='number'?parsed.x:n.x;
    const newY=typeof parsed.y==='number'?parsed.y:n.y;
    const newMemo=typeof parsed.memo==='string'?parsed.memo:n.memo;
    // メモ行ID整合性チェック
    const{issues,orphanedIds}=checkMemoIdIssues(n.memo,newMemo);
    if(issues.length){
      // 案C: 削除される接続線を保存前にダイアログで表示
      const orphanInfo=collectOrphanedEdgeInfo(editId,orphanedIds,n.memo);
      let msg='メモの接続ID（・[N]）に問題があります：\n\n'+issues.join('\n');
      if(orphanInfo.length){
        msg+='\n\n以下の接続線が削除されます：\n'+orphanInfo.map(e=>`・${e.srcLabel} → ${e.dstLabel}`).join('\n');
      }
      msg+='\n\nこのまま保存しますか？（キャンセルすると編集を続けられます）';
      if(!confirm(msg))return;
    }
    // 削除前にログ情報を収集（削除後はノード情報が変わるため）
    const logEntries=orphanedIds.size?collectOrphanedEdgeInfo(editId,orphanedIds,n.memo):[];
    pushUndo();
    n.id=editId; // idは常に元の値を維持
    n.x=newX;n.y=newY;
    n.title=(typeof parsed.title==='string'?parsed.title:n.title)||'ノード';
    n.st=['todo','wip','done','unset'].includes(parsed.st)?parsed.st:n.st;
    {
      const finalMemo=finalizeMemoIds(newMemo);
      n.memo=finalMemo;
    }
    // ID消失により孤立した接続線を削除
    if(orphanedIds.size){
      edges=edges.filter(e=>{
        const fOrphan=(e.fn===editId&&e.fp&&e.fp.startsWith('m_')&&orphanedIds.has(parseInt(e.fp.slice(2),10)));
        const tOrphan=(e.tn===editId&&e.tp&&e.tp.startsWith('m_')&&orphanedIds.has(parseInt(e.tp.slice(2),10)));
        return !(fOrphan||tOrphan);
      });
      // 案E①: 削除ログをパネルに表示
      if(logEntries.length)showDeleteLog(logEntries);
    }
    n.cl=typeof parsed.cl==='string'?parsed.cl:n.cl;
    n.fs=['s','m','l'].includes(parsed.fs)?parsed.fs:n.fs;
    renderNode(n);renderEdges();persist();markUnsaved();closeModal();
    return;
  }

  // 通常フォームからの保存
  const newMemoForm=document.getElementById('f-me').value;
  const{issues:issuesForm,orphanedIds:orphanedIdsForm}=checkMemoIdIssues(n.memo,newMemoForm);
  if(issuesForm.length){
    // 案C: 削除される接続線を保存前にダイアログで表示
    const orphanInfoForm=collectOrphanedEdgeInfo(editId,orphanedIdsForm,n.memo);
    let msgForm='メモの接続ID（・[N]）に問題があります：\n\n'+issuesForm.join('\n');
    if(orphanInfoForm.length){
      msgForm+='\n\n以下の接続線が削除されます：\n'+orphanInfoForm.map(e=>`・${e.srcLabel} → ${e.dstLabel}`).join('\n');
    }
    msgForm+='\n\nこのまま保存しますか？（キャンセルすると編集を続けられます）';
    if(!confirm(msgForm))return;
  }
  // 削除前にログ情報を収集
  const logEntriesForm=orphanedIdsForm.size?collectOrphanedEdgeInfo(editId,orphanedIdsForm,n.memo):[];
  pushUndo(); // データ変更前の状態を保存
  n.title=document.getElementById('f-ti').value.trim()||'ノード';
  n.st=document.getElementById('f-st').value;
  {
    const finalMemo=finalizeMemoIds(newMemoForm);
    n.memo=finalMemo;
  }
  // ID消失により孤立した接続線を削除
  if(orphanedIdsForm.size){
    edges=edges.filter(e=>{
      const fOrphan=(e.fn===editId&&e.fp&&e.fp.startsWith('m_')&&orphanedIdsForm.has(parseInt(e.fp.slice(2),10)));
      const tOrphan=(e.tn===editId&&e.tp&&e.tp.startsWith('m_')&&orphanedIdsForm.has(parseInt(e.tp.slice(2),10)));
      return !(fOrphan||tOrphan);
    });
    // 案E①: 削除ログをパネルに表示
    if(logEntriesForm.length)showDeleteLog(logEntriesForm);
  }
  n.cl=mColor;
  n.fs=document.getElementById('f-fs').value;
  renderNode(n);renderEdges();persist();markUnsaved();closeModal();
}

/* ═══════════════════════════════════════
   IMAGE VIEWER
═══════════════════════════════════════ */
(()=>{
  const viewer=document.getElementById('img-viewer');
  const ivImg=document.getElementById('iv-img');
  let ivZoom=1,ivPan={x:0,y:0},ivDragging=false,ivDragStart={x:0,y:0},ivPanStart={x:0,y:0};

  window.openViewer=function(src){
    ivImg.src=src;ivZoom=1;ivPan={x:0,y:0};
    ivImg.style.transform='';
    viewer.classList.add('show');
  };
  window.closeViewer=function(){viewer.classList.remove('show');};

  function updateTransform(){
    ivImg.style.transform=`translate(${ivPan.x}px,${ivPan.y}px) scale(${ivZoom})`;
  }
  viewer.addEventListener('wheel',e=>{
    e.preventDefault();
    const delta=e.deltaY>0?0.92:1.09;
    ivZoom=Math.min(10,Math.max(0.1,ivZoom*delta));
    updateTransform();
  },{passive:false});
  ivImg.addEventListener('mousedown',e=>{
    if(e.button!==0)return;e.preventDefault();
    ivDragging=true;ivDragStart={x:e.clientX,y:e.clientY};ivPanStart={...ivPan};
    ivImg.classList.add('grabbing');
  });
  document.addEventListener('mousemove',e=>{
    if(!ivDragging)return;
    ivPan.x=ivPanStart.x+(e.clientX-ivDragStart.x);
    ivPan.y=ivPanStart.y+(e.clientY-ivDragStart.y);
    updateTransform();
  });
  document.addEventListener('mouseup',()=>{ivDragging=false;ivImg.classList.remove('grabbing');});
  ivImg.addEventListener('dblclick',()=>{ivZoom=1;ivPan={x:0,y:0};updateTransform();});
  viewer.addEventListener('click',e=>{if(e.target===viewer)closeViewer();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&viewer.classList.contains('show'))closeViewer();});
})();

function addImage(src,x,y,w,h,displayName){
  const id=gid();
  const isBlobSrc=src&&src.startsWith('blob:');
  const img={
    id,x:x||200,y:y||200,
    // blobURLは一時表示用。persistには含めないので_blobSrcに保持
    src:isBlobSrc?'':src||'',
    _blobSrc:isBlobSrc?src:null,  // セッション内のみ使用（永続化しない）
    w:w||320,h:h||200,
    imgW:w||320,imgH:h||200,
    imgOffX:0,imgOffY:0,
    displayName:displayName||''
  };
  // 実際の画像サイズから縦横比を計算して初期高さを決定
  // blobURLがあればそれを使い、なければsrcを使う
  const calcSrc=isBlobSrc?src:(src||'');
  if(calcSrc){
    const tmp=new Image();
    tmp.onload=()=>{
      const ratio=tmp.naturalHeight/tmp.naturalWidth;
      // 実寸基準：明示的な幅指定が無い場合は画像の実際の幅をそのまま使う（従来は320px固定だった）
      const initW=w||tmp.naturalWidth;
      img.w=initW;
      img.h=Math.round(initW*ratio);
      img.imgW=initW;
      img.imgH=img.h;
      const el=document.getElementById('im-'+id);
      if(el)applyImgTransform(el,img); // 外枠・クロップ枠・内側imgのサイズをまとめて反映
      persist();
    };
    tmp.src=calcSrc;
  }
  images.push(img);pushUndo();renderImage(img);persist();markUnsaved();
  return id;
}

// ファイルをbase64文字列に変換（data:プレフィックスは除去）
function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>{
      const result=r.result;
      const idx=result.indexOf(',');
      resolve(idx>=0?result.slice(idx+1):result);
    };
    r.onerror=()=>reject(new Error('ファイル読み込み失敗'));
    r.readAsDataURL(file);
  });
}
// 同一プロジェクト内でのファイル名衝突を避けるため、常にユニークなファイル名にリネームする
// （事前の存在チェックAPIコールを行わないため実装がシンプルでエラーが起きにくい）
function uniqueImageName(originalName){
  const safe=(originalName||'image').replace(/[^\w.\-]/g,'_');
  const dot=safe.lastIndexOf('.');
  const base=dot>0?safe.slice(0,dot):safe;
  const ext=dot>0?safe.slice(dot):'';
  const suffix=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  return `${base}_${suffix}${ext}`;
}
const IMG_WARN_MB=8; // GitHub API 1ファイルの実用上限を考慮したアップロード前警告閾値
// 画像ファイルを受け取り、キャンバスに即時追加（blobURLで表示）した上で
// GitHub接続時はバックグラウンドでimages/{pid}/へアップロードし、成功後にsrcをパスへ差し替える
async function handleImageFile(file,x,y){
  if(!file)return;
  const mb=file.size/1024/1024;
  if(mb>=IMG_WARN_MB){
    if(!confirm(`⚠️ このファイルは${mb.toFixed(1)}MBあります。大きな画像はアップロードに失敗する可能性があります。続行しますか？`))return;
  }
  const url=URL.createObjectURL(file);
  const id=addImage(url,x,y,undefined,undefined,file.name);
  if(!isGhConfigured()){
    toast('画像を追加しました。パスラベルをクリックして絶対パスを設定してください。');
    return;
  }
  if(!curPid){toast('⚠️ プロジェクトIDが未設定のためアップロードできません');return;}
  toast('🔄 GitHubにアップロード中...');
  try{
    const base64=await fileToBase64(file);
    const uniqueName=uniqueImageName(file.name);
    const path=`images/${curPid}/${uniqueName}`;
    await ghPutBinary(path,base64,`Add image: ${uniqueName}`);
    const img=images.find(i=>i.id===id);
    if(img){img.src=path;persist();}
    toast('✅ GitHubにアップロードしました: '+uniqueName);
  }catch(err){
    toast('❌ アップロード失敗: '+err.message+'（画像はこのセッション内でのみ表示されています）');
  }
}
// 起動時・プロジェクト読込時に、GitHubパスを持つ画像を認証付きAPIで取得してblobURL化する
// （Privateリポジトリのため、raw.githubusercontent.comへの無認証アクセスは使用できない）
// 並列取得（Promise.all）で高速化し、loadGenerationで世代チェックすることで
// 取得中に別プロジェクトへ切り替わった場合に古い画像が紛れ込むのを防ぐ
async function hydrateGhImages(){
  if(!isGhConfigured())return;
  const gen=loadGeneration;
  const targets=images.filter(img=>img.src&&img.src.startsWith('images/')&&!img._blobSrc);
  if(!targets.length)return;
  await Promise.all(targets.map(async img=>{
    try{
      const blob=await ghGetFileBlob(img.src);
      if(gen!==loadGeneration)return; // 取得中に別プロジェクトへ切替済みなら破棄
      img._blobSrc=URL.createObjectURL(blob);
      renderImage(img);
    }catch(err){
      // 取得失敗時はrenderImage側のonerrorでプレースホルダー表示に任せる
    }
  }));
}

/* ═══════════════════════════════════════
   UNDO / REDO
═══════════════════════════════════════ */
function snapImages(){
  // srcは除外（位置・サイズ・トリミング情報のみ保存）
  return images.map(({id,x,y,w,h,imgW,imgH,imgOffX,imgOffY,displayName,src})=>({
    id,x,y,w,h,imgW,imgH,imgOffX,imgOffY,displayName,
    src:src&&src.startsWith('data:')?src:src||''
  }));
}
function takeSnapshot(){
  return {
    nodes:JSON.parse(JSON.stringify(nodes)),
    edges:JSON.parse(JSON.stringify(edges)),
    labels:JSON.parse(JSON.stringify(labels)),
    frames:JSON.parse(JSON.stringify(frames)),
    images:snapImages(),
  };
}
function pushUndo(){
  if(_skipNextPushUndo){_skipNextPushUndo=false;return;}
  undoStack.push(takeSnapshot());
  if(undoStack.length>UNDO_MAX)undoStack.shift();
  redoStack=[];
  updateUndoButtons();
}
function applySnapshot(snap){
  nodes=JSON.parse(JSON.stringify(snap.nodes));
  edges=JSON.parse(JSON.stringify(snap.edges));
  labels=JSON.parse(JSON.stringify(snap.labels));
  frames=JSON.parse(JSON.stringify(snap.frames));
  // 画像：srcはblobを復元できないので既存の_blobSrcを引き継ぐ
  images=snap.images.map(s=>{
    const existing=images.find(i=>i.id===s.id);
    return {...s,_blobSrc:existing?existing._blobSrc:undefined};
  });
  renderAll();persist();markUnsaved();
}
function undo(){
  if(!undoStack.length)return;
  redoStack.push(takeSnapshot());
  applySnapshot(undoStack.pop());
  updateUndoButtons();
}
function redo(){
  if(!redoStack.length)return;
  undoStack.push(takeSnapshot());
  applySnapshot(redoStack.pop());
  updateUndoButtons();
}
function updateUndoButtons(){
  const bu=document.getElementById('btn-undo');
  const br=document.getElementById('btn-redo');
  if(bu)bu.disabled=undoStack.length===0;
  if(br)br.disabled=redoStack.length===0;
}

function persist(){
  const data={
    version:5.5,
    pid:curPid,
    nodes,edges,labels,frames,
    // _blobSrcは保存しない（blobURLはセッション内のみ有効）
    images:images.map(img=>{
      const {_blobSrc,...rest}=img;
      return rest;
    }),
    pan,zoom,
    draftText,draftX,draftY,draftW,draftH,draftFontSize,
    proj:document.getElementById('proj-name').value
  };
  try{
    localStorage.setItem(SK,JSON.stringify(data));
    checkDataSize();
  }catch(e){
    if(e.name==='QuotaExceededError'||e.name==='NS_ERROR_DOM_QUOTA_REACHED'){
      toast('⚠️ ストレージ容量が上限に達しました。Saveでファイルに書き出してください。');
    }
  }
}

// GitHubに保存：外部URL/パス参照の画像を、実ファイルとしてGitHubへアップロードする
// （handleImageFileの新規追加時と同じ扱いに揃える）。JSONの肥大化を避けるため、
// GitHub未接続時はBase64埋め込み等は行わず、接続を促すメッセージのみ表示する。
document.getElementById('im-embed').onclick=async()=>{
  const id=ctxImgId;closeMenus();if(!id)return;
  const img=images.find(i=>i.id===id);if(!img)return;
  const dispSrc=img._blobSrc||img.src||'';
  if(!dispSrc){toast('表示中の画像がありません');return;}

  if(isGhConfigured()){
    if(img.src&&img.src.startsWith('images/')){toast('すでにGitHubに保存済みです');return;}
    if(!curPid){toast('⚠️ プロジェクトIDが未設定のためアップロードできません');return;}
    toast('🔄 GitHubにアップロード中...');
    try{
      const resp=await fetch(dispSrc);
      const blob=await resp.blob();
      const base64=await fileToBase64(blob); // fileToBase64はBlob全般を受け付ける（FileはBlobのサブクラス）
      const originalName=img.displayName||getFileName(dispSrc)||'image.png';
      const uniqueName=uniqueImageName(originalName);
      const path=`images/${curPid}/${uniqueName}`;
      await ghPutBinary(path,base64,`Add image: ${uniqueName}`);
      pushUndo();
      if(dispSrc.startsWith('blob:'))URL.revokeObjectURL(dispSrc);
      img._blobSrc=null;
      img.src=path;
      img.displayName=originalName;
      persist();markUnsaved();
      toast('✅ GitHubに保存しました: '+uniqueName);
    }catch(err){
      toast('❌ GitHub保存失敗: '+err.message+'（クロスオリジン制限の可能性もあります）');
    }
    return;
  }

  // GitHub未接続時：JSONを不要に肥大化させたくないため、Base64埋め込みは行わずGitHub接続を促すのみ
  toast('⚠️ GitHubに接続してください');
};

async function saveAction(){
  persist();
  const proj=document.getElementById('proj-name').value||'project';
  const data=buildData();
  const json=JSON.stringify(data,null,2);
  const mb=(new Blob([json]).size/1024/1024).toFixed(2);
  if(isGhConfigured()){
    toast('🔄 保存中...');
    try{
      const path=`data/${curPid}.json`;
      const msg=`Save: ${new Date().toISOString()}`;
      let result;
      try{
        result=await ghPutFile(path,json,msg,dataShaCache[curPid]);
      }catch(err){
        if(err.status===409||err.status===422){
          // SHAが古かった場合のみ最新を再取得してリトライ（通常は発生しない想定）
          const freshSha=await ghGetFileSha(path);
          result=await ghPutFile(path,json,msg,freshSha);
        }else throw err;
      }
      dataShaCache[curPid]=result.content&&result.content.sha;
      delete ghFileDateCache[path]; // 保存によりコミット日時が変わったのでキャッシュ破棄（次回一覧表示時に再取得）
      ghProjectDataCache[path]=JSON.parse(JSON.stringify(data)); // 切り替え高速化用キャッシュも保存内容へ更新
      ghDirListCache=null; // 新規プロジェクトの初回保存等で一覧が変わる可能性があるため、次回▼を開いたときは必ず取り直す
      markSaved();
      setGhProjectCacheEntry(curPid,proj);
      setLastPid(curPid);
      toast(`✅ GitHubに保存しました (${mb}MB)`);
    }catch(err){
      toast('❌ GitHub保存失敗: '+err.message);
    }
  }else{
    const fname='canvas_'+proj.replace(/\s+/g,'_')+'.json';
    downloadJson(fname,data);
    markSaved();
    addHistory(proj,fname);
    toast(`⚠️ GitHub未接続の為ダウンロードフォルダに保存します: ${fname} (${mb}MB)`);
  }
}

function getSelBounds(){
  // 選択中のノード・ラベル・囲い枠の座標とサイズを取得
  const items=[];
  selIds.forEach(id=>{
    const n=nodes[id];
    if(n){
      const el=document.getElementById('nd-'+id);
      const w=el?el.offsetWidth:180,h=el?el.offsetHeight:80;
      items.push({id,type:'node',x:n.x,y:n.y,w,h,obj:n});return;
    }
    const lb=labels.find(l=>l.id===id);
    if(lb){
      const el=document.getElementById('lb-'+id);
      const w=el?el.offsetWidth:80,h=el?el.offsetHeight:24;
      items.push({id,type:'label',x:lb.x,y:lb.y,w,h,obj:lb});return;
    }
    const fr=frames.find(f=>f.id===id);
    if(fr){
      items.push({id,type:'frame',x:fr.x,y:fr.y,w:fr.w,h:fr.h,obj:fr});return;
    }
  });
  return items;
}
const ELPREFIX={node:'nd-',label:'lb-',frame:'fr-'};
const ALIGN_FRAME_PAD=20; // 囲い枠を含む整列時、ノード・ラベル側に設ける内側余白
function applyAlign(fn,edgeDir){
  const items=getSelBounds();
  if(items.length<2){toast('2つ以上選択してください');return;}
  const hasFrame=items.some(it=>it.type==='frame');
  pushUndo();
  items.forEach(item=>{
    if(hasFrame&&item.type==='frame')return; // 囲い枠自体は動かさない（他の要素側だけ余白分オフセット）
    const r=fn(item,items);
    let x=r.x!==undefined?r.x:item.obj.x;
    let y=r.y!==undefined?r.y:item.obj.y;
    if(hasFrame&&edgeDir){
      if(edgeDir==='left')x+=ALIGN_FRAME_PAD;
      else if(edgeDir==='right')x-=ALIGN_FRAME_PAD;
      else if(edgeDir==='top')y+=ALIGN_FRAME_PAD;
      else if(edgeDir==='bottom')y-=ALIGN_FRAME_PAD;
    }
    item.obj.x=x;item.obj.y=y;
    const el=document.getElementById(ELPREFIX[item.type]+item.id);
    if(el){el.style.left=item.obj.x+'px';el.style.top=item.obj.y+'px';}
  });
  renderEdges();persist();markUnsaved();
}

/* ═══════════════════════════════════════
   KEYBOARD
═══════════════════════════════════════ */
document.addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;
  // Ctrl/Cmd/Alt のいずれかが押されている間は、修飾キーなし単独キーのショートカット（f/z/Space/1〜9）を実行しない
  // （Ctrl+S保存・Ctrl+Z Undo・Ctrl+Y Redo・Ctrl+A全選択・Ctrl+C/Vコピー貼り付けは各判定側でctrlKey/metaKeyを見ているため対象外）
  const noMod=!(e.ctrlKey||e.metaKey||e.altKey);
  if(e.key==='Escape'){
    closeModal();cancelCon();clearSel();
    selEdgeId=null;renderEdges();
    drawingFrame=false;wrap.classList.remove('draw-frame');
    document.getElementById('btn-frame').classList.remove('on');
    closeColorPopup();
  }
  if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();saveAction();}
  // Undo: Ctrl+Z
  if((e.metaKey||e.ctrlKey)&&!e.shiftKey&&e.key==='z'){e.preventDefault();undo();return;}
  // Redo: Ctrl+Y のみ（Ctrl+Shift+Z はブラウザ側と競合するため除外）
  if((e.metaKey||e.ctrlKey)&&e.key==='y'){e.preventDefault();redo();return;}
  if(noMod&&(e.key==='f'||e.key==='F'))fitAll();

  // Delete: ノードまたは選択エッジを削除
  if(e.key==='Delete'||e.key==='Backspace'){
    if(selIds.size){deleteSelected();}
    else if(selEdgeId){
      pushUndo();edges=edges.filter(ed=>ed.id!==selEdgeId);
      selEdgeId=null;renderEdges();persist();markUnsaved();
    }
  }

  // Ctrl+A: 全選択（ノード・テキスト・囲い枠・画像すべて対象）
  if(e.key==='a'&&(e.ctrlKey||e.metaKey)){
    e.preventDefault();
    Object.keys(nodes).forEach(id=>selIds.add(id));
    labels.forEach(l=>selIds.add(l.id));
    frames.forEach(f=>selIds.add(f.id));
    images.forEach(im=>selIds.add(im.id));
    applySel();
  }

  // Ctrl+C: 選択中の要素をコピー（同一プロジェクト内のみ。JSメモリ上に保持）
  if(e.key==='c'&&(e.ctrlKey||e.metaKey)){
    if(selIds.size===0)return;
    e.preventDefault();
    copyClipboard=[...selIds].map(id=>{
      if(nodes[id])return{type:'node',data:JSON.parse(JSON.stringify(nodes[id]))};
      const lb=labels.find(l=>l.id===id);if(lb)return{type:'label',data:JSON.parse(JSON.stringify(lb))};
      const fr=frames.find(f=>f.id===id);if(fr)return{type:'frame',data:JSON.parse(JSON.stringify(fr))};
      const im=images.find(i=>i.id===id);if(im)return{type:'image',data:JSON.parse(JSON.stringify(im))};
      return null;
    }).filter(Boolean);
    // 選択範囲内のノード同士を結ぶ接続線もコピー対象に含める
    copyClipboardEdges=edges.filter(ed=>selIds.has(ed.fn)&&selIds.has(ed.tn)).map(ed=>JSON.parse(JSON.stringify(ed)));
    clipboardPasteCount=0; // 連続貼り付けのオフセット段数をリセット
    toast(`${copyClipboard.length}件コピーしました`);
  }

  // Ctrl+V: 貼り付け（要素同士の相対位置を保ったまま、全体の中心を表示範囲の中央に配置する。
  // 連続で押すごとにさらに+30px方向へオフセットし、同じ場所に重ならないようにする）
  if(e.key==='v'&&(e.ctrlKey||e.metaKey)){
    if(!copyClipboard||copyClipboard.length===0)return;
    e.preventDefault();
    pushUndo();
    clipboardPasteCount++;
    const off=30*clipboardPasteCount;
    // コピー内容（複数要素）のx,yの範囲から中心を求め、表示範囲の中央に合わせる移動量を計算する
    let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
    copyClipboard.forEach(item=>{
      minX=Math.min(minX,item.data.x);maxX=Math.max(maxX,item.data.x);
      minY=Math.min(minY,item.data.y);maxY=Math.max(maxY,item.data.y);
    });
    const center=viewCenterXY();
    const dx=center.x-(minX+maxX)/2+off, dy=center.y-(minY+maxY)/2+off;
    const idMap={};
    const newIds=[];
    copyClipboard.forEach(item=>{
      const newId=gid();
      if(item.type==='node'){
        nodes[newId]={...item.data,id:newId,x:item.data.x+dx,y:item.data.y+dy};
        renderNode(nodes[newId]);idMap[item.data.id]=newId;newIds.push(newId);
      }else if(item.type==='label'){
        const copy={...item.data,id:newId,x:item.data.x+dx,y:item.data.y+dy};
        labels.push(copy);renderLabel(copy);newIds.push(newId);
      }else if(item.type==='frame'){
        const copy={...item.data,id:newId,x:item.data.x+dx,y:item.data.y+dy};
        frames.push(copy);renderFrame(copy);newIds.push(newId);
      }else if(item.type==='image'){
        const copy={...item.data,id:newId,x:item.data.x+dx,y:item.data.y+dy};
        images.push(copy);renderImage(copy);newIds.push(newId);
      }
    });
    (copyClipboardEdges||[]).forEach(ed=>{
      if(idMap[ed.fn]&&idMap[ed.tn]){
        edges.push({...JSON.parse(JSON.stringify(ed)),id:gid(),fn:idMap[ed.fn],tn:idMap[ed.tn]});
      }
    });
    clearSel();newIds.forEach(id=>selIds.add(id));applySel();
    renderEdges();persist();markUnsaved();
    toast(`${newIds.length}件貼り付けました`);
  }

  // z / Space: 未選択→全体表示、選択中→選択ノードにフォーカス
  // （Spaceはボタンにフォーカスがある状態だと誤クリックになるためpreventDefaultで抑止）
  if(noMod&&(e.key==='z'||e.key==='Z'||e.key===' ')){
    e.preventDefault();
    if(selIds.size>0)focusSelected();
    else fitAll();
  }

  // 1〜9: タイトルが「数字＋半角/全角スペース」で始まる囲い枠・ノードを選択してフォーカス（zキーと同じ動作）
  // 例：「3 開発」「3　開発」は反応する。「3dツール」は2文字目がスペースではないため反応しない。
  if(noMod&&/^[1-9]$/.test(e.key)){
    const matchesDigitSpace=title=>{
      if(!title||title[0]!==e.key)return false;
      const c2=title[1];
      return c2===' '||c2==='　';
    };
    let target=frames.find(f=>matchesDigitSpace(f.title));
    if(!target)target=Object.values(nodes).find(n=>matchesDigitSpace(n.title));
    if(target){
      e.preventDefault();
      clearSel();selIds.add(target.id);applySel();
      focusSelected();
    }
  }

  // 矢印キー: 選択ノードを移動（1px、Shiftで10px）
  const arrowKeys=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
  if(arrowKeys.includes(e.key)&&selIds.size){
    e.preventDefault();
    if(!e.repeat&&!_arrowMoved){pushUndo();_arrowMoved=true;} // 押し始めの1回だけ移動前の状態を保存
    const step=e.shiftKey?10:1;
    const dx=e.key==='ArrowLeft'?-step:e.key==='ArrowRight'?step:0;
    const dy=e.key==='ArrowUp'?-step:e.key==='ArrowDown'?step:0;
    selIds.forEach(id=>{
      const n=nodes[id];const lb=labels.find(l=>l.id===id);const fr=frames.find(f=>f.id===id);
      const obj=n||lb||fr;if(!obj)return;
      obj.x+=dx;obj.y+=dy;
      const elId=n?'nd-'+id:lb?'lb-'+id:'fr-'+id;
      const el=document.getElementById(elId);
      if(el){el.style.left=obj.x+'px';el.style.top=obj.y+'px';}
    });
    renderEdges();markUnsaved();
  }
});
// 矢印キーを離した時にpersist（pushUndoはkeydown側の押し始めで実施済み）
document.addEventListener('keyup',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)&&_arrowMoved){
    _arrowMoved=false;
    persist();
  }
});
